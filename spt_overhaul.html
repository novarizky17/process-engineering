<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superintendent - Approval Overhaul</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        /* Mencegah layar bergeser keluar batas secara tidak sengaja */
        html, body { max-width: 100%; overflow-x: hidden; }
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        
        /* PERBAIKAN: Tinggi canvas tanda tangan diperkecil sangat drastis agar tidak makan tempat */
        .sig-canvas { border: 2px dashed #003366; background: #fff; width: 100%; height: 70px; touch-action: none; cursor: crosshair; border-radius: 8px; }
        .table-custom th { background: #003366; color: white; text-transform: uppercase; font-size: 0.8rem; padding: 12px; }
        .modal { display: none; position: fixed; z-index: 100; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 0.5rem; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
        
        .approved { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .rejected { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        /* CSS Khusus agar panah datalist tidak dobel di beberapa browser */
        input::-webkit-calendar-picker-indicator {
            opacity: 100;
            color: #003366;
        }

        /* Custom Scrollbar untuk tabel di HP */
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>

<header class="bg-[#003366] text-white p-3 md:p-4 flex flex-col md:flex-row justify-between items-center gap-3 shadow-lg">
    <div class="flex items-center gap-3 w-full md:w-auto">
        <button onclick="window.location.href='laporan.html'" class="text-[10px] md:text-xs font-bold bg-blue-800 px-3 md:px-4 py-2 rounded-xl hover:bg-blue-700 transition border border-white/20 uppercase whitespace-nowrap">← Dashboard</button>
        <h1 class="text-sm md:text-xl font-black uppercase tracking-tight truncate flex-1 text-center md:text-left">Superintendent Approval</h1>
    </div>
    <button onclick="fetchLaporan()" class="w-full md:w-auto bg-blue-600 px-5 py-2 rounded-xl hover:bg-blue-500 font-bold text-xs shadow-md transition-all uppercase tracking-wider">Refresh Data</button>
</header>

<div class="container mx-auto p-3 md:p-6">
    <div class="bg-white rounded-xl shadow-xl overflow-x-auto custom-scroll border border-gray-100">
        <table class="w-full text-left border-collapse table-custom min-w-[800px]">
            <thead>
                <tr>
                    <th class="px-5 py-3 whitespace-nowrap">Tanggal Input</th>
                    <th class="px-5 py-3 whitespace-nowrap">Nama Mesin</th>
                    <th class="px-5 py-3 whitespace-nowrap">Job Type</th>
                    <th class="px-5 py-3 whitespace-nowrap">Engineer</th>
                    <th class="px-5 py-3 text-center whitespace-nowrap">Status</th>
                    <th class="px-5 py-3 text-center whitespace-nowrap">Aksi</th>
                </tr>
            </thead>
            <tbody id="listLaporan">
                <tr><td colspan="6" class="p-8 text-center text-gray-400 italic">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalReview" class="modal">
    <!-- PERBAIKAN: Layout modal dibuat SUPER compact agar tidak ada scroll layar -->
    <div class="bg-white w-full max-w-4xl rounded-xl shadow-2xl overflow-hidden max-h-[98vh] flex flex-col">
        <div class="bg-slate-50 p-2 md:p-3 border-b flex justify-between items-center shrink-0">
            <h2 class="text-xs md:text-sm font-extrabold text-[#003366] uppercase truncate pr-4">Review Laporan</h2>
            <button onclick="closeModal()" class="text-xl font-light hover:text-red-500 transition leading-none">&times;</button>
        </div>
        
        <div class="p-2 md:p-3 overflow-y-auto flex-grow custom-scroll text-[10px]" id="modalContent"></div>

        <div id="approvalPanel" class="p-2 md:p-3 bg-slate-50 border-t shadow-inner shrink-0" style="display: none;">
            <div class="grid grid-cols-2 gap-2 mb-2">
                <div>
                    <label class="block text-[8px] font-black text-[#003366] uppercase mb-0.5">Pemeriksa (Superintendent)</label>
                    <input type="text" id="spt_name" list="nama_opsi" class="w-full border border-slate-300 rounded p-1.5 text-[10px] focus:border-blue-500 outline-none uppercase font-bold" placeholder="NAMA..." autocomplete="off">
                    <datalist id="nama_opsi">
                        <option value="A. RIZKI MUBAROK KULJAMIL">
                        <option value="SUPERINTENDENT LAIN">
                    </datalist>
                </div>

                <div>
                    <label class="block text-[8px] font-black text-[#003366] uppercase mb-0.5">Catatan (Wajib jika Reject)</label>
                    <!-- Teks area diganti jadi satu baris input agar irit tempat -->
                    <input type="text" id="spt_notes" class="w-full border border-slate-300 rounded p-1.5 text-[10px] focus:border-blue-500 outline-none transition-all" placeholder="Catatan evaluasi...">
                </div>
            </div>

            <div class="relative mb-2">
                <canvas id="sig-spt" class="sig-canvas shadow-sm"></canvas>
                <div class="absolute top-1 left-2 pointer-events-none">
                    <p class="font-bold text-slate-300 uppercase text-[8px] tracking-widest">Tanda Tangan Di Sini</p>
                </div>
                <button onclick="clearCanvas()" class="absolute top-1 right-1 text-[8px] bg-red-50 text-red-600 px-2 py-0.5 rounded shadow-sm font-black hover:bg-red-100 uppercase transition-all">Reset</button>
            </div>

            <div class="flex flex-row gap-2">
                <button onclick="processReview('Rejected')" class="flex-1 bg-white border border-red-500 text-red-600 py-1.5 rounded font-black text-[10px] hover:bg-red-50 transition-all uppercase">Reject</button>
                <button onclick="processReview('Approved')" class="flex-[2] bg-green-600 text-white py-1.5 rounded font-black text-[10px] hover:bg-green-700 shadow-md transition-all uppercase">Approve & Teruskan</button>
            </div>
        </div>

        <div id="historyPanel" class="p-3 md:p-4 bg-slate-50 border-t text-center shrink-0" style="display: none;">
            <div class="max-w-md mx-auto flex flex-col items-center">
                <p id="history_status_text" class="font-black uppercase mb-1 text-[10px] md:text-xs tracking-widest"></p>
                <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-sm mb-2 w-full text-left" id="history_box_color">
                    <p class="text-[8px] font-bold text-slate-400 uppercase mb-0.5">Pemeriksa & Catatan:</p>
                    <p id="view_spt_name" class="text-[10px] md:text-xs font-black text-slate-800 uppercase"></p>
                    <p id="view_spt_notes" class="text-[9px] md:text-[10px] italic text-slate-500 mt-0.5 leading-tight"></p>
                </div>
                <img id="view-sig-spt" class="h-12 md:h-16 mx-auto border border-slate-200 bg-white p-1 rounded-lg shadow-sm" alt="Signature">
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    let currentId = null;
    let canvas, ctx, drawing = false;

    function formatIndoDateTime(isoString) {
        if (!isoString) return "-";
        const date = new Date(isoString);
        return date.toLocaleString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':');
    }

    async function fetchLaporan() {
        const { data } = await _sb.from('laporan_maintenance').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('listLaporan');
        
        if (data) {
            list.innerHTML = data.map(row => {
                const s = row.status ? row.status.toLowerCase() : 'pending';
                let badgeClass = 'pending';
                if (s.includes('approve')) badgeClass = 'approved';
                if (s.includes('reject')) badgeClass = 'rejected';

                return `
                    <tr class="border-b hover:bg-slate-50 transition-colors text-xs md:text-sm">
                        <td class="p-3 md:p-4 font-medium text-slate-500 whitespace-nowrap">${new Date(row.created_at).toLocaleDateString('id-ID')}</td>
                        <td class="p-3 md:p-4 font-black text-slate-800 uppercase tracking-tight whitespace-nowrap">${row.nama_mesin || '-'}</td>
                        <td class="p-3 md:p-4 font-bold text-blue-600 italic whitespace-nowrap">${row.job_type || '-'}</td>
                        <td class="p-3 md:p-4 font-semibold text-slate-600 tracking-tight uppercase whitespace-nowrap">${row.engineer_name || '-'}</td>
                        <td class="p-3 md:p-4 text-center"><span class="status-badge ${badgeClass}">${row.status || 'Pending'}</span></td>
                        <td class="p-3 md:p-4 text-center">
                            <button onclick='openReview(${JSON.stringify(row)})' class="bg-[#003366] text-white px-3 md:px-4 py-1.5 md:py-2 rounded-lg text-[9px] md:text-[10px] font-black uppercase tracking-widest hover:bg-blue-900 transition-all shadow-sm">Review</button>
                        </td>
                    </tr>
                `}).join('');
        }
    }

    async function openReview(row) {
        currentId = row.id;
        const cont = document.getElementById('modalContent');
        
        const { data: prob } = await _sb.from('maintenance_problems').select('*').eq('maintenance_id', row.id);
        const { data: act } = await _sb.from('maintenance_actions').select('*').eq('maintenance_id', row.id);
        const { data: part } = await _sb.from('maintenance_parts').select('*').eq('maintenance_id', row.id);

        /* PERBAIKAN: Layout SUPER COMPACT dibuat agar semuanya muat di satu layar tanpa scroll */
        cont.innerHTML = `
            <div class="flex flex-wrap gap-1.5 mb-1.5 border bg-blue-50/50 p-2 rounded-lg border-blue-100 shadow-sm text-left">
                <div class="flex-1 min-w-[45%]"><p class="text-[7px] text-blue-400 uppercase font-black tracking-widest mb-0.5">Equipment</p><p class="font-black text-[#003366] text-[10px] uppercase truncate">${row.nama_mesin}</p></div>
                <div class="flex-1 min-w-[45%]"><p class="text-[7px] text-blue-400 uppercase font-black tracking-widest mb-0.5">Pekerjaan</p><p class="font-black text-blue-700 text-[10px] uppercase truncate">${row.job_type}</p></div>
                <div class="flex-1 min-w-[45%]"><p class="text-[7px] text-slate-400 uppercase font-black tracking-widest mb-0.5">Engineer</p><p class="font-bold text-slate-700 uppercase text-[9px] truncate">${row.engineer_name}</p></div>
                <div class="flex-1 min-w-[45%]"><p class="text-[7px] text-slate-400 uppercase font-black tracking-widest mb-0.5">Periode</p>
                     <p class="text-[8px] font-bold text-slate-700 leading-none">${formatIndoDateTime(row.jam_mulai).split(' ')[0]} - ${formatIndoDateTime(row.jam_selesai).split(' ')[0]}</p>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-1.5 mb-1.5 text-left">
                <div class="bg-white p-1.5 rounded-lg border border-slate-100 shadow-sm flex flex-col max-h-[70px]">
                     <p class="font-black text-[#003366] text-[8px] uppercase mb-1 shrink-0">1. Masalah:</p>
                     <ul class="list-disc pl-3 text-[8px] space-y-0.5 italic text-slate-600 overflow-y-auto custom-scroll">${prob.map(p => `<li>${p.description}</li>`).join('')}</ul>
                </div>
                <div class="bg-white p-1.5 rounded-lg border border-slate-100 shadow-sm flex flex-col max-h-[70px]">
                     <p class="font-black text-[#003366] text-[8px] uppercase mb-1 shrink-0">2. Tindakan:</p>
                     <ul class="list-disc pl-3 text-[8px] space-y-0.5 italic text-slate-600 overflow-y-auto custom-scroll">${act.map(a => `<li>${a.description}</li>`).join('')}</ul>
                </div>
            </div>
            
            <div class="mb-1.5 bg-white p-1.5 rounded-lg border border-slate-100 shadow-sm text-left flex flex-col max-h-[80px]">
                <p class="font-black text-[#003366] text-[8px] uppercase mb-0.5 shrink-0">3. Suku Cadang:</p>
                <div class="overflow-y-auto custom-scroll">
                    <table class="w-full text-[8px]">
                        <thead class="bg-slate-50 uppercase font-black text-slate-400 sticky top-0"><tr><th class="p-1 text-left">Part</th><th class="p-1 text-center">Qty</th><th class="p-1 text-center">Sts</th></tr></thead>
                        <tbody>${part.length ? part.map(pt => `<tr class="border-b border-slate-50"><td class="p-1 font-bold uppercase text-slate-700">${pt.nama_part}</td><td class="p-1 text-center font-black text-blue-600">${pt.qty}</td><td class="p-1 text-center font-bold text-slate-500 uppercase">${pt.tindak_lanjut}</td></tr>`).join('') : '<tr><td colspan="3" class="p-2 text-center italic text-slate-300">N/A</td></tr>'}</tbody>
                    </table>
                </div>
            </div>

            <div class="bg-amber-50 p-1.5 border-l-2 border-amber-400 rounded-lg text-left shadow-sm">
                <p class="text-[7px] font-black text-amber-700 uppercase mb-0.5 tracking-widest">Catatan Eng:</p>
                <p class="text-[9px] italic text-slate-700 font-medium leading-tight line-clamp-2">"${row.rekomendasi_catatan || '-'}"</p>
            </div>
        `;
        
        const st = row.status ? row.status.toLowerCase().trim() : 'pending';
        const isActuallyProcessed = st.includes('approve') || st.includes('reject');

        document.getElementById('approvalPanel').style.display = isActuallyProcessed ? 'none' : 'block';
        document.getElementById('historyPanel').style.display = isActuallyProcessed ? 'block' : 'none';
        
        if (isActuallyProcessed) {
            const hText = document.getElementById('history_status_text');
            const hBox = document.getElementById('history_box_color');
            const isApproved = st.includes('approve');
            
            hText.innerText = isApproved ? "✓ LAPORAN TELAH DISETUJUI" : "✘ LAPORAN TELAH DITOLAK";
            hText.className = isApproved ? "text-green-600 font-black uppercase mb-2 text-xs md:text-sm tracking-widest" : "text-red-600 font-black uppercase mb-2 text-xs md:text-sm tracking-widest";
            hBox.className = isApproved ? "bg-green-50 p-3 rounded-xl border border-green-100 shadow-sm mb-4 text-left" : "bg-red-50 p-3 rounded-xl border border-red-100 shadow-sm mb-4 text-left";
            
            document.getElementById('view_spt_name').innerText = row.spt_name || "-";
            document.getElementById('view_spt_notes').innerText = row.spt_notes || "Tidak ada catatan.";
            document.getElementById('view-sig-spt').src = row.signature_superintendent || "";
        } else {
            document.getElementById('spt_name').value = "";
            document.getElementById('spt_notes').value = "";
        }

        document.getElementById('modalReview').style.display = 'flex';
        
        canvas = document.getElementById('sig-spt');
        ctx = canvas.getContext('2d');
        setTimeout(() => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
        }, 100);
    }

    async function processReview(newStatus) {
        const signature = canvas.toDataURL();
        const name = document.getElementById('spt_name').value.trim();
        const notes = document.getElementById('spt_notes').value.trim();
        
        if (!name) return alert("Mohon isi Nama Superintendent!");
        
        const blank = document.createElement('canvas');
        blank.width = canvas.width; blank.height = canvas.height;
        if (signature === blank.toDataURL()) return alert("Tanda tangan wajib diisi!");
        if (newStatus === 'Rejected' && !notes) return alert("Wajib mengisi alasan jika laporan ditolak.");

        if(!confirm(`Simpan keputusan sebagai ${newStatus}?`)) return;

        const { error } = await _sb.from('laporan_maintenance')
            .update({ status: newStatus, signature_superintendent: signature, spt_name: name, spt_notes: notes })
            .eq('id', currentId);

        if (!error) { alert("Berhasil!"); closeModal(); fetchLaporan(); }
    }

    function clearCanvas() { if(ctx) ctx.clearRect(0,0,canvas.width,canvas.height); }
    function closeModal() { document.getElementById('modalReview').style.display = 'none'; clearCanvas(); }
    window.onload = fetchLaporan;

    // Signature Logic
    function getP(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; }
    document.addEventListener('mousedown', (e) => { if(e.target === canvas) { drawing=true; const p=getP(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }});
    document.addEventListener('mousemove', (e) => { if(drawing && e.target === canvas) { const p=getP(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }});
    window.addEventListener('mouseup', () => drawing=false);
    document.addEventListener('touchstart', (e) => { if(e.target === canvas) { e.preventDefault(); drawing=true; const p=getP(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }}, {passive:false});
    document.addEventListener('touchmove', (e) => { if(drawing && e.target === canvas) { e.preventDefault(); const p=getP(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }}, {passive:false});
</script>
</body>
</html>
