<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superintendent - Approval Overhaul</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .sig-canvas { border: 2px dashed #003366; background: #fff; width: 100%; height: 160px; touch-action: none; cursor: crosshair; border-radius: 8px; }
        .table-custom th { background: #003366; color: white; text-transform: uppercase; font-size: 0.8rem; padding: 12px; }
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 100; 
            inset: 0; 
            background: rgba(0,0,0,0.6); 
            align-items: center; 
            justify-content: center; 
            padding: 1rem; 
        }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .approved { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .rejected { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<header class="bg-[#003366] text-white p-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-4">
        <button onclick="window.location.href='laporan.html'" class="text-xs font-bold bg-blue-800 px-4 py-2 rounded-xl hover:bg-blue-700 transition border border-white/20 uppercase">← Dashboard</button>
        <h1 class="text-xl font-black uppercase tracking-tight">Superintendent Approval</h1>
    </div>
    <button onclick="fetchLaporan()" class="bg-blue-600 px-5 py-2 rounded-xl hover:bg-blue-500 font-bold text-xs shadow-md transition-all uppercase">Refresh Data</button>
</header>

<div class="container mx-auto p-6">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <table class="w-full text-left border-collapse table-custom">
            <thead>
                <tr>
                    <th class="px-6">Tanggal</th>
                    <th class="px-6">Mesin</th>
                    <th class="px-6">Job Type</th>
                    <th class="px-6">Engineer</th>
                    <th class="px-6 text-center">Status</th>
                    <th class="px-6 text-center">Aksi</th>
                </tr>
            </thead>
            <tbody id="listLaporan">
                <tr><td colspan="6" class="p-12 text-center text-gray-400 italic">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalReview" class="modal">
    <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden max-h-[95vh] flex flex-col">
        <div class="bg-slate-50 p-5 border-b flex justify-between items-center">
            <h2 class="text-lg font-extrabold text-[#003366] uppercase">Detail Laporan</h2>
            <button onclick="closeModal()" class="text-3xl font-light hover:text-red-500 transition">&times;</button>
        </div>
        
        <div class="p-6 overflow-y-auto flex-grow" id="modalContent"></div>

        <div id="approvalPanel" class="p-8 bg-slate-50 border-t shadow-inner">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-[10px] font-black text-[#003366] uppercase mb-1">Nama Superintendent</label>
                    <input type="text" id="spt_name" class="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none uppercase font-bold" placeholder="NAMA ANDA">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-[#003366] uppercase mb-1">Catatan</label>
                    <textarea id="spt_notes" class="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none resize-none" rows="2" placeholder="Evaluasi teknis..."></textarea>
                </div>
            </div>

            <p class="font-bold text-slate-400 mb-2 text-center uppercase text-[9px] tracking-widest">Bubuhkan Tanda Tangan</p>
            <div class="relative">
                <canvas id="sig-spt" class="sig-canvas mb-4 shadow-sm"></canvas>
                <button onclick="clearCanvas()" class="absolute top-2 right-2 text-[10px] bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-black hover:bg-red-100 uppercase">Reset</button>
            </div>

            <div class="flex gap-4">
                <button onclick="processReview('Rejected')" class="flex-1 bg-white border-2 border-red-500 text-red-600 py-4 rounded-2xl font-black text-xs hover:bg-red-50 transition-all uppercase">Reject</button>
                <button onclick="processReview('Approved')" class="flex-[2] bg-green-600 text-white py-4 rounded-2xl font-black text-xs hover:bg-green-700 shadow-xl transition-all uppercase">Approve & Selesaikan</button>
            </div>
        </div>

        <div id="historyPanel" class="p-8 bg-slate-50 border-t text-center" style="display: none;">
            <div class="max-w-md mx-auto">
                <p id="history_status_text" class="font-black uppercase mb-3 text-sm tracking-widest"></p>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 text-left" id="history_box_color">
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Pemeriksa & Catatan:</p>
                    <p id="view_spt_name" class="text-sm font-black text-slate-800 uppercase"></p>
                    <p id="view_spt_notes" class="text-xs italic text-slate-500 mt-2"></p>
                </div>
                <img id="view-sig-spt" class="h-28 mx-auto border-2 border-slate-100 bg-white p-2 rounded-2xl shadow-md" alt="Signature">
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    let currentId = null;
    let canvas, ctx, drawing = false;

    async function fetchLaporan() {
        const { data } = await _sb.from('laporan_maintenance').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('listLaporan');
        
        if (data) {
            list.innerHTML = data.map(row => {
                let badgeClass = 'pending';
                if (row.status.includes('Approved')) badgeClass = 'approved';
                if (row.status === 'Rejected') badgeClass = 'rejected';

                return `
                    <tr class="border-b hover:bg-slate-50 transition-colors text-sm">
                        <td class="p-5 font-medium text-slate-500">${new Date(row.created_at).toLocaleDateString()}</td>
                        <td class="p-5 font-black text-slate-800 uppercase">${row.nama_mesin || '-'}</td>
                        <td class="p-5 font-bold text-blue-600">${row.job_type || '-'}</td>
                        <td class="p-5 font-semibold text-slate-600">${row.engineer_name || '-'}</td>
                        <td class="p-5 text-center"><span class="status-badge ${badgeClass}">${row.status}</span></td>
                        <td class="p-5 text-center">
                            <button onclick='openReview(${JSON.stringify(row)})' class="bg-[#003366] text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-blue-900 shadow-md">Review</button>
                        </td>
                    </tr>
                `}).join('');
        }
    }

    async function openReview(row) {
        currentId = row.id;
        const cont = document.getElementById('modalContent');
        
        // Load data tambahan (problems, actions, parts)
        const { data: prob } = await _sb.from('maintenance_problems').select('*').eq('maintenance_id', row.id);
        const { data: act } = await _sb.from('maintenance_actions').select('*').eq('maintenance_id', row.id);
        const { data: part } = await _sb.from('maintenance_parts').select('*').eq('maintenance_id', row.id);

        cont.innerHTML = `
            <div class="grid grid-cols-2 gap-6 mb-8 border bg-blue-50/50 p-6 rounded-3xl border-blue-100">
                <div><p class="text-[9px] text-blue-400 uppercase font-black mb-1 tracking-widest">Machine</p><p class="font-black text-[#003366] text-xl uppercase">${row.nama_mesin}</p></div>
                <div><p class="text-[9px] text-blue-400 uppercase font-black mb-1 tracking-widest">Job Type</p><p class="font-black text-blue-700 text-xl uppercase">${row.job_type}</p></div>
                <div><p class="text-[9px] text-slate-400 uppercase font-black mb-1 tracking-widest">Engineer</p><p class="font-bold text-slate-700 uppercase">${row.engineer_name}</p></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="bg-white p-4 rounded-2xl border shadow-sm"><p class="font-black text-[#003366] text-[10px] uppercase tracking-wider mb-2">Masalah:</p>
                    <ul class="list-disc pl-5 text-xs text-slate-600 italic">${prob.map(p => `<li>${p.description}</li>`).join('')}</ul>
                </div>
                <div class="bg-white p-4 rounded-2xl border shadow-sm"><p class="font-black text-[#003366] text-[10px] uppercase tracking-wider mb-2">Tindakan:</p>
                    <ul class="list-disc pl-5 text-xs text-slate-600 italic">${act.map(a => `<li>${a.description}</li>`).join('')}</ul>
                </div>
            </div>
        `;
        
        // PENGECEKAN STATUS: Tampilkan tombol HANYA jika status murni 'Pending'
        const isStillPending = (row.status === 'Pending');
        
        document.getElementById('approvalPanel').style.display = isStillPending ? 'block' : 'none';
        document.getElementById('historyPanel').style.display = isStillPending ? 'none' : 'block';
        
        if (!isStillPending) {
            document.getElementById('history_status_text').innerText = row.status.includes('Approved') ? "✓ DISETUJUI" : "✘ DITOLAK";
            document.getElementById('view_spt_name').innerText = row.spt_name || "-";
            document.getElementById('view_spt_notes').innerText = row.spt_notes || "-";
            document.getElementById('view-sig-spt').src = row.signature_superintendent || "";
        }

        document.getElementById('modalReview').style.display = 'flex';
        
        // Inisialisasi Canvas
        canvas = document.getElementById('sig-spt');
        ctx = canvas.getContext('2d');
        setTimeout(() => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 3; ctx.lineCap = 'round';
        }, 100);
    }

    async function processReview(newStatus) {
        const name = document.getElementById('spt_name').value.trim();
        const notes = document.getElementById('spt_notes').value.trim();
        const signature = canvas.toDataURL();
        
        if (!name) return alert("Isi Nama Superintendent!");
        
        const { error } = await _sb.from('laporan_maintenance').update({ 
            status: newStatus, 
            signature_superintendent: signature,
            spt_name: name,
            spt_notes: notes 
        }).eq('id', currentId);

        if (!error) { alert("Berhasil!"); closeModal(); fetchLaporan(); }
    }

    function clearCanvas() { ctx.clearRect(0,0,canvas.width,canvas.height); }
    function closeModal() { document.getElementById('modalReview').style.display = 'none'; }
    window.onload = fetchLaporan;

    // Tanda Tangan Logic
    function getP(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; }
    document.addEventListener('mousedown', (e) => { if(e.target === canvas) { drawing=true; const p=getP(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }});
    document.addEventListener('mousemove', (e) => { if(drawing && e.target === canvas) { const p=getP(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }});
    window.addEventListener('mouseup', () => drawing=false);
    document.addEventListener('touchstart', (e) => { if(e.target === canvas) { e.preventDefault(); drawing=true; const p=getP(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }}, {passive:false});
    document.addEventListener('touchmove', (e) => { if(drawing && e.target === canvas) { e.preventDefault(); const p=getP(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }}, {passive:false});
</script>
</body>
</html>
