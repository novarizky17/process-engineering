<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superintendent - Approval Overhaul</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .sig-canvas { border: 2px dashed #003366; background: #fff; width: 100%; height: 160px; touch-action: none; cursor: crosshair; border-radius: 8px; }
        .table-custom th { background: #003366; color: white; text-transform: uppercase; font-size: 0.8rem; padding: 12px; }
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 100; 
            inset: 0; 
            background: rgba(0,0,0,0.6); 
            align-items: center; 
            justify-content: center; 
            padding: 1rem; 
        }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .approved { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .rejected { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<header class="bg-[#003366] text-white p-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-4">
        <button onclick="window.location.href='laporan.html'" class="text-xs font-bold bg-blue-800 px-4 py-2 rounded-xl hover:bg-blue-700 transition border border-white/20 uppercase tracking-wider">← Dashboard</button>
        <h1 class="text-xl font-black uppercase tracking-tight">Superintendent Approval</h1>
    </div>
    <button onclick="fetchLaporan()" class="bg-blue-600 px-5 py-2 rounded-xl hover:bg-blue-500 font-bold text-xs shadow-md transition-all uppercase tracking-widest">Refresh Data</button>
</header>

<div class="container mx-auto p-6">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <table class="w-full text-left border-collapse table-custom">
            <thead>
                <tr>
                    <th class="px-6">Tanggal Input</th>
                    <th class="px-6">Nama Mesin</th>
                    <th class="px-6">Job Type</th>
                    <th class="px-6">Engineer</th>
                    <th class="px-6 text-center">Status</th>
                    <th class="px-6 text-center">Aksi</th>
                </tr>
            </thead>
            <tbody id="listLaporan">
                <tr><td colspan="6" class="p-12 text-center text-gray-400 italic">Memuat data dari database...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalReview" class="modal">
    <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden max-h-[95vh] flex flex-col">
        <div class="bg-slate-50 p-5 border-b flex justify-between items-center">
            <h2 class="text-lg font-extrabold text-[#003366] uppercase tracking-tight">Detail Review Laporan</h2>
            <button onclick="closeModal()" class="text-3xl font-light hover:text-red-500 transition leading-none">&times;</button>
        </div>
        
        <div class="p-6 overflow-y-auto flex-grow" id="modalContent"></div>

        <div id="approvalPanel" class="p-8 bg-slate-50 border-t shadow-inner" style="display: none;">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-[#003366] uppercase tracking-widest">Pemeriksa (Superintendent)</label>
                    <input type="text" id="spt_name" class="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none uppercase font-bold transition-all" placeholder="MASUKKAN NAMA ANDA">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-[#003366] uppercase tracking-widest">Catatan / Rekomendasi (Wajib jika Reject)</label>
                    <textarea id="spt_notes" class="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none transition-all resize-none" rows="2" placeholder="Tulis instruksi atau evaluasi jika diperlukan..."></textarea>
                </div>
            </div>

            <p class="font-bold text-slate-400 mb-2 text-center uppercase text-[9px] tracking-[0.3em]">Bubuhkan Tanda Tangan Di Bawah Ini</p>
            <div class="relative group">
                <canvas id="sig-spt" class="sig-canvas mb-4 shadow-sm"></canvas>
                <button onclick="clearCanvas()" class="absolute top-2 right-2 text-[10px] bg-red-50 text-red-600 px-3 py-1.5 rounded-lg shadow-sm font-black hover:bg-red-100 transition-all uppercase">Reset TTD</button>
            </div>

            <div class="flex gap-4">
                <button onclick="processReview('Rejected')" class="flex-1 bg-white border-2 border-red-500 text-red-600 py-4 rounded-2xl font-black text-xs hover:bg-red-50 transition-all uppercase tracking-widest">Reject Laporan</button>
                <button onclick="processReview('Approved')" class="flex-[2] bg-green-600 text-white py-4 rounded-2xl font-black text-xs hover:bg-green-700 shadow-xl shadow-green-200 transition-all uppercase tracking-widest">Approve & Teruskan</button>
            </div>
        </div>

        <div id="historyPanel" class="p-8 bg-slate-50 border-t text-center" style="display: none;">
            <div class="max-w-md mx-auto">
                <p id="history_status_text" class="font-black uppercase mb-3 text-sm tracking-[0.2em]"></p>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 text-left" id="history_box_color">
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-1 tracking-widest">Pemeriksa & Catatan:</p>
                    <p id="view_spt_name" class="text-sm font-black text-slate-800 uppercase"></p>
                    <p id="view_spt_notes" class="text-xs italic text-slate-500 mt-2 leading-relaxed"></p>
                </div>
                <img id="view-sig-spt" class="h-28 mx-auto border-2 border-slate-100 bg-white p-2 rounded-2xl shadow-md" alt="Signature">
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    let currentId = null;
    let canvas, ctx, drawing = false;

    function formatIndoDateTime(isoString) {
        if (!isoString) return "-";
        const date = new Date(isoString);
        return date.toLocaleString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':');
    }

    async function fetchLaporan() {
        const { data } = await _sb.from('laporan_maintenance').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('listLaporan');
        
        if (data) {
            list.innerHTML = data.map(row => {
                const s = row.status ? row.status.toLowerCase() : 'pending';
                let badgeClass = 'pending';
                if (s.includes('approve')) badgeClass = 'approved';
                if (s.includes('reject')) badgeClass = 'rejected';

                return `
                    <tr class="border-b hover:bg-slate-50 transition-colors text-sm">
                        <td class="p-5 font-medium text-slate-500">${new Date(row.created_at).toLocaleDateString('id-ID')}</td>
                        <td class="p-5 font-black text-slate-800 uppercase tracking-tight">${row.nama_mesin || '-'}</td>
                        <td class="p-5 font-bold text-blue-600 italic">${row.job_type || '-'}</td>
                        <td class="p-5 font-semibold text-slate-600">${row.engineer_name || '-'}</td>
                        <td class="p-5 text-center"><span class="status-badge ${badgeClass}">${row.status || 'Pending'}</span></td>
                        <td class="p-5 text-center">
                            <button onclick='openReview(${JSON.stringify(row)})' class="bg-[#003366] text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-900 transition-all shadow-md">Review</button>
                        </td>
                    </tr>
                `}).join('');
        }
    }

    async function openReview(row) {
        currentId = row.id;
        const cont = document.getElementById('modalContent');
        
        const { data: prob } = await _sb.from('maintenance_problems').select('*').eq('maintenance_id', row.id);
        const { data: act } = await _sb.from('maintenance_actions').select('*').eq('maintenance_id', row.id);
        const { data: part } = await _sb.from('maintenance_parts').select('*').eq('maintenance_id', row.id);

        cont.innerHTML = `
            <div class="grid grid-cols-2 gap-6 mb-8 border bg-blue-50/50 p-6 rounded-3xl border-blue-100 shadow-sm">
                <div><p class="text-[9px] text-blue-400 uppercase font-black tracking-widest mb-1">Equipment</p><p class="font-black text-[#003366] text-xl uppercase text-left">${row.nama_mesin}</p></div>
                <div><p class="text-[9px] text-blue-400 uppercase font-black tracking-widest mb-1">Pekerjaan</p><p class="font-black text-blue-700 text-xl uppercase text-left">${row.job_type}</p></div>
                <div><p class="text-[9px] text-slate-400 uppercase font-black tracking-widest mb-1">Engineer</p><p class="font-bold text-slate-700 uppercase text-left">${row.engineer_name}</p></div>
                <div><p class="text-[9px] text-slate-400 uppercase font-black tracking-widest mb-1">Periode</p>
                     <p class="text-[10px] font-bold text-slate-700">${formatIndoDateTime(row.jam_mulai)} s/d ${formatIndoDateTime(row.jam_selesai)}</p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6 text-left">
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm"><p class="font-black text-[#003366] text-[10px] uppercase mb-2">1. Masalah:</p>
                     <ul class="list-disc pl-5 text-xs space-y-2 italic text-slate-600">${prob.map(p => `<li>${p.description}</li>`).join('')}</ul>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm"><p class="font-black text-[#003366] text-[10px] uppercase mb-2">2. Tindakan:</p>
                     <ul class="list-disc pl-5 text-xs space-y-2 italic text-slate-600">${act.map(a => `<li>${a.description}</li>`).join('')}</ul>
                </div>
            </div>
            
            <div class="mb-6 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-left">
                <p class="font-black text-[#003366] text-[10px] uppercase mb-2">3. Suku Cadang:</p>
                <table class="w-full text-[10px]">
                    <thead class="bg-slate-50 uppercase font-black text-slate-400"><tr><th class="p-2">Part</th><th class="p-2 text-center">Qty</th><th class="p-2 text-center">Status</th></tr></thead>
                    <tbody>${part.length ? part.map(pt => `<tr class="border-b border-slate-50"><td class="p-2 font-bold uppercase">${pt.nama_part}</td><td class="p-2 text-center font-black text-blue-600">${pt.qty}</td><td class="p-2 text-center"><span class="bg-slate-100 px-2 py-0.5 rounded-full font-black text-[8px] uppercase">${pt.tindak_lanjut}</span></td></tr>`).join('') : '<tr><td colspan="3" class="p-4 text-center italic text-slate-300">Tidak ada penggantian part</td></tr>'}</tbody>
                </table>
            </div>

            <div class="bg-amber-50 p-5 border-l-4 border-amber-400 rounded-xl text-left">
                <p class="text-[9px] font-black text-amber-700 uppercase mb-2 tracking-widest">Catatan Engineer:</p>
                <p class="text-sm italic text-slate-700 font-medium leading-relaxed">"${row.rekomendasi_catatan || '-'}"</p>
            </div>
        `;
        
        // --- PERBAIKAN LOGIKA STATUS CASE INSENSITIVE ---
        const s = row.status ? row.status.toLowerCase() : 'pending';
        const isActuallyPending = (s === 'pending');
        
        document.getElementById('approvalPanel').style.display = isActuallyPending ? 'block' : 'none';
        document.getElementById('historyPanel').style.display = isActuallyPending ? 'none' : 'block';
        
        if (!isActuallyPending) {
            const hText = document.getElementById('history_status_text');
            const isApproved = s.includes('approve');
            
            hText.innerText = isApproved ? "✓ LAPORAN TELAH DISETUJUI" : "✘ LAPORAN TELAH DITOLAK";
            hText.className = isApproved ? "text-green-600 font-black uppercase mb-3 text-sm tracking-widest" : "text-red-600 font-black uppercase mb-3 text-sm tracking-widest";
            
            document.getElementById('view_spt_name').innerText = row.spt_name || "-";
            document.getElementById('view_spt_notes').innerText = row.spt_notes || "Tidak ada catatan.";
            document.getElementById('view-sig-spt').src = row.signature_superintendent || "";
        } else {
            // Reset form jika data baru
            document.getElementById('spt_name').value = "";
            document.getElementById('spt_notes').value = "";
        }

        document.getElementById('modalReview').style.display = 'flex';
        
        canvas = document.getElementById('sig-spt');
        ctx = canvas.getContext('2d');
        setTimeout(() => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
        }, 100);
    }

    async function processReview(newStatus) {
        const name = document.getElementById('spt_name').value.trim();
        const notes = document.getElementById('spt_notes').value.trim();
        const signature = canvas.toDataURL();
        const blank = document.createElement('canvas');
        blank.width = canvas.width; blank.height = canvas.height;
        
        if (!name) return alert("Wajib isi Nama Superintendent!");
        if (signature === blank.toDataURL()) return alert("Tanda tangan wajib diisi!");
        if (newStatus === 'Rejected' && !notes) return alert("Mohon isi alasan penolakan.");

        if(!confirm(`Simpan keputusan sebagai ${newStatus}?`)) return;

        const { error } = await _sb.from('laporan_maintenance')
            .update({ status: newStatus, signature_superintendent: signature, spt_name: name, spt_notes: notes })
            .eq('id', currentId);

        if (!error) { alert("Berhasil!"); closeModal(); fetchLaporan(); }
    }

    function clearCanvas() { if(ctx) ctx.clearRect(0,0,canvas.width,canvas.height); }
    function closeModal() { document.getElementById('modalReview').style.display = 'none'; clearCanvas(); }
    window.onload = fetchLaporan;

    // Tanda Tangan Logic
    function getP(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; }
    document.addEventListener('mousedown', (e) => { if(e.target === canvas) { drawing=true; const p=getP(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }});
    document.addEventListener('mousemove', (e) => { if(drawing && e.target === canvas) { const p=getP(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }});
    window.addEventListener('mouseup', () => drawing=false);
    document.addEventListener('touchstart', (e) => { if(e.target === canvas) { e.preventDefault(); drawing=true; const p=getP(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }}, {passive:false});
    document.addEventListener('touchmove', (e) => { if(drawing && e.target === canvas) { e.preventDefault(); const p=getP(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }}, {passive:false});
</script>
</body>
</html>
