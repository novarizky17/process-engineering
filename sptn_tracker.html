<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superintendent - Project Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .gradient-navy { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .edit-input { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; width: 100%; font-size: 11px; outline: none; transition: all 0.2s; }
        .edit-input:hover { border-color: #cbd5e1; background: #fff; }
        .edit-input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="gradient-navy w-full pt-10 pb-20 px-8 mb-[-60px] shadow-2xl">
        <div class="max-w-[98%] mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight uppercase">Project Control Panel</h1>
                <p class="text-slate-400 text-xs mt-1 font-medium tracking-wide">Monitoring & Penugasan Personil Support</p>
            </div>
            <div class="flex gap-3">
                <a href="management_tracker.html" class="bg-white/10 hover:bg-white/20 text-white px-5 py-2 rounded-xl font-bold text-[10px] uppercase transition-all border border-white/10">Kembali</a>
            </div>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto px-6">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 relative z-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-blue-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">In Progress</p>
                <h3 id="stat-progress" class="text-3xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-amber-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pending</p>
                <h3 id="stat-pending" class="text-3xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-rose-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hold</p>
                <h3 id="stat-hold" class="text-3xl font-black text-rose-600">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-emerald-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Selesai</p>
                <h3 id="stat-done" class="text-3xl font-black text-emerald-600">0</h3>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm mb-8 border border-slate-200">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-1.5 h-5 bg-blue-600 rounded-full"></div>
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Assign Project Baru</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
                <div class="md:col-span-1">
                    <label class="text-[9px] font-bold text-slate-400 uppercase ml-1">Project Name</label>
                    <input type="text" id="in-project" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs outline-none focus:border-blue-500">
                </div>
                <div class="md:col-span-1">
                    <label class="text-[9px] font-bold text-slate-400 uppercase ml-1">Tugas</label>
                    <input type="text" id="in-tugas" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-400 uppercase ml-1">Assigned To</label>
                    <select id="in-name" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs outline-none">
                        <option value="">Pilih Personil</option>
                        <option value="RYAN">RYAN</option>
                        <option value="ISQI">ISQI</option>
                        <option value="JUMAWAN">JUMAWAN</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-400 uppercase ml-1">Priority</label>
                    <select id="in-priority" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold outline-none">
                        <option value="Low">Low</option>
                        <option value="Mid" selected>Mid</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-400 uppercase ml-1">Target Due</label>
                    <input type="date" id="in-due" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs outline-none">
                </div>
                <div class="flex items-end">
                    <button onclick="saveToDatabase()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold text-[10px] uppercase shadow-md transition-all active:scale-95">Assign</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold tracking-widest border-b border-slate-100">
                            <th class="px-6 py-4">Project / Tugas</th>
                            <th class="px-4 py-4 text-center">Priority</th>
                            <th class="px-4 py-4 text-center">Personil</th>
                            <th class="px-4 py-4 text-center">Due Date</th>
                            <th class="px-4 py-4 text-center">Status</th>
                            <th class="px-4 py-4 text-center">Over Date</th>
                            <th class="px-6 py-4">Activity / Keterangan</th>
                            <th class="px-4 py-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="project-body" class="divide-y divide-slate-50 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        async function saveToDatabase() {
            const project = document.getElementById('in-project').value;
            const tugas = document.getElementById('in-tugas').value;
            const name = document.getElementById('in-name').value;
            const priority = document.getElementById('in-priority').value;
            const due = document.getElementById('in-due').value;

            if(!project || !name || !due) return alert("Lengkapi data!");

            const { error } = await _sb.from('management_tracker').insert([{ 
                project_name: project, task_desc: tugas, assigned_to: name, priority: priority, due_date: due, status: 'Pending' 
            }]);

            if (error) alert(error.message);
            else { fetchProjectData(); clearInputs(); }
        }

        function clearInputs() {
            document.getElementById('in-project').value = "";
            document.getElementById('in-tugas').value = "";
            document.getElementById('in-due').value = "";
        }

        async function fetchProjectData() {
            const { data, error } = await _sb.from('management_tracker').select('*').order('created_at', { ascending: false });
            if (error) return;

            // Update Statistik
            document.getElementById('stat-progress').innerText = data.filter(r => r.status === 'In Progress').length;
            document.getElementById('stat-pending').innerText = data.filter(r => r.status === 'Pending').length;
            document.getElementById('stat-hold').innerText = data.filter(r => r.status === 'Hold').length;
            document.getElementById('stat-done').innerText = data.filter(r => r.status === 'Done').length;

            const tbody = document.getElementById('project-body');
            tbody.innerHTML = data.map(row => {
                const today = new Date();
                today.setHours(0,0,0,0);
                const dueDate = new Date(row.due_date);
                const endDate = row.actual_finish ? new Date(row.actual_finish) : today;
                const diffDays = Math.ceil((endDate - dueDate) / (1000 * 60 * 60 * 24));

                let overDateContent = '';
                if (row.status === 'Done') {
                    overDateContent = diffDays > 0 ? 
                        `<span class="text-red-500 font-bold text-[10px]">LATE ${diffDays}D</span>` : 
                        '<span class="text-emerald-500 font-bold text-[10px]">ON TIME</span>';
                } else {
                    overDateContent = diffDays > 0 ? 
                        `<span class="text-red-600 font-black text-[10px] underline decoration-double">${diffDays} Days Late</span>` : 
                        '<span class="text-slate-300 italic text-[10px]">On Schedule</span>';
                }

                let pClass = row.priority === 'High' ? "text-red-600 bg-red-50 border-red-100" : (row.priority === 'Mid' ? "text-blue-600 bg-blue-50 border-blue-100" : "text-slate-500 bg-slate-50 border-slate-100");
                let sClass = row.status === 'Done' ? "bg-emerald-500 text-white" : (row.status === 'Hold' ? "bg-rose-500 text-white" : (row.status === 'In Progress' ? "bg-blue-500 text-white" : "bg-slate-400 text-white"));

                return `
                    <tr class="hover:bg-slate-50/50 transition-colors">
                        <td class="px-6 py-4">
                            <input type="text" value="${row.project_name}" onchange="updateInline('${row.id}', 'project_name', this.value)" class="edit-input font-bold uppercase text-slate-800">
                            <input type="text" value="${row.task_desc || ''}" onchange="updateInline('${row.id}', 'task_desc', this.value)" class="edit-input italic text-slate-400 mt-0.5">
                        </td>
                        <td class="px-4 py-4 text-center">
                            <select onchange="updateInline('${row.id}', 'priority', this.value)" class="text-[9px] font-black uppercase rounded-lg border px-2 py-1 ${pClass}">
                                <option value="Low" ${row.priority === 'Low' ? 'selected' : ''}>Low</option>
                                <option value="Mid" ${row.priority === 'Mid' ? 'selected' : ''}>Mid</option>
                                <option value="High" ${row.priority === 'High' ? 'selected' : ''}>High</option>
                            </select>
                        </td>
                        <td class="px-4 py-4 text-center">
                            <select onchange="updateInline('${row.id}', 'assigned_to', this.value)" class="text-[10px] font-bold uppercase rounded-lg border px-2 py-1">
                                <option value="RYAN" ${row.assigned_to === 'RYAN' ? 'selected' : ''}>RYAN</option>
                                <option value="ISQI" ${row.assigned_to === 'ISQI' ? 'selected' : ''}>ISQI</option>
                                <option value="JUMAWAN" ${row.assigned_to === 'JUMAWAN' ? 'selected' : ''}>JUMAWAN</option>
                            </select>
                        </td>
                        <td class="px-4 py-4 text-center">
                            <input type="date" value="${row.due_date}" onchange="updateInline('${row.id}', 'due_date', this.value)" class="text-[10px] font-bold border rounded-lg px-2 py-1">
                        </td>
                        <td class="px-4 py-4 text-center">
                            <span class="px-3 py-1 rounded-full font-black text-[8px] uppercase ${sClass}">${row.status}</span>
                        </td>
                        <td class="px-4 py-4 text-center font-bold">${overDateContent}</td>
                        <td class="px-6 py-4">
                            <p class="text-slate-600 text-[10px] font-bold uppercase">${row.worker_comment || '-'}</p>
                            <p class="text-rose-500 italic text-[10px] mt-0.5">${row.hold_reason || '-'}</p>
                        </td>
                        <td class="px-4 py-4 text-center">
                            <button onclick="deleteData('${row.id}')" class="text-slate-300 hover:text-red-500 transition-colors p-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function updateInline(id, field, value) {
            const { error } = await _sb.from('management_tracker').update({ [field]: value }).eq('id', id);
            if (error) alert("Update gagal!"); else fetchProjectData();
        }

        async function deleteData(id) {
            if(confirm('Hapus data ini?')) {
                await _sb.from('management_tracker').delete().eq('id', id);
                fetchProjectData();
            }
        }

        window.onload = fetchProjectData;
    </script>
</body>
</html>
