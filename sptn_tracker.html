<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superintendent Tracker - Project Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .gradient-navy { background: linear-gradient(135deg, #001f3f 0%, #003366 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .edit-input { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 4px 8px; width: 100%; font-size: 11px; outline: none; transition: all 0.2s; }
        .edit-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 2% auto; padding: 24px; border-radius: 20px; width: 95%; max-width: 650px; animation: slideIn 0.3s; }
        @keyframes slideIn { from {transform: translateY(-20px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="gradient-navy w-full pt-12 pb-24 px-8 mb-[-80px] shadow-2xl">
        <div class="max-w-[98%] mx-auto flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight uppercase">Project Control Panel</h1>
                <p class="text-blue-200 text-sm mt-1 font-medium tracking-wide">Pemberian Tugas & Monitoring Real-time</p>
            </div>
            <a href="management_tracker.html" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase transition-all border border-white/20">Kembali</a>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto px-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 relative z-10">
            <div class="bg-white p-6 rounded-3xl shadow-xl border-l-8 border-blue-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">In Progress</p>
                <h3 id="stat-progress" class="text-3xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl border-l-8 border-amber-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pending</p>
                <h3 id="stat-pending" class="text-3xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl border-l-8 border-rose-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hold</p>
                <h3 id="stat-hold" class="text-3xl font-black text-rose-600">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl border-l-8 border-emerald-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Selesai</p>
                <h3 id="stat-done" class="text-3xl font-black text-emerald-600">0</h3>
            </div>
        </div>

        <div class="glass-card p-8 rounded-3xl shadow-xl mb-10 relative z-10">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                <h2 class="text-lg font-bold text-slate-800 uppercase tracking-wider">Assign Project Baru</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4">
                <div class="space-y-2"><label class="text-[10px] font-bold text-slate-500 uppercase">Project Name</label><input type="text" id="in-project" class="edit-input !p-3 !text-sm"></div>
                <div class="space-y-2"><label class="text-[10px] font-bold text-slate-500 uppercase">Tugas</label><input type="text" id="in-tugas" class="edit-input !p-3 !text-sm"></div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Assigned To</label>
                    <select id="in-name" class="edit-input !p-3 !text-sm">
                        <option value="">Pilih Personil</option>
                        <option value="RYAN">RYAN</option>
                        <option value="ISQI">ISQI</option>
                        <option value="JUMAWAN">JUMAWAN</option>
                        <option value="EKO">EKO</option>
                        <option value="TATA">TATA</option>
                        <option value="BAROK">BAROK</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Priority</label>
                    <select id="in-priority" class="edit-input !p-3 !text-sm">
                        <option value="Low">Low</option><option value="Mid" selected>Mid</option><option value="High">High</option>
                    </select>
                </div>
                <div class="space-y-2"><label class="text-[10px] font-bold text-slate-500 uppercase">Start Date</label><input type="date" id="in-start" class="edit-input !p-3 !text-sm"></div>
                <div class="space-y-2"><label class="text-[10px] font-bold text-slate-500 uppercase">Target Due</label><input type="date" id="in-due" class="edit-input !p-3 !text-sm"></div>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="saveToDatabase()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-2xl font-extrabold text-xs uppercase shadow-lg transition-all transform active:scale-95">Assign Project</button>
            </div>
        </div>

        <div class="flex items-center gap-4 mb-6">
            <div class="flex-grow relative">
                <input type="text" id="search-input" oninput="filterTable()" placeholder="Cari berdasarkan nama project atau tugas..." class="w-full bg-white border border-slate-200 pl-4 pr-4 py-3 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all shadow-sm">
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold tracking-widest border-b border-slate-100">
                            <th class="px-6 py-5">Project</th>
                            <th class="px-4 py-5 text-center">Priority</th>
                            <th class="px-4 py-5 text-center">Personil</th>
                            <th class="px-4 py-5 text-center">Due Date</th>
                            <th class="px-4 py-5 text-center">Status</th>
                            <th class="px-4 py-5 text-center">Over Date</th>
                            <th class="px-6 py-5 text-center">Review</th>
                        </tr>
                    </thead>
                    <tbody id="project-body" class="divide-y divide-slate-50 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="reviewModal" class="modal">
        <div class="modal-content shadow-2xl">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-xl font-black text-slate-800 uppercase">Review & Detail Project</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="rev-id">
                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Project Name</label>
                    <input type="text" id="rev-project" class="edit-input !text-sm font-bold uppercase">
                </div>
                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Deskripsi Tugas</label>
                    <textarea id="rev-tugas" class="edit-input !text-sm h-16 resize-none"></textarea>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Assigned To</label>
                    <select id="rev-name" class="edit-input font-bold">
                        <option value="RYAN">RYAN</option>
                        <option value="ISQI">ISQI</option>
                        <option value="JUMAWAN">JUMAWAN</option>
                        <option value="EKO">EKO</option>
                        <option value="TATA">TATA</option>
                        <option value="BAROK">BAROK</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Priority</label>
                    <select id="rev-priority" class="edit-input font-bold"><option value="Low">Low</option><option value="Mid">Mid</option><option value="High">High</option></select>
                </div>
                <div><label class="text-[10px] font-bold text-slate-400 uppercase">Due Date</label><input type="date" id="rev-due" class="edit-input"></div>
                <div><label class="text-[10px] font-bold text-slate-400 uppercase">Status</label><div id="rev-status-badge" class="mt-1"></div></div>

                <div class="md:col-span-2 space-y-4 pt-2 border-t mt-2">
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                        <label class="text-[10px] font-black text-blue-400 uppercase">Activity (Update Lapangan)</label>
                        <textarea id="rev-activity" class="edit-input !bg-transparent border-none font-semibold text-blue-800 uppercase h-16 w-full resize-none"></textarea>
                    </div>
                    <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
                        <label class="text-[10px] font-black text-rose-400 uppercase">Keterangan</label>
                        <textarea id="rev-hold" class="edit-input !bg-transparent border-none font-bold text-rose-600 italic h-16 w-full resize-none"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button onclick="updateData()" class="flex-grow bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold uppercase text-xs transition-all">Simpan Perubahan</button>
                <button onclick="deleteDataInModal()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-6 rounded-xl border border-rose-100 font-bold text-xs uppercase">Hapus</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);
        let allData = [];

        async function fetchProjectData() {
            const { data, error } = await _sb.from('management_tracker').select('*').order('created_at', { ascending: false });
            if (error) return;
            allData = data;
            renderTable(allData);
            updateStats(allData);
        }

        function renderTable(dataList) {
            const tbody = document.getElementById('project-body');
            tbody.innerHTML = dataList.map(row => {
                const today = new Date(); today.setHours(0,0,0,0);
                const dueDate = new Date(row.due_date);
                const endDate = row.actual_finish ? new Date(row.actual_finish) : today;
                const diffDays = Math.ceil((endDate - dueDate) / (1000 * 60 * 60 * 24));
                
                let overLabel = row.status === 'Done' ? (diffDays > 0 ? `<span class="text-red-500 font-bold">LATE ${diffDays}D</span>` : '<span class="text-emerald-500 font-bold">ON TIME</span>') : (diffDays > 0 ? `<span class="text-red-600 font-black">${diffDays}D Late</span>` : '<span class="text-slate-300 italic text-[10px]">On Schedule</span>');
                let pColor = row.priority === 'High' ? 'text-red-600' : (row.priority === 'Mid' ? 'text-blue-600' : 'text-slate-500');
                let sClass = row.status === 'Done' ? "bg-emerald-50 text-emerald-600 border-emerald-100" : (row.status === 'Hold' ? "bg-rose-50 text-rose-600 border-rose-100" : "bg-blue-50 text-blue-600 border-blue-100");

                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-6 font-bold uppercase">${row.project_name}</td>
                        <td class="px-4 py-6 text-center text-[10px] font-black uppercase ${pColor}">${row.priority}</td>
                        <td class="px-4 py-6 text-center font-bold">${row.assigned_to}</td>
                        <td class="px-4 py-6 text-center">${row.due_date}</td>
                        <td class="px-4 py-6 text-center"><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase border ${sClass}">${row.status}</span></td>
                        <td class="px-4 py-6 text-center font-bold">${overLabel}</td>
                        <td class="px-6 py-6 text-center">
                            <button onclick='openReviewModal(${JSON.stringify(row)})' class="bg-blue-600 text-white px-5 py-2 rounded-lg text-[10px] font-bold uppercase hover:bg-blue-700 transition-all shadow-sm">Review</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allData.filter(item => 
                item.project_name.toLowerCase().includes(query) || 
                (item.task_desc && item.task_desc.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function updateStats(data) {
            document.getElementById('stat-progress').innerText = data.filter(r => r.status === 'In Progress').length;
            document.getElementById('stat-pending').innerText = data.filter(r => r.status === 'Pending').length;
            document.getElementById('stat-hold').innerText = data.filter(r => r.status === 'Hold').length;
            document.getElementById('stat-done').innerText = data.filter(r => r.status === 'Done').length;
        }

        function openReviewModal(row) {
            document.getElementById('rev-id').value = row.id;
            document.getElementById('rev-project').value = row.project_name;
            document.getElementById('rev-tugas').value = row.task_desc || '';
            document.getElementById('rev-name').value = row.assigned_to;
            document.getElementById('rev-priority').value = row.priority || 'Mid';
            document.getElementById('rev-due').value = row.due_date;
            document.getElementById('rev-activity').value = row.worker_comment || '';
            document.getElementById('rev-hold').value = row.hold_reason || '';
            const sClass = row.status === 'Done' ? "bg-emerald-100 text-emerald-700" : (row.status === 'Hold' ? "bg-rose-100 text-rose-700" : "bg-blue-100 text-blue-700");
            document.getElementById('rev-status-badge').innerHTML = `<span class="px-4 py-1 rounded-full font-black text-[10px] uppercase ${sClass}">${row.status}</span>`;
            document.getElementById('reviewModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('reviewModal').style.display = 'none'; }

        async function updateData() {
            const id = document.getElementById('rev-id').value;
            const { error } = await _sb.from('management_tracker').update({
                project_name: document.getElementById('rev-project').value,
                task_desc: document.getElementById('rev-tugas').value,
                assigned_to: document.getElementById('rev-name').value,
                priority: document.getElementById('rev-priority').value,
                due_date: document.getElementById('rev-due').value,
                worker_comment: document.getElementById('rev-activity').value,
                hold_reason: document.getElementById('rev-hold').value
            }).eq('id', id);
            if (!error) { closeModal(); fetchProjectData(); }
        }

        async function saveToDatabase() {
            const payload = {
                project_name: document.getElementById('in-project').value,
                task_desc: document.getElementById('in-tugas').value,
                assigned_to: document.getElementById('in-name').value,
                priority: document.getElementById('in-priority').value,
                start_date: document.getElementById('in-start').value,
                due_date: document.getElementById('in-due').value,
                status: 'Pending'
            };
            if(!payload.project_name || !payload.assigned_to) return alert("Lengkapi data!");
            const { error } = await _sb.from('management_tracker').insert([payload]);
            if (!error) { fetchProjectData(); clearInputs(); }
        }

        function clearInputs() {
            document.getElementById('in-project').value = "";
            document.getElementById('in-tugas').value = "";
        }

        async function deleteDataInModal() {
            if(confirm("Hapus project ini secara permanen?")) {
                await _sb.from('management_tracker').delete().eq('id', document.getElementById('rev-id').value);
                closeModal(); fetchProjectData();
            }
        }

        window.onload = fetchProjectData;
    </script>
</body>
</html>
