<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Summary Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; padding: 20px; }
        .status-badge { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; border: 1px solid; }
        /* Animasi untuk status terlambat */
        .overdue-alert { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto">
        <div class="mb-4 flex justify-end">
            <a href="management_tracker.html" class="bg-slate-600 text-white px-4 py-1.5 rounded text-[10px] font-bold uppercase hover:bg-black transition shadow-sm">
                Kembali ke Dashboard
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-widest border-b">
                            <th class="p-4">Project / Mesin</th>
                            <th class="p-4">Daftar Tugas</th>
                            <th class="p-4">Assigned To</th>
                            <th class="p-4 text-center">Start Date</th>
                            <th class="p-4 text-center">Due Date</th>
                            <th class="p-4 text-center">Status</th>
                            <th class="p-4 text-center">Over Date</th>
                        </tr>
                    </thead>
                    <tbody id="project-body" class="text-sm">
                        <tr>
                            <td colspan="7" class="p-10 text-center text-slate-400 italic">Memuat data dari server...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        // Fungsi menghitung keterlambatan berdasarkan tanggal hari ini
        function calculateOverdue(dueDate) {
            if (!dueDate) return "-";
            const due = new Date(dueDate);
            const today = new Date();
            const diffTime = today - due;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays > 0) {
                return `<span class="overdue-alert">${diffDays} Hari</span>`;
            }
            return `<span class="text-green-600 font-bold">On Time</span>`;
        }

        async function fetchProjectData() {
            const { data, error } = await _sb
                .from('laporan_maintenance')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            const tbody = document.getElementById('project-body');
            tbody.innerHTML = data.map(row => {
                // Formatting tanggal agar lebih bersih
                const start = row.jam_mulai ? new Date(row.jam_mulai).toLocaleDateString('id-ID') : '-';
                const due = row.jam_selesai ? new Date(row.jam_selesai).toLocaleDateString('id-ID') : '-';

                return `
                    <tr class="border-b border-slate-100 hover:bg-blue-50/50 transition">
                        <td class="p-4 font-black uppercase text-slate-800 tracking-tight">${row.nama_mesin || 'N/A'}</td>
                        <td class="p-4 text-[10px] font-bold text-slate-500 uppercase">${row.job_type || 'GENERAL'}</td>
                        <td class="p-4 font-bold uppercase text-xs text-slate-700">${row.engineer_name || '-'}</td>
                        <td class="p-4 text-center font-mono text-xs text-slate-500">${start}</td>
                        <td class="p-4 text-center font-mono text-xs text-slate-500">${due}</td>
                        <td class="p-4 text-center">
                            <span class="status-badge ${
                                row.status === 'Approved' ? 'bg-green-50 text-green-700 border-green-200' : 
                                'bg-amber-50 text-amber-700 border-amber-200'
                            }">${row.status || 'PENDING'}</span>
                        </td>
                        <td class="p-4 text-center text-xs">
                            ${row.status === 'Approved' ? '<span class="text-slate-400">SELESAI</span>' : calculateOverdue(row.jam_selesai)}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.onload = fetchProjectData;
    </script>
</body>
</html>
