<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Superintendent Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .gradient-navy { background: linear-gradient(135deg, #001f3f 0%, #003366 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        
        .edit-input { 
            background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; width: 100%; font-size: 14px; outline: none; transition: all 0.2s;
            /* Cegah zoom di iOS */
            font-size: 16px; 
        }
        .edit-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }

        /* MODAL CUSTOM PICKER */
        .picker-modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
        .picker-content { 
            background: white; position: absolute; bottom: 0; width: 100%; max-height: 80vh; 
            border-radius: 20px 20px 0 0; padding: 20px; animation: slideUp 0.3s; display: flex; flex-direction: column;
        }
        .picker-list { overflow-y: auto; max-height: 60vh; margin-top: 10px; }
        .picker-item { padding: 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 14px; font-weight: 600; color: #334155; }
        .picker-item:hover { background-color: #f8fafc; color: #2563eb; }

        @keyframes slideUp { from {transform: translateY(100%);} to {transform: translateY(0);} }
        
        .progress-bg { width: 100%; background-color: #e2e8f0; border-radius: 9999px; height: 8px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <div class="gradient-navy w-full pt-8 pb-20 px-6 mb-[-60px] shadow-lg">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-white uppercase tracking-tight">Project Control</h1>
                <p class="text-blue-200 text-xs mt-1 font-medium">Monitoring & Assignment</p>
            </div>
            <a href="management_tracker.html" class="bg-white/10 text-white px-4 py-2 rounded-lg text-xs font-bold border border-white/20">Kembali</a>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4"> <div class="grid grid-cols-2 gap-3 mb-6 relative z-10">
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-[10px] font-bold text-gray-400 uppercase">In Progress</p>
                <h3 id="stat-progress" class="text-2xl font-black text-gray-800">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-amber-500">
                <p class="text-[10px] font-bold text-gray-400 uppercase">Pending</p>
                <h3 id="stat-pending" class="text-2xl font-black text-gray-800">0</h3>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 relative z-10 border border-slate-100">
            <h2 class="text-sm font-black text-slate-800 uppercase tracking-wide mb-4 flex items-center gap-2">
                <span class="w-1.5 h-6 bg-blue-600 rounded-full block"></span> Assign New Task
            </h2>

            <div class="space-y-4">
                
                <div class="flex bg-slate-100 p-1 rounded-lg">
                    <label class="flex-1 cursor-pointer text-center">
                        <input type="radio" name="proj_mode" value="existing" class="peer sr-only" checked onchange="toggleMode()">
                        <span class="block py-2 rounded-md text-[10px] font-bold uppercase text-slate-500 peer-checked:bg-white peer-checked:text-blue-600 peer-checked:shadow-sm transition-all">Pilih Project</span>
                    </label>
                    <label class="flex-1 cursor-pointer text-center">
                        <input type="radio" name="proj_mode" value="new" class="peer sr-only" onchange="toggleMode()">
                        <span class="block py-2 rounded-md text-[10px] font-bold uppercase text-slate-500 peer-checked:bg-white peer-checked:text-blue-600 peer-checked:shadow-sm transition-all">Nama Mesin</span>
                    </label>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Project / Mesin</label>
                    
                    <input type="text" id="in-project-existing" readonly onclick="openPicker('project')" class="edit-input font-bold text-slate-700 bg-slate-50 cursor-pointer" placeholder="Pilih Project...">
                    
                    <input type="text" id="in-project-new" readonly onclick="openPicker('machine')" class="edit-input hidden font-bold text-blue-600 bg-blue-50 cursor-pointer" placeholder="Pilih Mesin...">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Detail Tugas</label>
                    <input type="text" id="in-tugas" onclick="openPicker('task')" class="edit-input" placeholder="Pilih / Ketik Tugas...">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Assigned To</label>
                        <input type="text" id="in-name" readonly onclick="openPicker('personnel')" class="edit-input font-bold uppercase cursor-pointer" placeholder="Pilih...">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Jenis Job</label>
                        <select id="in-job-type" class="edit-input bg-white cursor-pointer text-xs font-bold">
                            <option value="">- Pilih -</option>
                            <option value="Improvement">Improvement</option>
                            <option value="Overhaul">Overhaul</option>
                            <option value="Perawatan">Perawatan</option>
                            <option value="New Project">New Project</option>
                            <option value="Trial">Trial</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Priority</label>
                        <select id="in-priority" class="edit-input text-xs">
                            <option value="Low">Low</option><option value="Mid" selected>Mid</option><option value="High">High</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Start</label>
                        <input type="date" id="in-start" class="edit-input text-xs px-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Target</label>
                        <input type="date" id="in-due" class="edit-input text-xs px-1">
                    </div>
                </div>

                <button onclick="saveToDatabase()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold text-sm uppercase shadow-lg active:scale-95 transition-all mt-2">
                    Simpan Tugas
                </button>
            </div>
        </div>

        <div class="mb-4">
            <input type="text" id="search-input" oninput="renderTable()" placeholder="Cari Project..." class="edit-input shadow-sm mb-4">
            <div id="project-list-container" class="space-y-3"></div>
        </div>
    </div>

    <div id="pickerModal" class="picker-modal" onclick="closePicker(event)">
        <div class="picker-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 id="picker-title" class="text-lg font-bold text-slate-800 uppercase">Pilih Data</h3>
                <button onclick="document.getElementById('pickerModal').style.display='none'" class="text-2xl text-slate-400">&times;</button>
            </div>
            
            <div class="flex gap-2 mb-2">
                <input type="text" id="picker-search" oninput="filterPicker()" class="w-full border p-3 rounded-lg text-sm outline-none focus:border-blue-500" placeholder="Cari atau Ketik Baru...">
                <button id="btn-add-new" onclick="selectNewValue()" class="bg-blue-600 text-white px-4 rounded-lg font-bold text-xs uppercase hidden">Pilih</button>
            </div>

            <div id="picker-list" class="picker-list"></div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);
        
        let allData = [];
        let currentPickerTarget = "";
        
        // DATA MASTER UNTUK PICKER
        const MASTER_DATA = {
            machine: [
                "LIANXIN 80 T (TOAD)", "WIBA 270 T (NEBULA)", "WIBA 240 T (SPIDERMAN)", 
                "WIBA 210 T (THOR)", "WIBA 350 T (IRON MAN)", "ARBURG 320 T (STAR LORD)", 
                "WIBA 500 T (STEVE ROGERS)", "WIBA 500 T (THANOS)", "FCS 220 T (BLACKWIDOW)", 
                "ENGEL 220 T (DEADPOOL)", "ARBURG 200 T (WOLVERINE)", "FCS 380 T (LOKI)", 
                "ENGEL 380 T (INHUMANS)", "ENGEL 380 T (HULK)", "NPC 400 T (WANDA)", 
                "ENGEL 280 T (DOCTOR STRANGE)", "FCS 100 T (ANTMAN)", "NPC 160 T (WASP)", 
                "NPC 160 T (WONG)", "FCS 150 T (ROCKET)", "FCS 150 T (MANTIS)", 
                "NPC 160 T (SHANCHI)", "NPC 260 T (VISION)", "NPC 200 T (MAGNETO)", 
                "FCS 100 T (NICK FURRY)", "FCS 250 T (CYCLOPS)", "NPC 260 T (HAWKEYE)", "EXTRUDER"
            ],
            personnel: ["RYAN", "ISYQI", "JUMAWAN", "EKO", "TATA", "BAROK"],
            project: [], // Akan diisi dari DB
            task: []     // Akan diisi dari DB
        };

        async function fetchProjectData() {
            const { data, error } = await _sb.from('management_tracker').select('*').order('created_at', { ascending: false });
            if (error) return;
            allData = data;
            
            // Update Master Data dari DB
            MASTER_DATA.project = [...new Set(data.map(i => (i.project_name || "").toUpperCase()))].sort();
            MASTER_DATA.task = [...new Set(data.map(i => (i.task_desc || "").trim()))].sort();
            const dbPersonnel = data.map(i => (i.assigned_to || "").toUpperCase());
            MASTER_DATA.personnel = [...new Set([...MASTER_DATA.personnel, ...dbPersonnel])].sort();

            renderTable();
            updateStats(allData);
        }

        // --- LOGIC CUSTOM PICKER (POP UP) ---
        function openPicker(type) {
            currentPickerTarget = type;
            const modal = document.getElementById('pickerModal');
            const title = document.getElementById('picker-title');
            const list = document.getElementById('picker-list');
            const search = document.getElementById('picker-search');
            
            search.value = ""; // Reset search
            document.getElementById('btn-add-new').classList.add('hidden'); // Hide Add Button

            let items = [];
            if(type === 'project') { title.innerText = "PILIH PROJECT"; items = MASTER_DATA.project; }
            else if(type === 'machine') { title.innerText = "PILIH MESIN"; items = MASTER_DATA.machine; }
            else if(type === 'personnel') { title.innerText = "PILIH PERSONIL"; items = MASTER_DATA.personnel; }
            else if(type === 'task') { title.innerText = "PILIH TUGAS"; items = MASTER_DATA.task; }

            renderPickerList(items);
            modal.style.display = 'block';
            search.focus();
        }

        function renderPickerList(items) {
            const list = document.getElementById('picker-list');
            list.innerHTML = items.map(item => `
                <div class="picker-item" onclick="selectValue('${item}')">${item}</div>
            `).join('');
            
            if(items.length === 0) list.innerHTML = '<div class="p-4 text-center text-gray-400 text-xs">Tidak ada data. Ketik untuk tambah baru.</div>';
        }

        function filterPicker() {
            const query = document.getElementById('picker-search').value.toUpperCase();
            const btnAdd = document.getElementById('btn-add-new');
            
            let source = [];
            if(currentPickerTarget === 'project') source = MASTER_DATA.project;
            else if(currentPickerTarget === 'machine') source = MASTER_DATA.machine;
            else if(currentPickerTarget === 'personnel') source = MASTER_DATA.personnel;
            else if(currentPickerTarget === 'task') source = MASTER_DATA.task;

            const filtered = source.filter(item => item.toUpperCase().includes(query));
            renderPickerList(filtered);

            // Show "PILIH" button if typing something new (except machine which is fixed list usually)
            if(query.length > 0) {
                btnAdd.classList.remove('hidden');
                btnAdd.innerText = `PAKAI "${query}"`;
            } else {
                btnAdd.classList.add('hidden');
            }
        }

        function selectValue(val) {
            applyValueToInput(val);
        }

        function selectNewValue() {
            const val = document.getElementById('picker-search').value.toUpperCase();
            applyValueToInput(val);
        }

        function applyValueToInput(val) {
            if(currentPickerTarget === 'project') document.getElementById('in-project-existing').value = val;
            else if(currentPickerTarget === 'machine') document.getElementById('in-project-new').value = val;
            else if(currentPickerTarget === 'personnel') document.getElementById('in-name').value = val;
            else if(currentPickerTarget === 'task') document.getElementById('in-tugas').value = val; // Task biarkan case asli

            document.getElementById('pickerModal').style.display = 'none';
        }

        function closePicker(e) {
            if(e.target.id === 'pickerModal') e.target.style.display = 'none';
        }

        // --- MAIN LOGIC ---
        function toggleMode() {
            const mode = document.querySelector('input[name="proj_mode"]:checked').value;
            if(mode === 'existing') {
                document.getElementById('in-project-existing').classList.remove('hidden');
                document.getElementById('in-project-new').classList.add('hidden');
                document.getElementById('in-project-new').value = "";
            } else {
                document.getElementById('in-project-existing').classList.add('hidden');
                document.getElementById('in-project-new').classList.remove('hidden');
                document.getElementById('in-project-existing').value = "";
            }
        }

        function renderTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('project-list-container');
            const grouped = {};

            allData.forEach(item => {
                const pName = (item.project_name || "NO NAME").toUpperCase();
                const mName = (item.machine_name || "-").toUpperCase();
                const jobType = item.job_type || "";
                const key = pName + "||" + mName;

                if (query && !key.toLowerCase().includes(query)) return; 

                if (!grouped[key]) grouped[key] = { pName, mName, jobType, tasks: [], progress: 0 };
                grouped[key].tasks.push(item);
                grouped[key].progress += parseFloat(item.progress_percent || 0);
            });

            container.innerHTML = Object.keys(grouped).map(key => {
                const g = grouped[key];
                const count = g.tasks.length;
                const avg = (g.progress / count).toFixed(0);
                const color = avg >= 100 ? 'bg-emerald-500' : 'bg-blue-500';
                const jobBadge = g.jobType ? `<span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-[9px] font-bold uppercase">${g.jobType}</span>` : '';

                return `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-slate-800 uppercase text-sm">${g.pName}</h3>
                            <div class="flex gap-2 mt-1">
                                <span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[9px] font-bold border border-blue-100">${g.mName}</span>
                                ${jobBadge}
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="block text-2xl font-black text-slate-700">${avg}%</span>
                            <span class="text-[10px] text-slate-400 font-bold">${count} Tasks</span>
                        </div>
                    </div>
                    <div class="progress-bg mb-3">
                        <div class="progress-fill ${color}" style="width: ${avg}%"></div>
                    </div>
                    <div class="border-t pt-2 flex justify-between items-center">
                        <span class="text-[10px] text-slate-400 font-bold">Updated: ${new Date().toLocaleDateString('id-ID')}</span>
                        <button class="text-blue-600 text-xs font-bold uppercase">Detail &rarr;</button>
                    </div>
                </div>`;
            }).join('');
        }

        function updateStats(data) {
            document.getElementById('stat-progress').innerText = data.filter(r => r.status === 'In Progress').length;
            document.getElementById('stat-pending').innerText = data.filter(r => r.status === 'Pending').length;
            // document.getElementById('stat-hold').innerText = data.filter(r => r.status === 'Hold').length;
            // document.getElementById('stat-done').innerText = data.filter(r => r.status === 'Done').length;
        }

        async function saveToDatabase() {
            const mode = document.querySelector('input[name="proj_mode"]:checked').value;
            let pName = mode === 'existing' ? document.getElementById('in-project-existing').value : document.getElementById('in-project-new').value;
            let mName = mode === 'existing' ? "-" : document.getElementById('in-project-new').value;
            
            if(!pName || !document.getElementById('in-name').value) return alert("Isi Project & Personil!");

            const payload = {
                project_name: pName.toUpperCase(),
                machine_name: mName.toUpperCase(),
                job_type: document.getElementById('in-job-type').value,
                task_desc: document.getElementById('in-tugas').value,
                assigned_to: document.getElementById('in-name').value.toUpperCase(),
                priority: document.getElementById('in-priority').value,
                start_date: document.getElementById('in-start').value || new Date().toISOString().split('T')[0],
                due_date: document.getElementById('in-due').value,
                progress_percent: 0, status: 'Pending'
            };

            const { error } = await _sb.from('management_tracker').insert([payload]);
            if(error) alert("Error: " + error.message);
            else { alert("Sukses!"); fetchProjectData(); }
        }

        window.onload = fetchProjectData;
    </script>
</body>
</html>
