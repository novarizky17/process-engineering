<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superintendent Tracker - Assign Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .gradient-navy { background: linear-gradient(135deg, #001f3f 0%, #003366 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="gradient-navy w-full pt-12 pb-24 px-8 mb-[-80px] shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight uppercase">Project Assignment</h1>
                <p class="text-blue-200 text-sm mt-1 font-medium tracking-wide">Pemberian Tugas dan Penetapan Target Due Date</p>
            </div>
            <a href="management_tracker.html" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase transition-all backdrop-blur-md border border-white/20">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali
            </a>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-8">
        
        <div class="glass-card p-8 rounded-3xl shadow-xl mb-10 relative z-10">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                <h2 class="text-lg font-bold text-slate-800 uppercase tracking-wider">Berikan Project Baru</h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Project Name</label>
                    <input type="text" id="in-project" placeholder="Nama Project / Mesin" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm focus:bg-white outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Assigned To</label>
                    <select id="in-name" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm focus:bg-white outline-none">
                        <option value="">Pilih Personil</option>
                        <option value="RIYAN">RIYAN</option>
                        <option value="ISQI">ISQI</option>
                        <option value="MAS JUMAWAN">MAS JUMAWAN</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Start Date</label>
                    <input type="date" id="in-start" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm focus:bg-white outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Target Due Date</label>
                    <input type="date" id="in-due" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm focus:bg-white outline-none">
                </div>
            </div>
            
            <div class="mt-8 flex justify-end gap-3">
                <button onclick="saveToDatabase()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-2xl font-extrabold text-xs uppercase tracking-widest shadow-lg transition-all hover:-translate-y-1">
                    Assign Project
                </button>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/80 text-slate-400 text-[10px] uppercase font-bold tracking-[0.2em] border-b border-slate-100">
                            <th class="px-8 py-5">Project</th>
                            <th class="px-6 py-5">Assigned To</th>
                            <th class="px-6 py-5 text-center">Start Date</th>
                            <th class="px-6 py-5 text-center">Due Date (Target)</th>
                            <th class="px-6 py-5 text-center">Status Aktual</th>
                            <th class="px-8 py-5 text-center">Over Date</th>
                            <th class="px-4 py-5 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="project-body" class="divide-y divide-slate-50 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        // Simpan tugas baru oleh Superintendent
        async function saveToDatabase() {
            const project = document.getElementById('in-project').value;
            const name = document.getElementById('in-name').value;
            const start = document.getElementById('in-start').value;
            const due = document.getElementById('in-due').value;

            if(!project || !name || !due) return alert("Mohon lengkapi semua data!");

            const { error } = await _sb.from('management_tracker').insert([{ 
                project_name: project, 
                assigned_to: name, 
                start_date: start, 
                due_date: due,
                status: 'Waiting Progress' // Status default sebelum personil update
            }]);

            if (error) alert(error.message);
            else {
                alert("Project berhasil diberikan!");
                fetchProjectData();
                document.getElementById('in-project').value = "";
            }
        }

        // Hapus tugas
        async function deleteData(id) {
            if(confirm('Batalkan project ini?')) {
                await _sb.from('management_tracker').delete().eq('id', id);
                fetchProjectData();
            }
        }

        // Ambil data untuk melihat progres aktual
        async function fetchProjectData() {
            const { data, error } = await _sb.from('management_tracker').select('*').order('created_at', { ascending: false });
            if (error) return;

            const tbody = document.getElementById('project-body');
            tbody.innerHTML = data.map(row => {
                const today = new Date();
                const dueDate = new Date(row.due_date);
                
                // Jika sudah ada actual_finish dari personil, gunakan itu. Jika belum, gunakan hari ini.
                const endDate = row.actual_finish ? new Date(row.actual_finish) : today;
                const diffDays = Math.ceil((endDate - dueDate) / (1000 * 60 * 60 * 24));
                
                let overDateContent = '';
                if (row.status === 'Done') {
                    overDateContent = diffDays > 0 ? 
                        `<span class="bg-red-50 text-red-600 px-3 py-1 rounded-lg font-bold text-[10px]">LATE ${diffDays}D</span>` : 
                        '<span class="text-emerald-500 font-bold text-[10px]">ON TIME</span>';
                } else {
                    overDateContent = diffDays > 0 ? 
                        `<span class="text-red-600 font-bold">${diffDays} Days Over</span>` : 
                        '<span class="text-slate-300 font-medium italic">Monitoring...</span>';
                }

                let statusClass = "bg-slate-100 text-slate-400";
                if(row.status === 'Done') statusClass = "bg-emerald-50 text-emerald-600 border-emerald-100";
                if(row.status === 'In Progress') statusClass = "bg-blue-50 text-blue-600 border-blue-100";

                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-8 py-6 font-extrabold text-slate-800 uppercase tracking-tight">${row.project_name}</td>
                        <td class="px-6 py-6 font-bold text-slate-700 uppercase text-xs">${row.assigned_to}</td>
                        <td class="px-6 py-6 text-center font-mono text-[10px] text-slate-400">${row.start_date || '-'}</td>
                        <td class="px-6 py-6 text-center font-mono text-[10px] text-slate-900 font-bold">${row.due_date}</td>
                        <td class="px-6 py-6 text-center">
                            <span class="px-3 py-1 rounded-full font-extrabold text-[9px] uppercase tracking-wider border ${statusClass}">${row.status}</span>
                        </td>
                        <td class="px-8 py-6 text-center text-xs font-bold">${overDateContent}</td>
                        <td class="px-4 py-6 text-center">
                            <button onclick="deleteData(${row.id})" class="text-slate-300 hover:text-red-600 transition-colors">
                                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.onload = fetchProjectData;
    </script>
</body>
</html>
