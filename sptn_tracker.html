<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superintendent Review Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .gradient-navy { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 5% auto; padding: 0; border-radius: 24px; width: 90%; max-width: 600px; overflow: hidden; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .form-input { width: 100%; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 14px; font-size: 13px; outline: none; transition: all 0.2s; }
        .form-input:focus { background: #fff; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .review-card { cursor: pointer; transition: all 0.2s; border: 1px solid #e2e8f0; }
        .review-card:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="gradient-navy w-full pt-10 pb-20 px-8 mb-[-80px] shadow-2xl">
        <div class="max-w-[95%] mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight uppercase">Project Control Panel</h1>
                <p class="text-slate-400 text-xs mt-1 font-medium tracking-wide">Pemberian Tugas & Monitoring Real-time</p>
            </div>
            <div class="flex gap-3">
                <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl font-bold text-[10px] uppercase shadow-lg transition-all active:scale-95 border border-blue-400">Assign New Project</button>
                <a href="management_tracker.html" class="bg-white/10 hover:bg-white/20 text-white px-5 py-2 rounded-xl font-bold text-[10px] uppercase border border-white/10 transition-all">Kembali</a>
            </div>
        </div>
    </div>

    <div class="max-w-[95%] mx-auto px-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 relative z-10">
            <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-blue-500">
                <p class="text-[9px] font-bold text-slate-400 uppercase">In Progress</p>
                <h3 id="stat-progress" class="text-2xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-amber-500">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Pending</p>
                <h3 id="stat-pending" class="text-2xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-rose-500">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Hold</p>
                <h3 id="stat-hold" class="text-2xl font-black text-rose-600">0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Total Selesai</p>
                <h3 id="stat-done" class="text-2xl font-black text-emerald-600">0</h3>
            </div>
        </div>

        <div id="project-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content shadow-2xl">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h2 id="modal-title" class="text-lg font-bold text-slate-800 uppercase">Form Project</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Project Name</label>
                    <input type="text" id="edit-project" class="form-input font-bold uppercase">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tugas / Deskripsi</label>
                    <textarea id="edit-tugas" class="form-input h-20 resize-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Assigned To</label>
                        <select id="edit-name" class="form-input font-bold">
                            <option value="RYAN">RYAN</option>
                            <option value="ISQI">ISQI</option>
                            <option value="JUMAWAN">JUMAWAN</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Due Date</label>
                        <input type="date" id="edit-due" class="form-input">
                    </div>
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex gap-3">
                <button onclick="saveAction()" class="flex-grow bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-lg transition-all active:scale-95">Simpan Data</button>
                <button id="btn-delete" onclick="deleteDataInModal()" class="hidden bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 rounded-xl border border-rose-100 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        async function fetchProjectData() {
            const { data, error } = await _sb.from('management_tracker').select('*').order('created_at', { ascending: false });
            if (error) return;

            // Fungsi statistik tetap
            document.getElementById('stat-progress').innerText = data.filter(r => r.status === 'In Progress').length;
            document.getElementById('stat-pending').innerText = data.filter(r => r.status === 'Pending').length;
            document.getElementById('stat-hold').innerText = data.filter(r => r.status === 'Hold').length;
            document.getElementById('stat-done').innerText = data.filter(r => r.status === 'Done').length;

            const container = document.getElementById('project-container');
            container.innerHTML = data.map(row => {
                // Logika Perhitungan Hari Terlambat (Fungsi Awal Dipertahankan)
                const today = new Date(); today.setHours(0,0,0,0);
                const dueDate = new Date(row.due_date);
                const endDate = row.actual_finish ? new Date(row.actual_finish) : today;
                const diffDays = Math.ceil((endDate - dueDate) / (1000 * 60 * 60 * 24));

                let overDateContent = '';
                if (row.status === 'Done') {
                    overDateContent = diffDays > 0 ? `<span class="text-red-500 font-bold">LATE ${diffDays}D</span>` : '<span class="text-emerald-500 font-bold">ON TIME</span>';
                } else {
                    overDateContent = diffDays > 0 ? `<span class="text-red-600 font-black">${diffDays} Days Late</span>` : '<span class="text-slate-400 italic">On Schedule</span>';
                }

                let sClass = row.status === 'Done' ? "bg-emerald-500" : (row.status === 'Hold' ? "bg-rose-500" : (row.status === 'In Progress' ? "bg-blue-500" : "bg-slate-400"));

                return `
                    <div onclick='openEditModal(${JSON.stringify(row)})' class="review-card bg-white rounded-2xl p-5 relative overflow-hidden shadow-sm">
                        <div class="absolute top-0 left-0 w-1.5 h-full ${sClass}"></div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[10px] font-black text-slate-800 uppercase tracking-tighter">${row.assigned_to}</span>
                            <span class="px-2 py-0.5 rounded-full text-white text-[8px] font-black uppercase ${sClass}">${row.status}</span>
                        </div>
                        <h3 class="text-sm font-bold text-slate-800 uppercase truncate">${row.project_name}</h3>
                        <p class="text-[11px] text-slate-400 italic truncate mb-4">${row.task_desc || '-'}</p>
                        <div class="flex justify-between items-center pt-3 border-t border-slate-50">
                            <span class="text-[10px] font-bold text-slate-400">Due: ${row.due_date}</span>
                            <span class="text-[10px] uppercase">${overDateContent}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Fungsi Modal & Update tetap mengikuti logika awal database
        function openEditModal(row) {
            document.getElementById('edit-id').value = row.id;
            document.getElementById('edit-project').value = row.project_name;
            document.getElementById('edit-tugas').value = row.task_desc || '';
            document.getElementById('edit-name').value = row.assigned_to;
            document.getElementById('edit-due').value = row.due_date;
            document.getElementById('btn-delete').classList.remove('hidden');
            document.getElementById('modal-title').innerText = "Edit Project Data";
            document.getElementById('editModal').style.display = 'block';
        }

        function openAddModal() {
            document.getElementById('edit-id').value = "";
            document.getElementById('edit-project').value = "";
            document.getElementById('edit-tugas').value = "";
            document.getElementById('edit-due').value = "";
            document.getElementById('btn-delete').classList.add('hidden');
            document.getElementById('modal-title').innerText = "Assign New Project";
            document.getElementById('editModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }

        async function saveAction() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                project_name: document.getElementById('edit-project').value,
                task_desc: document.getElementById('edit-tugas').value,
                assigned_to: document.getElementById('edit-name').value,
                due_date: document.getElementById('edit-due').value
            };

            if(!payload.project_name || !payload.due_date) return alert("Lengkapi data!");

            if(id) {
                const { error } = await _sb.from('management_tracker').update(payload).eq('id', id);
                if (!error) { closeModal(); fetchProjectData(); }
            } else {
                payload.status = 'Pending';
                const { error } = await _sb.from('management_tracker').insert([payload]);
                if (!error) { closeModal(); fetchProjectData(); }
            }
        }

        async function deleteDataInModal() {
            if(!confirm("Hapus project ini?")) return;
            await _sb.from('management_tracker').delete().eq('id', document.getElementById('edit-id').value);
            closeModal(); fetchProjectData();
        }

        window.onload = fetchProjectData;
    </script>
</body>
</html>
