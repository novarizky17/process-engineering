<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARTU RIWAYAT - PT. AMARILYS KARISMA GEMILANG</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- SETUP AGAR PAS 1 HALAMAN --- */
        @page {
            size: A4 landscape;
            margin: 5mm; /* Margin diperkecil dari 8mm jadi 5mm biar muat */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background: #f1f5f9;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 285mm; /* Lebar dimaksimalkan */
            height: auto; /* Tinggi otomatis */
            background: white;
            padding: 5mm 10mm; /* Padding diperkecil sedikit */
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* --- INPUT DOT (TITIK-TITIK) --- */
        .input-dot {
            border: none;
            border-bottom: 1px dotted black;
            width: 380px; 
            font-family: Arial;
            font-size: 10pt; /* Ukuran font disesuaikan */
            outline: none;
            background: transparent;
            font-weight: normal !important; 
            color: #000;
        }

        .table-select {
            border: none;
            width: 100%;
            height: 100%;
            font-family: Arial;
            font-size: 9pt;
            text-align: center;
            text-align-last: center;
            outline: none;
            background: transparent;
            cursor: pointer;
            appearance: none;
        }

        /* --- SEARCH AREA (TIDAK DIUBAH POSISINYA) --- */
        .search-area {
            background: #1e293b;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-radius: 6px;
            justify-content: center;
        }

        .search-area input, .search-area select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-weight: bold;
        }

        .btn-action {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        /* --- HEADER (STRUKTUR TETAP) --- */
        .header {
            position: relative;
            margin-bottom: 0;
            height: 70px; /* Tinggi header dipadatkan dikit */
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            left: 0;
            top: 20px; 
        }

        .logo { width: 90px; height: auto; }
        .company-name { font-size: 13px; font-weight: bold; }

        .title {
            font-size: 22px; /* Font judul pas */
            font-weight: bold; 
            text-align: center;
            width: 100%;
            margin: 0;
            padding-top: 25px; 
        }

        /* --- META SECTION (INFO MESIN) --- */
        .meta-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end; 
            margin-bottom: 5px; 
            margin-top: 15px;
        }

        .machine-info div { 
            margin-bottom: 3px; /* Jarak antar baris diperkecil */
            font-size: 10pt; 
            font-weight: normal !important; 
        }
        
        .label { 
            font-weight: normal !important; 
            display: inline-block; 
            width: 165px; 
        }

        .doc-info { text-align: left; font-size: 10pt; font-weight: normal !important; }
        .doc-info div { margin-bottom: 2px; }
        .doc-label { font-weight: normal !important; display: inline-block; width: 140px; }

        /* --- TABEL UTAMA --- */
        .main-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px; /* Jarak bawah tabel dikurangi */
        }

        .main-table th {
            border: 1px solid black;
            padding: 5px; /* Padding header diperkecil */
            font-size: 9pt;
            text-align: center;
            background-color: #f8fafc;
            font-weight: bold;
        }

        .main-table td {
            border: 1px solid black;
            padding: 3px; /* Padding isi tabel diperkecil */
            font-size: 9pt;
            text-align: center;
            vertical-align: middle;
            height: 24px; /* Tinggi baris dikunci biar pas */
            font-weight: normal;
        }

        /* --- TANDA TANGAN --- */
        .signature-section { margin-top: 10px; }
        .signature-row {
            display: flex;
            justify-content: space-between;
            gap: 50px;
        }

        .sig-box { flex: 1; text-align: center; max-width: 300px; }
        .sig-title { font-weight: bold; font-size: 11pt; margin-bottom: 50px; text-transform: uppercase; } /* Jarak TTD diperkecil dikit */
        .sig-line { border-bottom: 1.5px solid black; width: 90%; margin: 0 auto 5px; }
        .sig-label { font-size: 11pt; font-weight: bold; }

        @media print {
            body { background: white; display: block; }
            .no-print, .search-area { display: none !important; }
            .container { width: 100%; box-shadow: none; padding: 0; }
            .input-dot { border-bottom: none; }
            .table-select { appearance: none; -webkit-appearance: none; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-area no-print">
        <input type="text" id="mesin_search" placeholder="NAMA MESIN..." style="text-transform:uppercase;">
        <select id="bulan_search">
            <option value="">- Semua Bulan -</option>
            <option value="01">Januari</option><option value="02">Februari</option>
            <option value="03">Maret</option><option value="04">April</option>
            <option value="05">Mei</option><option value="06">Juni</option>
            <option value="07">Juli</option><option value="08">Agustus</option>
            <option value="09">September</option><option value="10">Oktober</option>
            <option value="11">November</option><option value="12">Desember</option>
        </select>
        <select id="tahun_search">
            <script>for(let i=2024; i<=2030; i++) document.write(`<option value="${i}" ${i==2025?'selected':''}>${i}</option>`);</script>
        </select>
        <button onclick="fetchData()" class="btn-action">CARI DATA</button>
        <button onclick="window.print()" class="btn-action" style="background:#10b981">CETAK</button>
        <button onclick="window.location.href='center.html'" class="btn-action" style="background:#64748b">KEMBALI</button>
    </div>

    <div class="header">
        <div class="logo-area">
            <img src="https://amarilyskg.co.id/bootstrap/img/logo.png" alt="Logo AKG" class="logo">
            <div class="company-name">PT. AMARILYS KARISMA GEMILANG</div>
        </div>
        <div class="title">KARTU RIWAYAT</div>
    </div>

    <div class="meta-section">
        <div class="machine-info">
            <div><span class="label">NAMA MESIN</span>: <span id="d_mesin" style="font-weight:bold">-</span></div>
            <div><span class="label">NO. MESIN</span>: <input type="text" class="input-dot" placeholder="..."></div>
            <div><span class="label">TAHUN PEMBUATAN</span>: <input type="text" class="input-dot" placeholder="..."></div>
            <div><span class="label">LOKASI MESIN</span>: <input type="text" class="input-dot" placeholder="..."></div>
        </div>
        <div class="doc-info">
            <div><span class="doc-label">No Dokumen</span>: AF.SP 05.18.Rev-00</div>
            <div><span class="doc-label">Tanggal Terbit</span>: 02 Agustus 2024</div>
            <div><span class="doc-label">Halaman</span>: 1/1</div>
            <div><span class="doc-label">Tanggal Revisi</span>: -</div>
        </div>
    </div>

    <table class="main-table">
        <thead>
            <tr>
                <th style="width: 12%">Tanggal</th>
                <th style="width: 20%">Permasalahan</th>
                <th style="width: 20%">Tindakan</th>
                <th style="width: 20%">Spare Part</th>
                <th style="width: 16%">Keterangan</th>
                <th style="width: 12%">PIC</th>
            </tr>
        </thead>
        <tbody id="table_content">
        </tbody>
    </table>

    <div class="signature-section">
        <div class="signature-row">
            <div class="sig-box">
                <div class="sig-title">DIBUAT</div>
                <div class="sig-line"></div>
                <div class="sig-label">PIC</div>
            </div>
            <div class="sig-box">
                <div class="sig-title">DIKETAHUI</div>
                <div class="sig-line"></div>
                <div class="sig-label">Spv</div>
            </div>
            <div class="sig-box">
                <div class="sig-title">DISETUJUI</div>
                <div class="sig-line"></div>
                <div class="sig-label">Superintendent</div>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    const selectHTML = `
        <select class="table-select">
            <option value=""></option>
            <option value="OK">OK</option>
            <option value="NG">NG</option>
        </select>
    `;

    function formatTgl(isoString) {
        if (!isoString) return "-";
        const d = new Date(isoString);
        return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    async function fetchData() {
        const mesin = document.getElementById('mesin_search').value.trim().toUpperCase();
        const bulan = document.getElementById('bulan_search').value;
        const tahun = document.getElementById('tahun_search').value;

        if(!mesin) return alert("Masukkan Nama Mesin!");

        let query = _sb.from('laporan_maintenance').select(`
                id, jam_mulai, created_at, nama_mesin, engineer_name,
                maintenance_problems(description),
                maintenance_actions(description),
                maintenance_parts(nama_part, qty)
            `).eq('nama_mesin', mesin);

        if(bulan) {
            const lastDay = new Date(tahun, bulan, 0).getDate();
            query = query.gte('jam_mulai', `${tahun}-${bulan}-01T00:00:00Z`)
                         .lte('jam_mulai', `${tahun}-${bulan}-${lastDay}T23:59:59Z`);
        } else {
            query = query.gte('jam_mulai', `${tahun}-01-01T00:00:00Z`)
                         .lte('jam_mulai', `${tahun}-12-31T23:59:59Z`);
        }

        const { data: reports, error } = await query.order('jam_mulai', { ascending: false });

        if (error) return alert("Error: " + error.message);
        
        const tbody = document.getElementById('table_content');
        tbody.innerHTML = '';
        
        if (reports && reports.length > 0) {
            document.getElementById('d_mesin').innerText = reports[0].nama_mesin;
            
            reports.forEach(row => {
                const tr = document.createElement('tr');
                const masalah = row.maintenance_problems.map(p => p.description).join(', ');
                const tindakan = row.maintenance_actions.map(a => a.description).join(', ');
                const parts = row.maintenance_parts.map(pt => `${pt.nama_part} (${pt.qty})`).join(', ');

                tr.innerHTML = `
                    <td>${formatTgl(row.jam_mulai || row.created_at)}</td>
                    <td style="text-align:left">${masalah}</td>
                    <td style="text-align:left">${tindakan}</td>
                    <td style="text-align:left">${parts}</td>
                    <td>${selectHTML}</td>
                    <td>${row.engineer_name}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- PENGATURAN BARIS AGAR PAS 1 HALAMAN ---
        // Saya ubah jadi 16 Baris (tadi 20) supaya aman tidak lompat halaman
        const existing = reports ? reports.length : 0;
        const target = 16; 
        const remaining = target - existing;

        for (let i = 0; i < (remaining < 0 ? 0 : remaining); i++) {
            tbody.innerHTML += `<tr>
                <td>&nbsp;</td><td></td><td></td><td></td>
                <td>${selectHTML}</td><td></td>
            </tr>`;
        }
    }

    window.onload = () => {
        const tbody = document.getElementById('table_content');
        // Loop 16 baris kosong saat awal buka
        for(let i=0; i<16; i++) {
            tbody.innerHTML += `<tr>
                <td>&nbsp;</td><td></td><td></td><td></td>
                <td>${selectHTML}</td><td></td>
            </tr>`;
        }
    };
</script>
</body>
</html>
