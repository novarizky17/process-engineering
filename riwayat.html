<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARTU RIWAYAT (PORTRAIT) - PT. AKG</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* SETUP HALAMAN A4 PORTRAIT */
        @page {
            size: A4 portrait;
            margin: 10mm; /* Margin sedikit lebih lebar biar aman saat diprint */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background: #f1f5f9;
            color: #000;
            font-size: 10pt; /* Font dasar diperkecil sedikit */
        }

        .container {
            width: 190mm; /* Lebar area cetak A4 portrait (210mm - margin) */
            background: white;
            padding: 5mm;
            margin: 0 auto;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            min-height: 277mm; /* Tinggi A4 */
            position: relative;
        }

        /* INPUT TITIK-TITIK */
        .input-dot {
            border: none;
            border-bottom: 1px dotted black;
            width: 200px; /* Lebar input disesuaikan */
            font-family: Arial;
            font-size: 10pt;
            background: transparent;
            color: #000;
            outline: none;
        }

        /* SELECT DALAM TABEL */
        .table-select {
            border: none;
            width: 100%;
            font-family: Arial;
            font-size: 8pt;
            text-align: center;
            text-align-last: center;
            background: transparent;
            appearance: none;
            -webkit-appearance: none;
        }

        /* AREA PENCARIAN (NO PRINT) */
        .search-area {
            background: #1e293b;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            border-radius: 6px;
        }
        .search-area input, .search-area select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }
        .btn-action {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            background: #3b82f6;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid black;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .logo { width: 60px; height: auto; margin-right: 15px; }
        .company-info { flex-grow: 1; }
        .company-name { font-size: 12pt; font-weight: bold; }
        .title { 
            font-size: 16pt; 
            font-weight: bold; 
            text-align: center; 
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* INFORMASI DOKUMEN & MESIN */
        .meta-section {
            display: flex;
            justify-content: space-between;
            font-size: 9pt;
            margin-bottom: 10px;
        }
        .meta-col { width: 48%; }
        .meta-row { display: flex; margin-bottom: 4px; }
        .label { width: 110px; font-weight: bold; }
        .val { flex: 1; border-bottom: 1px dotted #ccc; }

        /* TABEL UTAMA */
        .main-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            font-size: 8pt; /* Font tabel diperkecil agar muat */
        }
        .main-table th {
            border: 1px solid black;
            padding: 5px 2px;
            background: #eee;
            text-align: center;
        }
        .main-table td {
            border: 1px solid black;
            padding: 2px;
            vertical-align: middle;
            height: 22px; /* Tinggi baris dipadatkan */
        }
        
        /* PENGATURAN KOLOM AGAR MUAT DI PORTRAIT */
        .col-tgl { width: 10%; text-align: center; }
        .col-masalah { width: 22%; }
        .col-tindakan { width: 22%; }
        .col-part { width: 20%; }
        .col-ket { width: 12%; text-align: center; }
        .col-pic { width: 14%; text-align: center; }

        /* TANDA TANGAN */
        .signature-section {
            margin-top: 20px;
            display: flex;
            justify-content: space-around; /* Jarak antar TTD */
        }
        .sig-box { text-align: center; width: 100px; }
        .sig-title { font-weight: bold; font-size: 9pt; margin-bottom: 50px; }
        .sig-line { border-bottom: 1px solid black; margin-bottom: 5px; }
        .sig-label { font-size: 9pt; }

        /* PRINT MODE */
        @media print {
            body { background: white; margin: 0; }
            .container { width: 100%; box-shadow: none; padding: 0; margin: 0; min-height: auto; }
            .no-print { display: none !important; }
            .input-dot { border-bottom: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-area no-print">
        <input type="text" id="mesin_search" placeholder="NAMA MESIN...">
        <select id="bulan_search">
            <option value="">- Semua Bulan -</option>
            <option value="01">Jan</option><option value="02">Feb</option>
            <option value="03">Mar</option><option value="04">Apr</option>
            <option value="05">Mei</option><option value="06">Jun</option>
            <option value="07">Jul</option><option value="08">Agu</option>
            <option value="09">Sep</option><option value="10">Okt</option>
            <option value="11">Nov</option><option value="12">Des</option>
        </select>
        <select id="tahun_search">
            <script>
                for(let i=2024; i<=2030; i++) document.write(`<option value="${i}" ${i==2025?'selected':''}>${i}</option>`);
            </script>
        </select>
        <button onclick="fetchData()" class="btn-action">CARI</button>
        <button onclick="window.print()" class="btn-action" style="background:#10b981">PRINT</button>
        <button onclick="window.location.href='center.html'" class="btn-action" style="background:#64748b">BACK</button>
    </div>

    <div class="header">
        <img src="https://amarilyskg.co.id/bootstrap/img/logo.png" alt="Logo" class="logo">
        <div class="company-info">
            <div class="company-name">PT. AMARILYS KARISMA GEMILANG</div>
            <div class="title">KARTU RIWAYAT MESIN</div>
        </div>
    </div>

    <div class="meta-section">
        <div class="meta-col">
            <div class="meta-row"><span class="label">NAMA MESIN</span>: <span id="d_mesin" style="font-weight:bold; margin-left:5px">-</span></div>
            <div class="meta-row"><span class="label">NO. MESIN</span>: <input class="input-dot" placeholder="..."></div>
            <div class="meta-row"><span class="label">LOKASI</span>: <input class="input-dot" placeholder="..."></div>
        </div>
        <div class="meta-col">
            <div class="meta-row"><span class="label">No Dokumen</span>: AF.SP 05.18.Rev-00</div>
            <div class="meta-row"><span class="label">Tgl Terbit</span>: 02 Agustus 2024</div>
            <div class="meta-row"><span class="label">Halaman</span>: 1 dari 1</div>
        </div>
    </div>

    <table class="main-table">
        <thead>
            <tr>
                <th class="col-tgl">TANGGAL</th>
                <th class="col-masalah">PERMASALAHAN</th>
                <th class="col-tindakan">TINDAKAN</th>
                <th class="col-part">SPARE PART</th>
                <th class="col-ket">STATUS</th>
                <th class="col-pic">PIC</th>
            </tr>
        </thead>
        <tbody id="table_content">
            </tbody>
    </table>

    <div class="signature-section">
        <div class="sig-box">
            <div class="sig-title">DIBUAT</div>
            <div class="sig-line"></div>
            <div class="sig-label">Teknisi</div>
        </div>
        <div class="sig-box">
            <div class="sig-title">DIKETAHUI</div>
            <div class="sig-line"></div>
            <div class="sig-label">Supervisor</div>
        </div>
        <div class="sig-box">
            <div class="sig-title">DISETUJUI</div>
            <div class="sig-line"></div>
            <div class="sig-label">Superintendent</div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    const selectHTML = `
        <select class="table-select">
            <option value=""></option>
            <option value="OK">OK</option>
            <option value="NG">NG</option>
        </select>
    `;

    function formatTgl(isoString) {
        if (!isoString) return "-";
        const d = new Date(isoString);
        return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: '2-digit' }); // Format pendek dd/mm/yy
    }

    // Fungsi Render Baris Kosong
    function renderEmptyRows(count, tbody) {
        for (let i = 0; i < count; i++) {
            tbody.innerHTML += `<tr>
                <td style="height:22px">&nbsp;</td>
                <td></td><td></td><td></td>
                <td>${selectHTML}</td>
                <td></td>
            </tr>`;
        }
    }

    async function fetchData() {
        const mesin = document.getElementById('mesin_search').value.trim().toUpperCase();
        const bulan = document.getElementById('bulan_search').value;
        const tahun = document.getElementById('tahun_search').value;
        const tbody = document.getElementById('table_content');

        if(!mesin) return alert("Masukkan Nama Mesin!");

        let query = _sb.from('laporan_maintenance').select(`
            id, jam_mulai, created_at, nama_mesin, engineer_name,
            maintenance_problems(description),
            maintenance_actions(description),
            maintenance_parts(nama_part, qty)
        `).eq('nama_mesin', mesin);

        if(bulan) {
            const lastDay = new Date(tahun, bulan, 0).getDate();
            query = query.gte('jam_mulai', `${tahun}-${bulan}-01T00:00:00Z`)
                     .lte('jam_mulai', `${tahun}-${bulan}-${lastDay}T23:59:59Z`);
        } else {
            query = query.gte('jam_mulai', `${tahun}-01-01T00:00:00Z`)
                     .lte('jam_mulai', `${tahun}-12-31T23:59:59Z`);
        }

        const { data: reports, error } = await query.order('jam_mulai', { ascending: false });

        if (error) return alert("Error: " + error.message);
        
        tbody.innerHTML = '';
        const TARGET_ROW_COUNT = 25; // Target baris agar pas 1 halaman A4

        if (reports && reports.length > 0) {
            document.getElementById('d_mesin').innerText = reports[0].nama_mesin;
            
            reports.forEach(row => {
                const tr = document.createElement('tr');
                const masalah = row.maintenance_problems.map(p => p.description).join(', ');
                const tindakan = row.maintenance_actions.map(a => a.description).join(', ');
                const parts = row.maintenance_parts.map(pt => `${pt.nama_part}(${pt.qty})`).join(', ');

                tr.innerHTML = `
                    <td class="col-tgl">${formatTgl(row.jam_mulai || row.created_at)}</td>
                    <td style="text-align:left; padding-left:4px;">${masalah}</td>
                    <td style="text-align:left; padding-left:4px;">${tindakan}</td>
                    <td style="text-align:left; padding-left:4px;">${parts}</td>
                    <td>${selectHTML}</td>
                    <td>${row.engineer_name}</td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            document.getElementById('d_mesin').innerText = mesin;
        }

        // Isi sisa baris agar tampilan penuh satu halaman
        const existingRows = reports ? reports.length : 0;
        const remaining = TARGET_ROW_COUNT - existingRows;
        
        if (remaining > 0) {
            renderEmptyRows(remaining, tbody);
        }
    }

    // Load awal kosong 25 baris
    window.onload = () => {
        const tbody = document.getElementById('table_content');
        renderEmptyRows(25, tbody);
    };
</script>

</body>
</html>
