<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager - Final Approval Overhaul</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sig-canvas { border: 2px dashed #1e293b; background: #fff; width: 100%; height: 160px; touch-action: none; cursor: crosshair; border-radius: 8px; }
        .table-manager th { background: #1e293b; color: white; text-transform: uppercase; font-size: 0.75rem; padding: 15px; }
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 100; 
            inset: 0; 
            background: rgba(0,0,0,0.7); 
            align-items: center; 
            justify-content: center; 
            padding: 1.5rem; 
        }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        .approved-spt { background: #dcfce7; color: #15803d; border: 1px solid #bdf2cb; }
        .approved-mn { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .rejected { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<header class="bg-[#1e293b] text-white p-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-4">
        <button onclick="window.location.href='laporan.html'" class="text-xs font-bold bg-slate-700 px-4 py-2 rounded-xl hover:bg-slate-600 transition border border-white/10 uppercase tracking-widest">← Dashboard</button>
        <h1 class="text-xl font-black tracking-tighter uppercase">Manager Final Approval</h1>
    </div>
    <button onclick="fetchLaporan()" class="bg-blue-600 px-5 py-2 rounded-xl font-black text-xs hover:bg-blue-500 transition shadow-xl uppercase tracking-widest">Refresh Data</button>
</header>

<div class="container mx-auto p-6">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        <table class="w-full text-left border-collapse table-manager">
            <thead>
                <tr>
                    <th class="px-6">Tanggal Input</th>
                    <th class="px-6">Mesin / Equipment</th>
                    <th class="px-6">Engineer</th>
                    <th class="px-6">Pemeriksa (SPT)</th>
                    <th class="px-6 text-center">Status</th>
                    <th class="px-6 text-center">Aksi</th>
                </tr>
            </thead>
            <tbody id="listLaporan">
                <tr><td colspan="6" class="p-16 text-center text-slate-400 italic font-medium">Menunggu laporan dari Superintendent...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalManager" class="modal">
    <div class="bg-white w-full max-w-5xl rounded-[2rem] shadow-2xl overflow-hidden max-h-[95vh] flex flex-col">
        <div class="bg-slate-50 p-6 border-b flex justify-between items-center">
            <h2 class="text-xl font-extrabold text-slate-800 uppercase tracking-tight">Otorisasi Final Laporan</h2>
            <button onclick="closeModal()" class="text-3xl font-light hover:text-red-500 transition leading-none">&times;</button>
        </div>
        
        <div class="p-8 overflow-y-auto flex-grow" id="modalContent"></div>

        <div class="px-8 pb-4 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-blue-50/50 p-5 rounded-2xl border border-blue-100 shadow-sm">
                <p class="text-[9px] font-black text-blue-800 uppercase mb-2 tracking-widest">Catatan Engineer:</p>
                <p id="view_eng_notes_modal" class="text-xs italic text-slate-600 leading-relaxed"></p>
            </div>
            <div class="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100 shadow-sm">
                <p class="text-[9px] font-black text-emerald-800 uppercase mb-1 tracking-widest">Evaluasi Superintendent:</p>
                <p id="view_spt_name_modal" class="text-[10px] font-black text-slate-800 uppercase mb-1"></p>
                <p id="view_spt_notes_modal" class="text-xs italic text-slate-600 leading-relaxed"></p>
            </div>
        </div>

        <div class="p-8 bg-slate-50 border-t">
            <div id="decisionPending" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Nama Manager Otorisasi</label>
                        <input type="text" id="mn_name" class="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none uppercase font-bold" placeholder="NAMA LENGKAP MANAGER">
                    </div>
                    <div class="space-y-1 text-center">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Tanda Tangan Manager</p>
                        <div class="relative">
                            <canvas id="sig-mn" class="sig-canvas shadow-sm"></canvas>
                            <button onclick="clearCanvas()" class="absolute top-2 right-2 text-[9px] bg-red-50 text-red-600 px-3 py-1 rounded-lg font-black uppercase">Reset</button>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <button onclick="saveDecision('Rejected')" class="flex-1 bg-white border-2 border-red-600 text-red-600 py-4 rounded-2xl font-black text-xs hover:bg-red-50 transition-all uppercase tracking-widest">Reject (Kembalikan)</button>
                    <button onclick="saveDecision('Manager Approved')" class="flex-[2] bg-slate-800 text-white py-4 rounded-2xl font-black text-xs hover:bg-slate-900 shadow-2xl transition-all uppercase tracking-widest">Final Approve & Arsipkan</button>
                </div>
            </div>

            <div id="decisionDone" class="hidden text-center py-6">
                <div class="inline-block px-12 py-4 rounded-2xl font-black text-xl border-4" id="finalStatusBadge"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    let currentId = null;
    let canvas, ctx, drawing = false;

    async function fetchLaporan() {
        // MANAGER HANYA MENARIK DATA YANG SUDAH 'Approved' OLEH SUPERINTENDENT
        const { data, error } = await _sb.from('laporan_maintenance')
            .select('*')
            .or('status.eq.Approved,status.eq.Manager Approved,status.eq.Rejected') 
            .order('created_at', { ascending: false });

        const list = document.getElementById('listLaporan');
        
        if (data) {
            list.innerHTML = data.map(row => {
                let badgeClass = 'partial';
                if (row.status === 'Manager Approved') badgeClass = 'approved-mn';
                if (row.status === 'Approved') badgeClass = 'approved-spt';
                if (row.status === 'Rejected') badgeClass = 'rejected';

                return `
                <tr class="border-b hover:bg-slate-50 transition-all text-sm">
                    <td class="p-5 font-medium text-slate-500">${new Date(row.created_at).toLocaleDateString('id-ID')}</td>
                    <td class="p-5 font-black text-slate-800 uppercase tracking-tight">${row.nama_mesin}</td>
                    <td class="p-5 font-semibold text-slate-600 uppercase text-xs">${row.engineer_name}</td>
                    <td class="p-5 font-bold text-blue-700 uppercase text-xs">${row.spt_name || '-'}</td>
                    <td class="p-5 text-center"><span class="status-badge ${badgeClass}">${row.status}</span></td>
                    <td class="p-5 text-center">
                        <button onclick='viewDetail(${JSON.stringify(row)})' class="bg-[#1e293b] text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-md hover:scale-105 transition-all">Proses</button>
                    </td>
                </tr>
            `}).join('');
        }
    }

    async function viewDetail(row) {
        currentId = row.id;
        const { data: prob } = await _sb.from('maintenance_problems').select('*').eq('maintenance_id', row.id);
        const { data: act } = await _sb.from('maintenance_actions').select('*').eq('maintenance_id', row.id);
        const { data: part } = await _sb.from('maintenance_parts').select('*').eq('maintenance_id', row.id);

        const cont = document.getElementById('modalContent');
        cont.innerHTML = `
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8 bg-slate-50 p-6 rounded-3xl border border-slate-200">
                <div><p class="text-[9px] text-slate-400 uppercase font-black tracking-widest">Equipment</p><p class="font-black text-slate-800 uppercase text-lg">${row.nama_mesin}</p></div>
                <div><p class="text-[9px] text-slate-400 uppercase font-black tracking-widest">Job Type</p><p class="font-black text-blue-600 uppercase text-lg">${row.job_type}</p></div>
                <div><p class="text-[9px] text-slate-400 uppercase font-black tracking-widest">Engineer</p><p class="font-bold text-slate-700 uppercase">${row.engineer_name}</p></div>
                <div><p class="text-[9px] text-slate-400 uppercase font-black tracking-widest">Date</p><p class="font-bold text-slate-700">${new Date(row.created_at).toLocaleDateString('id-ID')}</p></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div><h3 class="font-black text-slate-800 border-b-2 border-slate-100 mb-3 pb-2 text-[10px] uppercase tracking-widest">Masalah Ditemukan</h3><ul class="text-xs space-y-2 italic text-slate-600">${prob.map(p => `<li>• ${p.description}</li>`).join('')}</ul></div>
                <div><h3 class="font-black text-slate-800 border-b-2 border-slate-100 mb-3 pb-2 text-[10px] uppercase tracking-widest">Tindakan Perbaikan</h3><ul class="text-xs space-y-2 italic text-slate-600">${act.map(a => `<li>• ${a.description}</li>`).join('')}</ul></div>
            </div>
        `;

        document.getElementById('view_eng_notes_modal').innerText = `"${row.rekomendasi_catatan || 'Engineer tidak memberikan catatan tambahan.'}"`;
        document.getElementById('view_spt_name_modal').innerText = "Pemeriksa: " + (row.spt_name || "-");
        document.getElementById('view_spt_notes_modal').innerText = `"${row.spt_notes || 'Superintendent tidak memberikan catatan khusus.'}"`;

        // LOGIKA TAMPILAN PANEL
        const isDecided = (row.status === 'Manager Approved' || row.status === 'Rejected');
        document.getElementById('decisionPending').style.display = isDecided ? 'none' : 'block';
        document.getElementById('decisionDone').style.display = isDecided ? 'block' : 'none';

        if(isDecided) {
            const badge = document.getElementById('finalStatusBadge');
            if(row.status === 'Manager Approved') {
                badge.innerText = "LAPORAN FINAL DISETUJUI";
                badge.className = "inline-block px-12 py-4 rounded-2xl font-black text-xl border-4 border-green-600 text-green-600 bg-green-50";
            } else {
                badge.innerText = "LAPORAN DITOLAK / REJECTED";
                badge.className = "inline-block px-12 py-4 rounded-2xl font-black text-xl border-4 border-red-600 text-red-600 bg-red-50";
            }
        }

        document.getElementById('modalManager').style.display = 'flex';
        
        // Setup signature
        canvas = document.getElementById('sig-mn');
        ctx = canvas.getContext('2d');
        setTimeout(() => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 3; ctx.lineCap = 'round';
        }, 100);
    }

    async function saveDecision(statusValue) {
        const name = document.getElementById('mn_name').value.trim();
        const signature = canvas.toDataURL();
        const blank = document.createElement('canvas');
        blank.width = canvas.width; blank.height = canvas.height;

        if (!name) return alert("Wajib isi Nama Manager!");
        if (signature === blank.toDataURL()) return alert("Wajib membubuhkan tanda tangan!");

        if (!confirm(`Konfirmasi keputusan: ${statusValue}?`)) return;

        const { error } = await _sb.from('laporan_maintenance')
            .update({ 
                status: statusValue,
                manager_name: name,
                manager_signature: signature 
            })
            .eq('id', currentId);

        if (!error) {
            alert(`Berhasil! Laporan telah diperbarui.`);
            closeModal();
            fetchLaporan();
        } else {
            alert("Kesalahan: " + error.message);
        }
    }

    function clearCanvas() { if(ctx) ctx.clearRect(0,0,canvas.width,canvas.height); }
    function closeModal() { document.getElementById('modalManager').style.display = 'none'; clearCanvas(); }
    window.onload = fetchLaporan;

    // Tanda Tangan Manager
    function getP(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - r.left, y: (e.clientY || e.touches[0].clientY) - r.top }; }
    document.addEventListener('mousedown', (e) => { if(e.target === canvas) { drawing=true; const p=getP(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }});
    document.addEventListener('mousemove', (e) => { if(drawing && e.target === canvas) { const p=getP(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }});
    window.addEventListener('mouseup', () => drawing=false);
    document.addEventListener('touchstart', (e) => { if(e.target === canvas) { e.preventDefault(); drawing=true; const p=getP(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }}, {passive:false});
    document.addEventListener('touchmove', (e) => { if(drawing && e.target === canvas) { e.preventDefault(); const p=getP(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }}, {passive:false});
</script>

</body>
</html>
