<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employe Report - Personil Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .gradient-emerald { background: linear-gradient(135deg, #064e3b 0%, #059669 100%); }
        .btn-person { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-person:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="gradient-emerald text-white p-10 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black uppercase tracking-tighter">Employe Report</h1>
                <p class="text-emerald-100 text-sm font-medium mt-1">Pilih personil untuk melihat detail performa dan laporan kerja</p>
            </div>
            <a href="management_tracker.html" class="bg-white/10 hover:bg-white/20 text-white px-5 py-2 rounded-xl font-bold text-xs uppercase backdrop-blur-md border border-white/20 transition">
                Kembali
            </a>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-6 py-16 max-w-4xl">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <a href="riyan.html" class="btn-person bg-white p-8 rounded-3xl border-b-8 border-blue-600 shadow-xl flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-blue-50 rounded-2xl flex items-center justify-center mb-6 text-2xl font-black text-blue-600">R</div>
                <h2 class="text-xl font-black text-slate-800 uppercase">Riyan</h2>
                <p class="text-slate-400 text-[10px] font-bold mt-2 tracking-widest uppercase">Maintenance Support</p>
            </a>

            <a href="isqi.html" class="btn-person bg-white p-8 rounded-3xl border-b-8 border-indigo-600 shadow-xl flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-indigo-50 rounded-2xl flex items-center justify-center mb-6 text-2xl font-black text-indigo-600">I</div>
                <h2 class="text-xl font-black text-slate-800 uppercase">Isqi</h2>
                <p class="text-slate-400 text-[10px] font-bold mt-2 tracking-widest uppercase">Maintenance Support</p>
            </a>

            <a href="jumawan.html" class="btn-person bg-white p-8 rounded-3xl border-b-8 border-orange-500 shadow-xl flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-orange-50 rounded-2xl flex items-center justify-center mb-6 text-2xl font-black text-orange-600">J</div>
                <h2 class="text-xl font-black text-slate-800 uppercase text-nowrap">Jumawan</h2>
                <p class="text-slate-400 text-[10px] font-bold mt-2 tracking-widest uppercase">Senior Maintenance</p>
            </a>

        </div>
    </header>

    <footer class="p-8 text-center text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em]">
        &copy; 2026 PT. AMARILIS KARISMA GEMILANG
    </footer>

</body>
</html>
