<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Superintendent - Approval System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f0f2f5; color: #333; }
        header { background: #003366; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5 rgba(0,0,0,0.1); }
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Search & Filter Section */
        .search-section { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .input-search { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 13px; color: #666; text-transform: uppercase; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-top: 1px solid #eee; font-size: 14px; }
        
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-back { background: #6c757d; color: white; text-decoration: none; font-size: 14px; }
        .btn-outline-danger { background: transparent; border: 1px solid #dc3545; color: #dc3545; padding: 6px 10px; }
        .btn-outline-danger:hover { background: #dc3545; color: white; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); overflow-y: auto; }
        .modal-content { background: white; margin: 2% auto; padding: 25px; border-radius: 12px; width: 90%; max-width: 900px; }
        
        .section-header { background: #f1f4f8; padding: 12px; margin: 20px 0 10px; font-weight: bold; color: #003366; border-left: 5px solid #003366; }
        .grid-item-ng { border: 2px solid #dc3545; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: #fff5f5; }
        .grid-item-na { border: 1px solid #ccc; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #f9f9f9; color: #777; font-style: italic; }
        
        .ng-label { font-weight: bold; color: #b21f2d; font-size: 16px; text-transform: uppercase; }
        .ng-reason-box { margin-top: 10px; padding: 10px; background: white; border-radius: 5px; border-left: 4px solid #dc3545; font-size: 15px; color: #333; }
        .all-ok-msg { color: #28a745; font-weight: bold; padding: 10px; font-style: italic; }

        .super-note-box { background: #e3f2fd; border: 1px solid #bbdefb; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .sig-area { border: 2px dashed #003366; margin: 15px 0; background: #fafafa; border-radius: 8px; }
        canvas { width: 100%; height: 150px; cursor: crosshair; display: block; touch-action: none; }
        textarea, input.input-nama { width: 100%; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 1.2rem; font-weight: bold;">SUPERINTENDENT - APPROVAL SYSTEM</div>
    <div>
        <a href="dashboard.html" class="btn btn-back">← Kembali ke Dashboard</a>
        <button class="btn btn-primary" onclick="loadData()">Refresh Data</button>
    </div>
</header>

<div class="container">
    <div class="search-section">
        <strong>Cari Tanggal Checklist:</strong>
        <input type="date" id="searchDate" class="input-search" onchange="filterDataByDate()">
        <button class="btn btn-back" onclick="resetFilter()">Reset</button>
        <button class="btn btn-success" onclick="exportToExcel()">📊 Download Excel</button>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Pelaksana</th>
                    <th>Superintendent</th>
                    <th>Equipment / Capacity</th>
                    <th>Tanggal</th>
                    <th>Week</th> <th>Keterangan</th> 
                    <th>Status</th>
                    <th style="text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="mainTable">
                <tr><td colspan="8" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size:28px; font-weight:bold;" onclick="closeModal()">&times;</span>
        <h2 style="color:#003366; margin:0;">Review Checklist</h2>
        <p id="infoPelaksana" style="color:#666; margin-top:5px; font-weight: bold;"></p>
        <hr>
        
        <div id="superNoteArea"></div>
        <div id="modalBody"></div>

        <div id="approvalPanel" style="margin-top:30px; border-top: 2px solid #eee; padding-top:20px;">
            <div id="pendingSection" style="display:none; text-align:center;">
                <div style="text-align: left; margin-bottom: 15px;">
                    <label><strong>Nama Superintendent:</strong></label>
                    <input type="text" id="namaSuperintendent" class="input-nama" list="list-super" placeholder="Ketik nama atau pilih dari daftar...">
                    <datalist id="list-super">
                        <option value="A. Rizki Mubarok K"></option>
                    </datalist>
                    
                    <label><strong>Keterangan / Catatan Tambahan:</strong></label>
                    <textarea id="keteranganSuper" placeholder="Tambahkan catatan untuk pelaksana (opsional)..."></textarea>
                </div>

                <p><strong>Tanda Tangan Superintendent:</strong></p>
                <div class="sig-area"><canvas id="sig-canvas"></canvas></div>
                <button class="btn" style="background:#6c757d; color:white; margin-bottom:15px;" onclick="clearSig()">Hapus TTD</button>
                <div style="display: flex; justify-content: space-around;">
                    <button class="btn btn-success" style="width: 45%;" onclick="processStatus('Approved')">APPROVE</button>
                    <button class="btn btn-danger" style="width: 45%;" onclick="processStatus('Rejected')">REJECT</button>
                </div>
            </div>

            <div id="historySection" style="display:none; text-align:center;">
                <h3 id="historyLabel"></h3>
                <p><strong>Superintendent:</strong> <span id="historyNamaSuper"></span></p> 
                <div id="historySigArea">
                    <img id="historySigImg" style="max-width:300px; border:1px solid #ddd; padding:5px; background:white;">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://yutxomhfqodjzqqibewd.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let activeId = null;
    let rawData = []; 
    let filteredData = []; 
    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 600; canvas.height = 150; ctx.lineWidth = 3; ctx.lineCap = 'round';

    const masterStructure = [
        { section: "1. STAND LABEL", prefix: "", fields: ["wiring", "komponen", "kerapihan", "sensor", "timing_belt", "pully", "servo_motor", "linear_bearing", "rotary_actuator", "selenoid_valve", "vacuum_ejector", "silinder_pneumatic", "napple", "vacuum_pad", "flange", "vacuum_pad_takeout"] },
        { section: "2. STACKING", prefix: "stacking_", fields: ["wiring", "sensor", "linier", "mechanical_part", "cylinder", "pneumatic"] },
        { section: "3. CONVEYOR", prefix: "conveyor_", fields: ["belt", "motor", "rantai", "frame", "inverter"] },
        { section: "4. DOSING", prefix: "dosing_", fields: ["alarm", "setting"] },
        { section: "5. DUMMY", prefix: "dummy_", fields: ["vacuum", "condition", "flange", "instalasi", "tubbing"] }
    ];

    let drawing = false;
    function getP(e) {
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - r.left;
        const y = (e.clientY || e.touches[0].clientY) - r.top;
        return { x: x * (canvas.width/r.width), y: y * (canvas.height/r.height) };
    }
    canvas.onmousedown = (e) => { drawing=true; ctx.beginPath(); const p=getP(e); ctx.moveTo(p.x, p.y); };
    canvas.onmousemove = (e) => { if(!drawing) return; const p=getP(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    window.onmouseup = () => drawing=false;
    canvas.ontouchstart = (e) => { e.preventDefault(); drawing=true; ctx.beginPath(); const p=getP(e); ctx.moveTo(p.x, p.y); };
    canvas.ontouchmove = (e) => { e.preventDefault(); if(!drawing) return; const p=getP(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };

    function clearSig() { ctx.clearRect(0,0,canvas.width,canvas.height); }

    async function loadData() {
        // PERBAIKAN: Mengambil data relasi dari tabel 'pelaksana' agar kolom 'week' bisa diakses
        const { data, error } = await _supabase.from('checklist').select('*, pelaksana(*)').order('created_at', { ascending: false });
        if(error) return;
        rawData = data;
        filteredData = data; 
        renderTable(filteredData);
    }

    function renderTable(dataList) {
        const tableBody = document.getElementById('mainTable');
        if (dataList.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center;">Tidak ada data.</td></tr>`;
            return;
        }
        tableBody.innerHTML = dataList.map(row => `
            <tr>
                <td><strong>${row.pelaksana?.nama_pelaksana || '-'}</strong></td>
                <td>${row.nama_superintendent || '<i style="color:#ccc">N/A</i>'}</td>
                <td>${row.pelaksana?.nama_tools || '-'} / ${row.pelaksana?.capacity || '-'}</td>
                <td>${row.pelaksana?.tanggal_checklist || '-'}</td>
                <td><strong>${row.pelaksana?.week || '-'}</strong></td> <td>${row.keterangan || '<i style="color:#ccc">N/A</i>'}</td>
                <td><span class="badge status-${row.status.toLowerCase()}">${row.status}</span></td>
                <td style="text-align: center; white-space: nowrap;">
                    <button class="btn btn-primary" onclick='openModal(${JSON.stringify(row)})'>REVIEW</button>
                    <button class="btn btn-outline-danger" title="Hapus" onclick="deleteData('${row.id}')">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    function filterDataByDate() {
        const selectedDate = document.getElementById('searchDate').value;
        if (!selectedDate) {
            filteredData = rawData;
        } else {
            filteredData = rawData.filter(row => row.pelaksana?.tanggal_checklist === selectedDate);
        }
        renderTable(filteredData);
    }

    function resetFilter() {
        document.getElementById('searchDate').value = '';
        filteredData = rawData;
        renderTable(filteredData);
    }

    function exportToExcel() {
        if (filteredData.length === 0) {
            alert("Tidak ada data untuk diexport!");
            return;
        }

        const dataToExport = filteredData.map(item => ({
            "Pelaksana": item.pelaksana?.nama_pelaksana || "-",
            "Superintendent": item.nama_superintendent || "-",
            "Equipment": item.pelaksana?.nama_tools || "-",
            "Capacity": item.pelaksana?.capacity || "-",
            "Tanggal": item.pelaksana?.tanggal_checklist || "-",
            "Week": item.pelaksana?.week || "-", // PERBAIKAN: Export week dari tabel pelaksana
            "Status": item.status,
            "Keterangan": item.keterangan || "-"
        }));

        const worksheet = XLSX.utils.json_to_sheet(dataToExport);

        const colWidths = Object.keys(dataToExport[0]).map(key => {
            let maxLen = key.length;
            dataToExport.forEach(row => {
                let cellValue = row[key] ? row[key].toString() : "";
                if (cellValue.length > maxLen) maxLen = cellValue.length;
            });
            return { wch: maxLen + 5 };
        });

        worksheet['!cols'] = colWidths;

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data Checklist");

        const dateVal = document.getElementById('searchDate').value || "Semua_Tanggal";
        XLSX.writeFile(workbook, `Checklist_Report_${dateVal}.xlsx`);
    }

    async function deleteData(id) {
        if(!confirm("Hapus data ini secara permanen?")) return;
        const { error } = await _supabase.from('checklist').delete().eq('id', id);
        if(!error) {
            alert("Data berhasil dihapus!");
            loadData();
        } else {
            alert("Gagal menghapus: " + error.message);
        }
    }

    function openModal(row) {
        activeId = row.id;
        document.getElementById('infoPelaksana').innerText = `PELAKSANA: ${row.pelaksana?.nama_pelaksana} | UNIT: ${row.pelaksana?.nama_tools}`;
        
        if (row.status !== 'Pending') {
            document.getElementById('superNoteArea').innerHTML = `<div class="super-note-box"><strong>Catatan:</strong> ${row.keterangan || "-"}</div>`;
        } else {
            document.getElementById('superNoteArea').innerHTML = '';
        }

        const body = document.getElementById('modalBody');
        body.innerHTML = '';
        masterStructure.forEach(sec => {
            let itemsHtml = '';
            sec.fields.forEach(f => {
                const dbF = sec.prefix + f;
                const val = row[dbF];
                
                if(val === 'NG') {
                    itemsHtml += `<div class="grid-item-ng"><div class="ng-label">${f.replace(/_/g,' ')}</div><div class="ng-reason-box"><strong>Temuan:</strong> ${row[dbF + "_keterangan"]}</div></div>`;
                } else if (val === 'N/A') {
                    itemsHtml += `<div class="grid-item-na"><strong>${f.replace(/_/g,' ').toUpperCase()}:</strong> N/A (Tidak Berlaku)</div>`;
                }
            });
            
            body.innerHTML += `<div class="section-header">${sec.section}</div>`;
            if (itemsHtml === '') {
                body.innerHTML += `<div class="all-ok-msg">✓ Semua item OK</div>`;
            } else {
                body.innerHTML += itemsHtml;
            }
        });

        const isP = row.status === 'Pending';
        document.getElementById('pendingSection').style.display = isP ? 'block' : 'none';
        document.getElementById('historySection').style.display = isP ? 'none' : 'block';
        
        if(!isP) {
            document.getElementById('historyLabel').innerText = row.status;
            document.getElementById('historyNamaSuper').innerText = row.nama_superintendent;
            document.getElementById('historySigImg').src = row.signature || '';
        }

        document.getElementById('modal').style.display = 'block';
        clearSig();
    }

    async function processStatus(st) {
        const namaSuper = document.getElementById('namaSuperintendent').value;
        if(!namaSuper) return alert("Isi nama superintendent!");

        const update = { 
            status: st, 
            approved_at: new Date().toISOString(),
            nama_superintendent: namaSuper,
            keterangan: document.getElementById('keteranganSuper').value 
        };

        if(st === 'Approved') {
            const dataURL = canvas.toDataURL();
            const blank = document.createElement('canvas');
            blank.width = canvas.width; blank.height = canvas.height;
            if(dataURL === blank.toDataURL()) return alert("Tanda tangan wajib!");
            update.signature = dataURL;
        }

        const { error } = await _supabase.from('checklist').update(update).eq('id', activeId);
        if(!error) { alert("Berhasil diproses!"); closeModal(); loadData(); }
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    window.onload = loadData;
</script>
</body>
</html>
