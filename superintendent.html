<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Superintendent - Dual Approval System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f0f2f5; color: #333; }
        header { background: #003366; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5 rgba(0,0,0,0.1); }
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Tab Navigation */
        .tab-navigation { display: flex; gap: 10px; margin-bottom: 20px; background: white; padding: 10px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tab-btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-active { background: #003366 !important; color: white !important; }
        .tab-inactive { background: #e9ecef; color: #495057; }

        .search-section { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .input-search { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 13px; color: #666; text-transform: uppercase; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-top: 1px solid #eee; font-size: 14px; }
        
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-back { background: #6c757d; color: white; text-decoration: none; font-size: 14px; }
        .btn-outline-danger { background: transparent; border: 1px solid #dc3545; color: #dc3545; padding: 6px 10px; }
        .btn-outline-danger:hover { background: #dc3545; color: white; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); overflow-y: auto; }
        .modal-content { background: white; margin: 2% auto; padding: 25px; border-radius: 12px; width: 90%; max-width: 900px; }
        
        .section-header { background: #f1f4f8; padding: 12px; margin: 20px 0 10px; font-weight: bold; color: #003366; border-left: 5px solid #003366; }
        .grid-item-ng { border: 2px solid #dc3545; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: #fff5f5; }
        .grid-item-na { border: 1px solid #ccc; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #f9f9f9; color: #777; font-style: italic; }
        
        .sig-area { border: 2px dashed #003366; margin: 15px 0; background: #fafafa; border-radius: 8px; }
        canvas { width: 100%; height: 150px; cursor: crosshair; display: block; touch-action: none; }
        textarea, input.input-nama { width: 100%; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 1.2rem; font-weight: bold;">SUPERINTENDENT - APPROVAL SYSTEM</div>
    <div>
        <a href="dashboard.html" class="btn btn-back">← Dashboard</a>
        <button class="btn btn-primary" onclick="refreshCurrentData()">Refresh Data</button>
    </div>
</header>

<div class="container">
    <div class="tab-navigation">
        <button id="btnRutin" class="tab-btn tab-active" onclick="switchTab('rutin')">📋 Checklist Rutin</button>
        <button id="btnTrial" class="tab-btn tab-inactive" onclick="switchTab('trial')">🧪 Checklist Trial Mold</button>
    </div>

    <div class="search-section">
        <strong>Filter Tanggal:</strong>
        <input type="date" id="searchDate" class="input-search" onchange="filterData()">
        <button class="btn btn-back" onclick="resetFilter()">Reset</button>
        <button class="btn btn-success" onclick="exportToExcel()">📊 Export Excel</button>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr id="tableHead">
                    </tr>
            </thead>
            <tbody id="mainTable">
                <tr><td colspan="8" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size:28px; font-weight:bold;" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:#003366; margin:0;">Review Data</h2>
        <p id="infoPelaksana" style="color:#666; margin-top:5px; font-weight: bold;"></p>
        <hr>
        <div id="superNoteArea"></div>
        <div id="modalBody"></div>

        <div id="approvalPanel" style="margin-top:30px; border-top: 2px solid #eee; padding-top:20px;">
            <div id="pendingSection" style="display:none;">
                <label><strong>Nama Superintendent:</strong></label>
                <input type="text" id="namaSuperintendent" class="input-nama" list="list-super" placeholder="Ketik nama...">
                <datalist id="list-super"><option value="A. Rizki Mubarok K"></option></datalist>
                
                <label><strong>Catatan Tambahan:</strong></label>
                <textarea id="keteranganSuper" placeholder="Opsional..."></textarea>

                <p><strong>Tanda Tangan:</strong></p>
                <div class="sig-area"><canvas id="sig-canvas"></canvas></div>
                <button class="btn btn-back" onclick="clearSig()">Hapus TTD</button>
                <div style="display: flex; justify-content: space-between; margin-top:15px;">
                    <button class="btn btn-success" style="width: 48%;" onclick="processStatus('Approved')">APPROVE</button>
                    <button class="btn btn-outline-danger" style="width: 48%;" onclick="processStatus('Rejected')">REJECT</button>
                </div>
            </div>
            <div id="historySection" style="display:none; text-align:center;">
                <h3 id="historyLabel"></h3>
                <p><strong>Superintendent:</strong> <span id="historyNamaSuper"></span></p> 
                <img id="historySigImg" style="max-width:300px; border:1px solid #ddd; background:white;">
            </div>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://yutxomhfqodjzqqibewd.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentTab = 'rutin';
    let rawData = [];
    let activeId = null;

    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 600; canvas.height = 150; ctx.lineWidth = 3; ctx.lineCap = 'round';

    // Switch Antar Tab
    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('btnRutin').className = tab === 'rutin' ? 'tab-btn tab-active' : 'tab-btn tab-inactive';
        document.getElementById('btnTrial').className = tab === 'trial' ? 'tab-btn tab-active' : 'tab-btn tab-inactive';
        refreshCurrentData();
    }

    async function refreshCurrentData() {
        document.getElementById('mainTable').innerHTML = `<tr><td colspan="8" style="text-align:center;">Memuat data...</td></tr>`;
        const table = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';
        const selectQuery = currentTab === 'rutin' ? '*, pelaksana(*)' : '*';
        
        const { data, error } = await _supabase.from(table).select(selectQuery).order('created_at', { ascending: false });
        if(error) return alert("Error: " + error.message);
        
        rawData = data;
        filterData();
    }

    function filterData() {
        const selectedDate = document.getElementById('searchDate').value;
        let displayData = [];

        if (!selectedDate) {
            displayData = rawData.filter(row => row.status === 'Pending');
        } else {
            displayData = rawData.filter(row => {
                const rowDate = currentTab === 'rutin' ? row.pelaksana?.tanggal_checklist : row.tanggal_trial;
                return rowDate === selectedDate;
            });
        }
        renderTable(displayData);
    }

    function renderTable(data) {
        const head = document.getElementById('tableHead');
        const body = document.getElementById('mainTable');

        // Header Dinamis
        if (currentTab === 'rutin') {
            head.innerHTML = `<th>Pelaksana</th><th>Superintendent</th><th>Tooling/Unit</th><th>Tanggal</th><th>Week</th><th>Status</th><th>Aksi</th>`;
        } else {
            head.innerHTML = `<th>Operator</th><th>Superintendent</th><th>Mold Name</th><th>Trial Date</th><th>Category</th><th>Status</th><th>Aksi</th>`;
        }

        if (data.length === 0) {
            body.innerHTML = `<tr><td colspan="8" style="text-align:center;">Data tidak ditemukan.</td></tr>`;
            return;
        }

        body.innerHTML = data.map(row => {
            const col1 = currentTab === 'rutin' ? (row.pelaksana?.nama_pelaksana || '-') : (row.operator || '-');
            const col2 = row.nama_superintendent || '<i style="color:#ccc">N/A</i>';
            const col3 = currentTab === 'rutin' ? (row.pelaksana?.nama_tools || '-') : (row.nama_mold || '-');
            const col4 = currentTab === 'rutin' ? (row.pelaksana?.tanggal_checklist || '-') : (row.tanggal_trial || '-');
            const col5 = currentTab === 'rutin' ? (row.pelaksana?.week || '-') : (row.kategori || '-');

            return `
                <tr>
                    <td><strong>${col1}</strong></td>
                    <td>${col2}</td>
                    <td>${col3}</td>
                    <td>${col4}</td>
                    <td>${col5}</td>
                    <td><span class="badge status-${row.status.toLowerCase()}">${row.status}</span></td>
                    <td><button class="btn btn-primary" onclick='openModal(${JSON.stringify(row)})'>REVIEW</button></td>
                </tr>
            `;
        }).join('');
    }

    function openModal(row) {
        activeId = row.id;
        const info = currentTab === 'rutin' 
            ? `PELAKSANA: ${row.pelaksana?.nama_pelaksana} | TOOLING: ${row.pelaksana?.nama_tools}`
            : `OPERATOR: ${row.operator} | MOLD: ${row.nama_mold}`;
        
        document.getElementById('infoPelaksana').innerText = info;
        document.getElementById('modalTitle').innerText = currentTab === 'rutin' ? 'Review Checklist Rutin' : 'Review Checklist Trial Mold';
        
        // Render Detail (Sederhana untuk Trial, Kompleks untuk Rutin)
        const body = document.getElementById('modalBody');
        body.innerHTML = currentTab === 'rutin' ? 'Detail item pengecekan rutin...' : `
            <div class="section-header">DATA TRIAL MOLD</div>
            <p><strong>Mesin:</strong> ${row.mesin || '-'}</p>
            <p><strong>Berat Produk:</strong> ${row.berat_produk || '-'} g</p>
            <p><strong>Status Trial:</strong> ${row.hasil_trial || '-'}</p>
        `;

        const isP = row.status === 'Pending';
        document.getElementById('pendingSection').style.display = isP ? 'block' : 'none';
        document.getElementById('historySection').style.display = isP ? 'none' : 'block';

        if(!isP) {
            document.getElementById('historyLabel').innerText = row.status;
            document.getElementById('historyNamaSuper').innerText = row.nama_superintendent;
            document.getElementById('historySigImg').src = row.signature || '';
        }
        document.getElementById('modal').style.display = 'block';
        clearSig();
    }

    async function processStatus(st) {
        const name = document.getElementById('namaSuperintendent').value;
        if(!name) return alert("Nama Superintendent wajib diisi!");
        
        const table = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';
        const update = {
            status: st,
            nama_superintendent: name,
            approved_at: new Date().toISOString(),
            keterangan: document.getElementById('keteranganSuper').value,
            signature: canvas.toDataURL()
        };

        const { error } = await _supabase.from(table).update(update).eq('id', activeId);
        if(!error) { alert("Data Berhasil di-Update!"); closeModal(); refreshCurrentData(); }
    }

    // TTD Logic
    let drawing = false;
    function getP(e) {
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - r.left;
        const y = (e.clientY || e.touches[0].clientY) - r.top;
        return { x: x * (canvas.width/r.width), y: y * (canvas.height/r.height) };
    }
    canvas.onmousedown = (e) => { drawing=true; ctx.beginPath(); const p=getP(e); ctx.moveTo(p.x, p.y); };
    canvas.onmousemove = (e) => { if(!drawing) return; const p=getP(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    window.onmouseup = () => drawing=false;
    function clearSig() { ctx.clearRect(0,0,canvas.width,canvas.height); }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function resetFilter() { document.getElementById('searchDate').value = ''; filterData(); }

    window.onload = () => refreshCurrentData();
</script>
</body>
</html>
