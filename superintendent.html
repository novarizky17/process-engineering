<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Superintendent - Approval System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f4f6f9; color: #333; padding-bottom: 20px; }
        
        /* HEADER */
        header { 
            background: linear-gradient(90deg, #003366 0%, #004080 100%); 
            color: white; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            flex-wrap: wrap; 
            gap: 15px;
        }
        .header-title { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
        .header-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        /* CONTAINER DEFAULT (DESKTOP) */
        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        /* TAB MENU */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { 
            padding: 10px 20px; 
            border-radius: 30px; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            background: #e9ecef; 
            color: #555; 
            transition: all 0.3s ease; 
            font-size: 13px; 
            flex: 1; 
            text-align: center;
        }
        .tab-btn.active { 
            background: #003366; 
            color: white; 
            box-shadow: 0 4px 12px rgba(0, 51, 102, 0.3); 
            transform: translateY(-2px);
        }

        /* SEARCH SECTION */
        .search-section { 
            background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; 
            display: flex; align-items: center; gap: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex-wrap: wrap;
        }
        .input-search { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; flex-grow: 1; }
        .input-search:focus { border-color: #003366; }

        /* TOMBOL GENERIC */
        .btn { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; text-decoration: none; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #0d6efd; color: white; }
        .btn-success { background: #198754; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #212529; box-shadow: 0 3px 5px rgba(255, 193, 7, 0.3); }
        .btn-excel { background: #207245; color: white; margin-left: auto; }
        .btn-back { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.4); }

        /* TABLE CARD DEFAULT (DESKTOP) */
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        
        /* DESKTOP VIEW */
        @media screen and (min-width: 769px) {
            table { width: 100%; border-collapse: collapse; min-width: 1000px; }
            th { background: #f8f9fa; padding: 18px; text-align: left; font-size: 13px; color: #555; text-transform: uppercase; border-bottom: 2px solid #eee; font-weight: 700; }
            td { padding: 16px; border-top: 1px solid #eee; font-size: 14px; vertical-align: middle; color: #444; }
            .row-ng td { border-top: 1px solid #ffebeb; }
        }

        /* --- MOBILE VIEW (HP) - FULL WIDTH EXTREME --- */
        @media screen and (max-width: 768px) {
            /* 1. HAPUS SEMUA MARGIN DAN PADDING CONTAINER */
            .container { padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
            
            /* 2. Header diatur ulang */
            header { flex-direction: column; text-align: center; gap: 10px; padding: 15px; }
            .header-controls { justify-content: center; width: 100%; }
            .header-controls button, .header-controls a { width: 100%; margin-bottom: 5px; }
            
            /* 3. Search & Tab Menu */
            .search-section { border-radius: 0; margin: 0; border-bottom: 1px solid #eee; padding: 10px; }
            .tab-menu { padding: 10px; margin: 0; background: #fff; border-bottom: 1px solid #eee; }
            .btn-excel { margin-left: 0; width: 100%; margin-top: 10px; }
            
            /* 4. TABEL JADI KARTU FULL MENTOK */
            #mainTableParent { width: 100%; display: block; }
            #mainTableParent thead { display: none; } 
            
            .card { border-radius: 0 !important; box-shadow: none !important; background: transparent; }

            /* Setiap Data Pelaksana */
            #mainTable tr { 
                display: block; 
                margin-bottom: 10px; /* Pemisah antar data */
                background: #fff;
                border-top: 1px solid #ddd;
                border-bottom: 1px solid #ddd;
                width: 100%; 
            }
            
            #mainTable td { 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                padding: 10px 15px; /* Padding dalam sel agar teks tidak nempel garis */
                border-bottom: 1px solid #f0f0f0; 
                font-size: 14px;
                text-align: right;
                width: 100%; 
                box-sizing: border-box; /* Pastikan padding tidak nambah lebar */
            }
            
            #mainTable td:last-child { border-bottom: none; justify-content: center; padding-top: 15px; background: #fcfcfc; }
            
            /* Label Kolom */
            #mainTable td::before { 
                content: attr(data-label); 
                font-weight: 700; 
                text-transform: uppercase; 
                font-size: 11px; 
                color: #666; 
                text-align: left;
                margin-right: 15px;
            }

            /* 5. Modal HP */
            .modal-content { width: 100%; height: 100%; margin: 0; border-radius: 0; max-height: 100vh; overflow-y: auto; padding: 20px; }
            .info-grid { grid-template-columns: 1fr; } 
            canvas { width: 100% !important; }
            
            /* Tombol Aksi */
            .action-btn-group { width: 100%; display: flex; gap: 5px; }
            .action-btn-group button { flex: 1; justify-content: center; }

            /* Tabel Detail di Modal (HP) */
            .json-table thead { display: none; } 
            .json-table { width: 100%; display: block; }
            .json-table tr { display: flex; flex-wrap: wrap; border-bottom: 1px solid #e0e0e0; padding: 10px 0; background-color: #fff; }
            .json-table td { padding: 2px 0; border: none; text-align: left !important; display: block; width: 100%; }
            .json-table .col-item { font-weight: 800; color: #003366; font-size: 14px; margin-bottom: 4px; }
            .json-table .col-status { font-weight: bold; margin-bottom: 2px; }
            .json-table .col-ket { font-size: 13px; color: #666; font-style: italic; }
        }

        .badge { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d1e7dd; color: #0f5132; }
        .status-rejected { background: #f8d7da; color: #842029; }
        .row-ng { background-color: #fff8f8; } 

        .status-ng { color: #dc3545; font-weight: bold; } 
        .status-ok { color: #198754; font-weight: bold; } 
        .status-na { color: #6c757d; font-style: italic; font-weight: bold; }
        
        .all-ok-msg { padding: 20px; background: #d1e7dd; color: #0f5132; border-radius: 8px; text-align: center; font-weight: 700; margin-bottom: 20px; border: 1px solid #badbcc; }
        
        #autoProcessStatus { margin-right: 15px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9); display: none; }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* MODAL & POPUP */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); overflow-y: auto; }
        .modal-content { background: white; margin: 2% auto; padding: 30px; border-radius: 16px; width: 95%; max-width: 1200px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .confirm-modal-content { 
            background: white; margin: 25% auto; padding: 25px; border-radius: 12px; 
            width: 85%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            animation: popIn 0.3s;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .confirm-icon { font-size: 50px; margin-bottom: 15px; display: block; }
        .confirm-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #333; }
        .confirm-text { font-size: 0.95rem; color: #666; margin-bottom: 25px; line-height: 1.5; }
        .confirm-actions { display: flex; gap: 10px; justify-content: center; }
        .btn-confirm-yes { background: #003366; color: white; flex: 1; }
        .btn-confirm-no { background: #e9ecef; color: #333; flex: 1; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 25px; border-left: 5px solid #003366; }
        .info-item label { font-size: 11px; color: #777; display: block; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-item span { font-size: 15px; font-weight: 600; color: #222; }

        .section-header { background: #eef2f7; padding: 12px 15px; margin: 25px 0 0 0; font-weight: 700; color: #003366; border-left: 5px solid #003366; border-radius: 4px; font-size: 15px; }
        .sub-header { background: #f8f9fa; padding: 8px 15px; font-weight: 700; color: #555; font-size: 13px; border-bottom: 1px solid #dee2e6; }
        
        .super-note-box { background: #e3f2fd; border: 1px solid #90caf9; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #0d47a1; }
        
        .sig-area { border: 2px dashed #ccc; margin: 15px 0; background: #fafafa; border-radius: 8px; height: 160px; position: relative; }
        canvas { width: 100%; height: 100%; cursor: crosshair; display: block; touch-action: none; }
        textarea, input.input-nama { width: 100%; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; padding: 12px; box-sizing: border-box; font-family: inherit; }
        
        #historySection { display: none; text-align: center; }
        #historySigArea { margin-top: 15px; display: flex; justify-content: center; width: 100%; }
        #historySigImg { max-width: 300px; border: 1px solid #eee; padding: 10px; background: white; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<header>
    <div class="header-title">APPROVAL SYSTEM</div>
    <div class="header-controls">
        <span id="autoProcessStatus"><span class="spinner"></span> Wait...</span>
        <button class="btn btn-warning" onclick="window.triggerAutoApprove()">✨ AUTO APPROVE</button>
        <button class="btn btn-primary" onclick="window.refreshData()">🔄 Refresh</button>
        <a href="dashboard.html" class="btn btn-back">← Kembali</a>
    </div>
</header>

<div class="container">
    <div class="tab-menu">
        <button id="tabRutin" class="tab-btn active" onclick="window.switchTab('rutin')">📋 Checklist Rutin</button>
        <button id="tabTrial" class="tab-btn" onclick="window.switchTab('trial')">🧪 Trial Mold</button>
    </div>

    <div class="search-section">
        <span class="filter-label">Cari Tanggal:</span>
        <input type="date" id="searchDate" class="input-search" onchange="window.filterDataByDate()">
        <button class="btn btn-primary" onclick="window.resetFilter()">Reset</button>
        <button class="btn btn-excel" onclick="window.downloadExcel()">📥 Excel</button>
    </div>

    <div style="margin-bottom: 10px; font-size: 13px; color: #666; font-style: italic; padding: 0 10px;">
        * Default: Tampil data <strong>PENDING / NG</strong>. Data <strong>AMAN (OK/NA)</strong> otomatis disembunyikan.
    </div>

    <div class="card">
        <table id="mainTableParent">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="mainTable"><tr><td colspan="8" style="text-align:center; padding:20px;">Memuat data...</td></tr></tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size:28px; font-weight:bold;" onclick="window.closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:#003366; margin:0; margin-bottom: 15px;">Review Checklist</h2>
        
        <div id="infoBox" class="info-grid"></div>
        <div id="superNoteArea"></div>
        <div id="modalBody"></div>

        <div id="approvalPanel" style="margin-top:30px; border-top: 2px solid #eee; padding-top:20px;">
            <div id="pendingSection" style="display:none; text-align:center;">
                <div style="text-align: left; margin-bottom: 15px;">
                    <label><strong>Nama Superintendent:</strong></label>
                    <input type="text" id="namaSuperintendent" class="input-nama" list="list-super" placeholder="Ketik nama..." value="A. Rizki Mubarok K">
                    <datalist id="list-super"><option value="A. Rizki Mubarok K"></option></datalist>
                    
                    <label style="color:#003366; margin-top:10px;"><strong>Catatan / Keterangan Superintendent:</strong></label>
                    <textarea id="keteranganSuper" placeholder="Tuliskan komentar..."></textarea>
                </div>

                <p><strong>Tanda Tangan Superintendent:</strong></p>
                <div class="sig-area"><canvas id="sig-canvas"></canvas></div>
                <button class="btn" style="background:#6c757d; color:white; margin-bottom:15px;" onclick="window.clearSig()">Hapus TTD</button>
                
                <div style="display: flex; justify-content: center; gap: 15px; flex-wrap:wrap;">
                    <button class="btn btn-success" style="width: 45%;" onclick="window.confirmManualAction('Approved')">✅ APPROVE</button>
                    <button class="btn btn-danger" style="width: 45%;" onclick="window.confirmManualAction('Rejected')">❌ REJECT</button>
                </div>
            </div>

            <div id="historySection" style="display:none;">
                <h3 id="historyLabel" style="margin-bottom:10px;"></h3>
                <p style="margin-bottom:10px;"><strong>Superintendent:</strong> <span id="historyNamaSuper"></span></p> 
                <div id="historySigArea">
                    <img id="historySigImg" alt="Tanda Tangan" style="display:none;">
                    <span id="historyNoSig" style="display:none; font-style:italic; color:#888;">(Disetujui Otomatis / Tanpa TTD)</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="confirmModal" class="modal">
    <div class="confirm-modal-content">
        <span class="confirm-icon" id="confirmIcon">⚠️</span>
        <div class="confirm-title" id="confirmTitle">Konfirmasi</div>
        <div class="confirm-text" id="confirmText">Apakah Anda yakin?</div>
        <div class="confirm-actions">
            <button class="btn btn-confirm-no" onclick="window.closeConfirmModal()">Batal</button>
            <button class="btn btn-confirm-yes" id="btnConfirmYes">Ya, Lanjutkan</button>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://yutxomhfqodjzqqibewd.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const rutinGroups = [
        { title: "1. STAND LABEL", subs: [ { sub: "ELECTRICAL", items: ["wiring", "komponen", "kerapihan", "sensor"] }, { sub: "MOTION", items: ["timing_belt", "pully", "servo_motor", "linear_bearing", "rotary_actuator"] }, { sub: "PNEUMATIC", items: ["selenoid_valve", "vacuum_ejector", "silinder_pneumatic", "napple", "vacuum_pad"] }, { sub: "TAKE OUT PRODUK", items: ["flange", "vacuum_pad_takeout"] } ] },
        { title: "2. STACKING", subs: [ { sub: "ELECTRICAL", items: ["stacking_wiring", "stacking_sensor"] }, { sub: "MOTION", items: ["stacking_linier", "stacking_mechanical_part"] }, { sub: "PNEUMATIC", items: ["stacking_cylinder", "stacking_pneumatic"] } ] },
        { title: "3. CONVEYOR", subs: [{ sub: "", items: ["conveyor_belt", "conveyor_motor", "conveyor_rantai", "conveyor_frame", "conveyor_inverter"] }] },
        { title: "4. DOSING", subs: [{ sub: "", items: ["dosing_alarm", "dosing_setting"] }] },
        { title: "5. DUMMY", subs: [{ sub: "", items: ["dummy_vacuum", "dummy_condition", "dummy_flange", "dummy_instalasi", "dummy_tubbing"] }] }
    ];

    let activeId = null, rawData = [], filteredData = [], currentTab = 'rutin'; 
    let isProcessingAuto = false; 
    let pendingAction = null;

    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        const modalContent = document.querySelector('.modal-content');
        if(modalContent) {
            const maxWidth = Math.min(600, modalContent.clientWidth - 40); 
            canvas.width = maxWidth;
            canvas.height = 150;
            ctx.lineWidth = 3; ctx.lineCap = 'round';
        }
    }
    window.addEventListener('resize', resizeCanvas);

    window.switchTab = function(tab) {
        currentTab = tab;
        isProcessingAuto = false; 
        document.getElementById('tabRutin').classList.toggle('active', tab === 'rutin');
        document.getElementById('tabTrial').classList.toggle('active', tab === 'trial');
        document.getElementById('filterLabel').innerText = tab === 'rutin' ? 'Cari Tanggal Checklist:' : 'Cari Tanggal Trial:';
        document.getElementById('searchDate').value = '';
        loadData();
    }

    let drawing = false;
    function getP(e) {
        const r = canvas.getBoundingClientRect();
        return { x: ((e.clientX||e.touches[0].clientX)-r.left)*(canvas.width/r.width), y: ((e.clientY||e.touches[0].clientY)-r.top)*(canvas.height/r.height) };
    }
    canvas.onmousedown = (e) => { drawing=true; ctx.beginPath(); ctx.moveTo(getP(e).x, getP(e).y); };
    canvas.onmousemove = (e) => { if(!drawing) return; ctx.lineTo(getP(e).x, getP(e).y); ctx.stroke(); };
    window.onmouseup = () => drawing=false;
    canvas.ontouchstart = (e) => { e.preventDefault(); drawing=true; ctx.beginPath(); ctx.moveTo(getP(e).x, getP(e).y); };
    canvas.ontouchmove = (e) => { e.preventDefault(); if(!drawing) return; ctx.lineTo(getP(e).x, getP(e).y); ctx.stroke(); };
    function clearSig() { ctx.clearRect(0,0,canvas.width,canvas.height); }
    function refreshData() { loadData(); }

    function isRowNG(row) {
        if (currentTab === 'rutin') {
            for (const group of rutinGroups) {
                for (const sub of group.subs) {
                    for (const item of sub.items) {
                        const val = row[item] ? String(row[item]).trim().toUpperCase() : '';
                        if (val === 'NG') return true; 
                    }
                }
            }
            return false;
        } else {
            const checks = [row.check_machine, row.check_mold, row.check_aux, row.check_material, row.check_qc, row.check_safety];
            for (const check of checks) {
                if (check) {
                    for (const key in check) {
                        const itemVal = check[key];
                        let status = '';
                        if (typeof itemVal === 'object' && itemVal !== null) {
                            status = itemVal.status ? String(itemVal.status).trim().toUpperCase() : '';
                        } else {
                            status = String(itemVal).trim().toUpperCase();
                        }
                        if (status === 'NG') return true;
                    }
                }
            }
            return false;
        }
    }

    // --- POP-UP MODAL LOGIC ---
    window.showConfirmModal = function(title, text, icon, actionCallback) {
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmText').innerText = text;
        document.getElementById('confirmIcon').innerText = icon;
        document.getElementById('confirmModal').style.display = 'block';
        
        const btnNo = document.querySelector('.btn-confirm-no');
        const btnYes = document.getElementById('btnConfirmYes');
        
        btnNo.style.display = 'inline-block';
        btnYes.innerText = "Ya, Lanjutkan";

        const newBtn = btnYes.cloneNode(true);
        btnYes.parentNode.replaceChild(newBtn, btnYes);
        
        newBtn.onclick = function() {
            actionCallback();
            window.closeConfirmModal();
        };
    }

    window.showInfoModal = function(title, text, icon) {
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmText').innerText = text;
        document.getElementById('confirmIcon').innerText = icon;
        document.getElementById('confirmModal').style.display = 'block';

        document.querySelector('.btn-confirm-no').style.display = 'none';
        const btnYes = document.getElementById('btnConfirmYes');
        btnYes.innerText = "Tutup";
        
        const newBtn = btnYes.cloneNode(true);
        btnYes.parentNode.replaceChild(newBtn, btnYes);
        
        newBtn.onclick = function() {
            window.closeConfirmModal();
        };
    }

    window.closeConfirmModal = function() {
        document.getElementById('confirmModal').style.display = 'none';
    }

    // --- TRIGGER AUTO APPROVE ---
    window.triggerAutoApprove = async function() {
        if (!rawData || rawData.length === 0) return window.showInfoModal("Info", "Tidak ada data untuk diproses.", "ℹ️");
        if (isProcessingAuto) return;

        const safePendingRows = [];
        rawData.forEach(row => {
            const isNG = isRowNG(row);
            const status = (row.status || '').toLowerCase();
            if (!isNG && status !== 'approved' && status !== 'rejected') {
                safePendingRows.push(row);
            }
        });

        if (safePendingRows.length === 0) {
            return window.showInfoModal("Info", "Tidak ada data 'Aman' yang Pending saat ini.", "ℹ️");
        }

        window.showConfirmModal(
            "Auto Approve", 
            `Ditemukan ${safePendingRows.length} data AMAN (OK/NA).\nApakah Anda yakin ingin menyetujui semuanya sekaligus?`, 
            "✨",
            async function() {
                isProcessingAuto = true;
                document.getElementById('autoProcessStatus').style.display = 'inline-block';
                
                const autoName = "A. Rizki Mubarok K"; 
                const now = new Date().toISOString();
                const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';

                for (const row of safePendingRows) {
                    const updateData = { 
                        status: 'Approved', 
                        approved_at: now, 
                        nama_superintendent: autoName
                    };

                    if (currentTab === 'rutin') {
                        updateData.keterangan = "Approved Automatically (OK)";
                    } else {
                        updateData.keterangan_superintendent = "Approved Automatically (OK)";
                    }
                    
                    await _supabase.from(tableName).update(updateData).eq('id', row.id);
                }
                
                document.getElementById('autoProcessStatus').style.display = 'none';
                isProcessingAuto = false;
                loadData(); 
            }
        );
    }

    // --- TRIGGER MANUAL APPROVE ---
    window.confirmManualAction = function(status) {
        const namaSuper = document.getElementById('namaSuperintendent').value;
        if(!namaSuper) return alert("Harap isi nama superintendent!");

        const icon = status === 'Approved' ? "✅" : "❌";
        const text = status === 'Approved' 
            ? "Anda akan MENYETUJUI (Approve) checklist ini." 
            : "Anda akan MENOLAK (Reject) checklist ini.";

        window.showConfirmModal(
            "Konfirmasi " + status,
            text,
            icon,
            function() {
                processStatus(status);
            }
        );
    }

    // --- TRIGGER DELETE (POP-UP) ---
    window.deleteItem = function(id) {
        window.showConfirmModal(
            "Hapus Data",
            "Apakah Anda yakin ingin menghapus data ini selamanya? Tindakan ini tidak bisa dibatalkan.",
            "🗑️",
            async function() {
                const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';
                const { error } = await _supabase.from(tableName).delete().eq('id', id);
                if (error) alert("Gagal hapus: " + error.message);
                else { loadData(); }
            }
        );
    }

    async function loadData() {
        const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';
        const selectQuery = currentTab === 'rutin' ? '*, pelaksana(*)' : '*';
        const { data, error } = await _supabase.from(tableName).select(selectQuery).order('created_at', { ascending: false });
        if(error) return console.error(error);
        
        rawData = data;
        window.filterDataByDate();
    }

    function filterDataByDate() {
        const selectedDate = document.getElementById('searchDate').value;
        if (selectedDate) {
            filteredData = rawData.filter(row => {
                const rowDate = currentTab === 'rutin' ? row.pelaksana?.tanggal_checklist : row.trial_date;
                return rowDate === selectedDate;
            });
        } else {
            filteredData = rawData.filter(row => {
                const status = (row.status || '').toLowerCase();
                return status !== 'approved' && status !== 'rejected';
            });
        }
        renderTable(filteredData);
    }

    function formatDate(dateString) {
        if (!dateString) return '-';
        const parts = dateString.split('-');
        if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`; 
        return dateString;
    }

    function renderTable(dataList) {
        const header = document.getElementById('tableHeader');
        const tableBody = document.getElementById('mainTable');

        if (currentTab === 'rutin') {
            header.innerHTML = `<th>Pelaksana</th><th>Super</th><th>Equip</th><th>Tanggal</th><th>Week</th><th>Ket</th><th>Status</th><th>Aksi</th>`;
        } else {
            header.innerHTML = `<th>PIC Trial</th><th>Super</th><th>Mesin</th><th>Project</th><th>Tanggal</th><th>Ket. Super</th><th>Status</th><th>Aksi</th>`;
        }

        if (!dataList || dataList.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:#777;">
                ${document.getElementById('searchDate').value ? 'Tidak ada data pada tanggal ini.' : '<strong>Semua Beres!</strong><br>Tidak ada data Pending.'}
            </td></tr>`;
            return;
        }

        tableBody.innerHTML = dataList.map(row => {
            let statusText = row.status || 'Pending';
            if (statusText !== 'Approved' && statusText !== 'Rejected') statusText = 'Pending';

            let statusClass = 'status-pending';
            if (statusText === 'Approved') statusClass = 'status-approved';
            else if (statusText === 'Rejected') statusClass = 'status-rejected';

            const isNG = isRowNG(row);
            const rowClass = isNG ? 'row-ng' : '';

            const actionButtons = `
                <div class="action-btn-group">
                    <button class="btn btn-primary" onclick='openModal(${JSON.stringify(row)})'>REVIEW</button>
                    <button class="btn btn-danger" onclick="window.deleteItem('${row.id}')">🗑️</button>
                </div>`;

            if (currentTab === 'rutin') {
                return `<tr class="${rowClass}">
                    <td data-label="Pelaksana"><strong>${row.pelaksana?.nama_pelaksana || '-'}</strong></td>
                    <td data-label="Superintendent">${row.nama_superintendent || '-'}</td>
                    <td data-label="Equipment">${row.pelaksana?.nama_tools || '-'}</td>
                    <td data-label="Tanggal">${formatDate(row.pelaksana?.tanggal_checklist)}</td>
                    <td data-label="Week">${row.pelaksana?.week || '-'}</td> 
                    <td data-label="Keterangan">${row.keterangan || '-'}</td>
                    <td data-label="Status"><span class="badge ${statusClass}">${statusText}</span></td>
                    <td data-label="Aksi">${actionButtons}</td>
                </tr>`;
            } else {
                return `<tr class="${rowClass}">
                    <td data-label="PIC Trial"><strong>${row.pic_trial || '-'}</strong></td>
                    <td data-label="Superintendent">${row.nama_superintendent || '<i style="color:#ccc">N/A</i>'}</td>
                    <td data-label="Mesin">${row.machine_name || '-'}</td>
                    <td data-label="Project">${row.project_name || '-'}</td>
                    <td data-label="Tanggal">${formatDate(row.trial_date)}</td> 
                    <td data-label="Ket. Super">${row.keterangan_superintendent || '-'}</td>
                    <td data-label="Status"><span class="badge ${statusClass}">${statusText}</span></td>
                    <td data-label="Aksi">${actionButtons}</td>
                </tr>`;
            }
        }).join('');
    }

    function resetFilter() { document.getElementById('searchDate').value = ''; filterDataByDate(); }

    function downloadExcel() {
        const selectedDate = document.getElementById('searchDate').value;
        let dataToDownload = selectedDate ? filteredData : rawData;

        if (!dataToDownload || dataToDownload.length === 0) {
            alert("Tidak ada data untuk diunduh!");
            return;
        }
        let dataToExport = [];
        
        if (currentTab === 'rutin') {
            dataToExport = dataToDownload.map(row => ({
                "Pelaksana": row.pelaksana?.nama_pelaksana || '-',
                "Superintendent": row.nama_superintendent || '-',
                "Equipment": row.pelaksana?.nama_tools || '-',
                "Capacity": row.pelaksana?.capacity || '-',
                "Tanggal": formatDate(row.pelaksana?.tanggal_checklist),
                "Week": row.pelaksana?.week || '-',
                "Status Approval": row.status,
                "Keterangan": row.keterangan || '-'
            }));
        } else {
            dataToExport = dataToDownload.map(row => ({
                "PIC Trial": row.pic_trial || '-',
                "Superintendent": row.nama_superintendent || '-',
                "Mesin": row.machine_name || '-',
                "Project": row.project_name || '-',
                "Kode Mold": row.mold_code || '-',
                "Nama Mold": row.mold_name || '-',
                "Tanggal Trial": formatDate(row.trial_date),
                "Status Approval": row.status
            }));
        }
        
        const ws = XLSX.utils.json_to_sheet(dataToExport);
        const columnWidths = [];
        const keys = Object.keys(dataToExport[0]);
        keys.forEach(key => {
            let maxLen = key.length; 
            dataToExport.forEach(row => {
                const cellValue = row[key] ? String(row[key]) : "";
                if (cellValue.length > maxLen) maxLen = cellValue.length;
            });
            if (maxLen > 100) maxLen = 100;
            columnWidths.push({ wch: maxLen + 2 });
        });
        ws['!cols'] = columnWidths;

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, `Report_Filter_NG_${currentTab}.xlsx`);
    }

    function renderJsonCheck(title, jsonData) {
        if (!jsonData || Object.keys(jsonData).length === 0) return '';
        let rows = '';
        let hasIssues = false;
        for (const [key, val] of Object.entries(jsonData)) {
            let status = val.status || '-';
            let note = val.note || '-';
            if (status === 'NG') {
                hasIssues = true;
                let colorClass = 'status-ng';
                rows += `<tr><td class="col-item">${key}</td><td class="col-status ${colorClass}">${status}</td><td class="col-ket">${note}</td></tr>`;
            }
            else if (status === 'N/A' || status === 'NA') {
                 let colorClass = 'status-na';
                 hasIssues = true; 
                 rows += `<tr><td class="col-item">${key}</td><td class="col-status ${colorClass}">N/A</td><td class="col-ket">${note}</td></tr>`;
            }
        }
        if (!hasIssues) return ''; 
        return `<div class="section-header">${title}</div><div class="table-wrapper"><table class="json-table"><tr><th class="col-item">Item</th><th class="col-status">Status</th><th class="col-ket">Note</th></tr>${rows}</table></div>`;
    }

    function renderRutinChecklist(row) {
        let htmlContent = '';
        rutinGroups.forEach(group => {
            let groupRows = '';
            group.subs.forEach(sub => {
                let subRows = '';
                sub.items.forEach(item => {
                    const rawStatus = row[item] ? String(row[item]).trim().toUpperCase() : '';
                    if (rawStatus === 'NG' || rawStatus === 'NA' || rawStatus === 'N/A') { 
                        const note = row[item + '_keterangan'] || '-';
                        const colorClass = rawStatus === 'NG' ? 'status-ng' : 'status-na';
                        const displayStatus = (rawStatus === 'NA' || rawStatus === 'N/A') ? 'N/A' : rawStatus;
                        subRows += `<tr><td class="col-item">${item.replace(/stacking_|conveyor_|dosing_|dummy_|_/g, ' ').toUpperCase()}</td><td class="col-status ${colorClass}">${displayStatus}</td><td class="col-ket">${note}</td></tr>`;
                    }
                });
                if (subRows) {
                    if (sub.sub) groupRows += `<tr><td colspan="3" class="sub-header">${sub.sub}</td></tr>`;
                    groupRows += subRows;
                }
            });
            if (groupRows) {
                htmlContent += `<div class="section-header">${group.title}</div><div class="table-wrapper"><table class="json-table"><tr><th class="col-item">Item</th><th class="col-status">Status</th><th class="col-ket">Keterangan</th></tr>${groupRows}</table></div>`;
            }
        });
        if (!htmlContent) return `<div class="all-ok-msg">✨ Semua Item OK (Aman)</div>`;
        return htmlContent;
    }

    function openModal(row) {
        activeId = row.id;
        document.getElementById('modalTitle').innerText = currentTab === 'rutin' ? "Review Checklist Rutin" : "Review Checklist Trial Mold";
        document.getElementById('keteranganSuper').value = '';

        const infoBox = document.getElementById('infoBox');
        if (currentTab === 'rutin') {
            infoBox.innerHTML = `
                <div class="info-item"><label>Pelaksana</label><span>${row.pelaksana?.nama_pelaksana || '-'}</span></div>
                <div class="info-item"><label>Nama Mesin</label><span>${row.pelaksana?.nama_tools || '-'}</span></div>
                <div class="info-item"><label>Tanggal Checklist</label><span>${formatDate(row.pelaksana?.tanggal_checklist)}</span></div>
                <div class="info-item"><label>Week</label><span>${row.pelaksana?.week || '-'}</span></div>
                <div class="info-item"><label>Capacity</label><span>${row.pelaksana?.capacity || '-'}</span></div>
            `;
        } else {
            infoBox.innerHTML = `
                <div class="info-item"><label>PIC Trial</label><span>${row.pic_trial || '-'}</span></div>
                <div class="info-item"><label>Nama Mesin</label><span>${row.machine_name || '-'}</span></div>
                <div class="info-item"><label>Nama Mold</label><span>${row.mold_name || '-'}</span></div>
                <div class="info-item"><label>Mold Code</label><span>${row.mold_code || '-'}</span></div>
                <div class="info-item"><label>Project</label><span>${row.project_name || '-'}</span></div>
                <div class="info-item"><label>Tanggal Trial</label><span>${formatDate(row.trial_date)}</span></div>
            `;
        }

        if (row.status === 'Approved' || row.status === 'Rejected') {
            const noteText = currentTab === 'rutin' ? row.keterangan : (row.keterangan_superintendent || '-');
            document.getElementById('superNoteArea').innerHTML = `<div class="super-note-box"><strong>Catatan:</strong> ${noteText}</div>`;
        } else {
            document.getElementById('superNoteArea').innerHTML = '';
        }

        const body = document.getElementById('modalBody');
        body.innerHTML = '';

        if (currentTab === 'rutin') {
            body.innerHTML = renderRutinChecklist(row); 
        } else {
            let checksHtml = "";
            checksHtml += renderJsonCheck("1. MESIN INJEKSI", row.check_machine);
            checksHtml += renderJsonCheck("2. PERSIAPAN MOLD", row.check_mold);
            checksHtml += renderJsonCheck("3. AUXILIARY", row.check_aux);
            checksHtml += renderJsonCheck("4. MATERIAL", row.check_material);
            checksHtml += renderJsonCheck("5. QC TOOLS", row.check_qc);
            checksHtml += renderJsonCheck("6. SAFETY", row.check_safety);
            if (checksHtml === "") checksHtml = `<div class="all-ok-msg">✨ Semua Item OK (Aman)</div>`;
            body.innerHTML = checksHtml;
        }

        const isReviewable = row.status !== 'Approved' && row.status !== 'Rejected';
        document.getElementById('pendingSection').style.display = isReviewable ? 'block' : 'none';
        document.getElementById('historySection').style.display = isReviewable ? 'none' : 'block';
        
        if(!isReviewable) {
            document.getElementById('historyLabel').innerText = row.status;
            document.getElementById('historyNamaSuper').innerText = row.nama_superintendent;
            
            const sigUrl = currentTab === 'rutin' ? row.signature : row.signature_superintendent;
            
            document.getElementById('historySigImg').src = sigUrl || '';
            document.getElementById('historySigImg').style.display = sigUrl ? 'block' : 'none';
            document.getElementById('historyNoSig').style.display = sigUrl ? 'none' : 'block';
        } else {
            document.getElementById('namaSuperintendent').value = "A. Rizki Mubarok K";
            window.clearSig();
            resizeCanvas(); // Resize canvas saat modal dibuka
        }
        document.getElementById('modal').style.display = 'block';
    }

    async function processStatus(st) {
        const namaSuper = document.getElementById('namaSuperintendent').value;
        const ketInput = document.getElementById('keteranganSuper').value; 
        if(!namaSuper) return alert("Isi nama superintendent!");

        let update = { 
            status: st, 
            approved_at: new Date().toISOString(), 
            nama_superintendent: namaSuper 
        };

        if (currentTab === 'rutin') update.keterangan = ketInput;
        else update.keterangan_superintendent = ketInput;

        if(st === 'Approved') {
            const manualSig = canvas.toDataURL();
            if (manualSig.length > 3000) { 
                 if (currentTab === 'rutin') update.signature = manualSig;
                 else update.signature_superintendent = manualSig;
            }
        }

        const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';
        const { error } = await _supabase.from(tableName).update(update).eq('id', activeId);

        if(!error) { closeModal(); loadData(); } 
        else { alert("Error: " + error.message); }
    }

    window.closeModal = function() { document.getElementById('modal').style.display = 'none'; }
    window.clearSig = function() { ctx.clearRect(0,0,canvas.width,canvas.height); }
    window.onload = loadData;
</script>
</body>
</html>
