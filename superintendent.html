<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Superintendent - Approval System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f0f2f5; color: #333; }
        header { background: #003366; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5 rgba(0,0,0,0.1); }
        .container { padding: 20px; max-width: 1300px; margin: 0 auto; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: #e0e0e0; color: #666; transition: 0.3s; font-size: 14px; }
        .tab-btn.active { background: #003366; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .search-section { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .input-search { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 13px; color: #666; text-transform: uppercase; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-top: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .status-completed { background: #d1ecf1; color: #0c5460; }

        /* Highlight baris NG */
        .row-ng { background-color: #fff5f5; }
        .row-ng td { border-top: 1px solid #fed7d7; }

        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-back { background: #6c757d; color: white; text-decoration: none; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-excel { background: #198754; color: white; margin-left: auto; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); overflow-y: auto; }
        .modal-content { background: white; margin: 2% auto; padding: 25px; border-radius: 12px; width: 95%; max-width: 1200px; }
        
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #003366; }
        .info-item label { font-size: 11px; color: #666; display: block; margin-bottom: 3px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-item span { font-size: 14px; font-weight: bold; color: #333; }

        .section-header { background: #f1f4f8; padding: 10px 15px; margin: 20px 0 0 0; font-weight: bold; color: #003366; border-left: 5px solid #003366; font-size: 15px; border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .sub-header { background: #e9ecef; padding: 8px 15px; font-weight: bold; color: #495057; font-size: 13px; border-bottom: 1px solid #dee2e6; }

        .super-note-box { background: #e3f2fd; border: 1px solid #bbdefb; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        
        .sig-area { border: 2px dashed #003366; margin: 15px 0; background: #fafafa; border-radius: 8px; }
        canvas { width: 100%; height: 150px; cursor: crosshair; display: block; touch-action: none; }
        textarea, input.input-nama { width: 100%; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; }
        
        .table-wrapper { width: 100%; overflow-x: auto; border: 1px solid #e5e7eb; margin-bottom: 15px; }
        .json-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 700px; }
        .json-table th { background: #eee; text-align: left; padding: 12px 15px; border-bottom: 2px solid #ddd; }
        .json-table td { padding: 10px 15px; border-bottom: 1px solid #eee; vertical-align: top; }
        
        .col-item { width: 35%; }
        .col-status { width: 10%; text-align: center; }
        .col-ket { width: 55%; }

        .status-ng { color: red; font-weight: bold; }
        .status-ok { color: green; font-weight: bold; }
        .status-na { color: #666; font-style: italic; font-weight: bold; }
        
        .all-ok-msg { padding: 15px; background: #d4edda; color: #155724; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        
        /* Auto Approve Loader */
        #autoProcessStatus { margin-left: 15px; font-size: 13px; font-weight: bold; color: #003366; display: none; }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #003366; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* FIX TANDA TANGAN TENGAH */
        #historySection {
            display: none; 
            text-align: center;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        #historySigArea {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        #historySigImg {
            max-width: 300px;
            border: 1px solid #ddd;
            padding: 5px;
            background: white;
            display: block;
        }
    </style>
</head>
<body>

<header>
    <div style="font-size: 1.2rem; font-weight: bold;">SUPERINTENDENT - APPROVAL SYSTEM</div>
    <div>
        <span id="autoProcessStatus"><span class="spinner"></span> Memproses data aman...</span>
        <a href="dashboard.html" class="btn btn-back">← Dashboard</a>
        <button class="btn btn-primary" onclick="refreshData()">Refresh Data</button>
    </div>
</header>

<div class="container">
    <div class="tab-menu">
        <button id="tabRutin" class="tab-btn active" onclick="switchTab('rutin')">📋 Checklist Rutin</button>
        <button id="tabTrial" class="tab-btn" onclick="switchTab('trial')">🧪 Checklist Trial Mold</button>
    </div>

    <div class="search-section">
        <strong id="filterLabel">Cari Tanggal:</strong>
        <input type="date" id="searchDate" class="input-search" onchange="filterDataByDate()">
        <button class="btn btn-back" onclick="resetFilter()">Reset</button>
        <button class="btn btn-excel" onclick="downloadExcel()">📥 Download Excel</button>
    </div>

    <div style="margin-bottom: 10px; font-size: 13px; color: #666; font-style: italic;">
        * Default: Hanya menampilkan data <strong>PENDING</strong>. Pilih <strong>Tanggal</strong> untuk history data selesai.
    </div>

    <div class="card">
        <table>
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="mainTable"><tr><td colspan="8" style="text-align:center;">Memuat data...</td></tr></tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size:28px; font-weight:bold;" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:#003366; margin:0; margin-bottom: 15px;">Review Checklist</h2>
        
        <div id="infoBox" class="info-grid"></div>
        <div id="superNoteArea"></div>
        <div id="modalBody"></div>

        <div id="approvalPanel" style="margin-top:30px; border-top: 2px solid #eee; padding-top:20px;">
            <div id="pendingSection" style="display:none; text-align:center;">
                <div style="text-align: left; margin-bottom: 15px;">
                    <label><strong>Nama Superintendent:</strong></label>
                    <input type="text" id="namaSuperintendent" class="input-nama" list="list-super" placeholder="Ketik nama..." value="A. Rizki Mubarok K">
                    <datalist id="list-super"><option value="A. Rizki Mubarok K"></option></datalist>
                    
                    <label style="color:#003366; margin-top:10px;"><strong>Catatan / Keterangan Superintendent:</strong></label>
                    <textarea id="keteranganSuper" placeholder="Tuliskan komentar atau alasan..."></textarea>
                </div>

                <p><strong>Tanda Tangan Superintendent:</strong></p>
                <div class="sig-area"><canvas id="sig-canvas"></canvas></div>
                <button class="btn" style="background:#6c757d; color:white; margin-bottom:15px;" onclick="clearSig()">Hapus TTD</button>
                
                <div style="display: flex; justify-content: space-around;">
                    <button class="btn btn-success" style="width: 45%;" onclick="processStatus('Approved')">APPROVE</button>
                    <button class="btn btn-danger" style="width: 45%;" onclick="processStatus('Rejected')">REJECT</button>
                </div>
            </div>

            <div id="historySection" style="display:none;">
                <h3 id="historyLabel" style="margin-bottom:10px;"></h3>
                <p style="margin-bottom:10px;"><strong>Superintendent:</strong> <span id="historyNamaSuper"></span></p> 
                <div id="historySigArea">
                    <img id="historySigImg" alt="Tanda Tangan" style="display:none;">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://yutxomhfqodjzqqibewd.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // TANDA TANGAN RIZKI (BASE64)
    const TTD_IMAGE_RIZKI = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAABkCAYAAAAAd623AAAACXBIWXMAAAsTAAALEwEAmpwYAAADsElEQVR4nO3cwW0CQRRF0Z8Z7IAl2AF7YAdsQAtYgh0kgI8E6IDpIAtYgh20AxY7YAl2kAB78G9K06DAn0B0fV9660iWrfLMc6YvY845AACv8mUBAODfCCsAIAgrACAUKwAgFCsAIAn/WJ6YpkkvLy9v77uua7quu7u7e3t/fX2988XhcDj88f7z+fzzuXq9Xv28Xq8Xh8Ph7efD4fD2v6urq4vP9f37+fz7/v39/fn5+fHz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz7/v39/fn5+fHz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+f37+fz+W885/rS9X39fD6fP9f37/v3/fsD6E9Yf9r7+9t+Xp9vAQBAWEEAoVgBAKFYAUAyvwAgv8+430fW/v7+Xh9Af7v9AgCCsAIAgrACAUKxAgBCsQIA+Asvj2pCHmY66gAAAABJRU5ErkJggg==";

    const rutinGroups = [
        { title: "1. STAND LABEL", subs: [ { sub: "ELECTRICAL", items: ["wiring", "komponen", "kerapihan", "sensor"] }, { sub: "MOTION", items: ["timing_belt", "pully", "servo_motor", "linear_bearing", "rotary_actuator"] }, { sub: "PNEUMATIC", items: ["selenoid_valve", "vacuum_ejector", "silinder_pneumatic", "napple", "vacuum_pad"] }, { sub: "TAKE OUT PRODUK", items: ["flange", "vacuum_pad_takeout"] } ] },
        { title: "2. STACKING", subs: [ { sub: "ELECTRICAL", items: ["stacking_wiring", "stacking_sensor"] }, { sub: "MOTION", items: ["stacking_linier", "stacking_mechanical_part"] }, { sub: "PNEUMATIC", items: ["stacking_cylinder", "stacking_pneumatic"] } ] },
        { title: "3. CONVEYOR", subs: [{ sub: "", items: ["conveyor_belt", "conveyor_motor", "conveyor_rantai", "conveyor_frame", "conveyor_inverter"] }] },
        { title: "4. DOSING", subs: [{ sub: "", items: ["dosing_alarm", "dosing_setting"] }] },
        { title: "5. DUMMY", subs: [{ sub: "", items: ["dummy_vacuum", "dummy_condition", "dummy_flange", "dummy_instalasi", "dummy_tubbing"] }] }
    ];

    let activeId = null, rawData = [], filteredData = [], currentRenderedData = [], currentTab = 'rutin'; 
    const canvas = document.getElementById('sig-canvas'), ctx = canvas.getContext('2d');
    canvas.width = 600; canvas.height = 150; ctx.lineWidth = 3; ctx.lineCap = 'round';

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabRutin').classList.toggle('active', tab === 'rutin');
        document.getElementById('tabTrial').classList.toggle('active', tab === 'trial');
        loadData();
    }

    function isRowNG(row) {
        if (currentTab === 'rutin') {
            for (const group of rutinGroups) {
                for (const sub of group.subs) {
                    for (const item of sub.items) {
                        if (row[item] === 'NG') return true;
                    }
                }
            }
            return false;
        } else {
            const checks = [row.check_machine, row.check_mold, row.check_aux, row.check_material, row.check_qc, row.check_safety];
            for (const check of checks) {
                if (check) {
                    for (const key in check) {
                        if (check[key].status === 'NG') return true;
                    }
                }
            }
            return false;
        }
    }

    async function autoApproveSafeItems(safeRows) {
        if (safeRows.length === 0) return;
        document.getElementById('autoProcessStatus').style.display = 'inline-block';
        const now = new Date().toISOString();
        const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';

        for (const row of safeRows) {
            await _supabase.from(tableName).update({ 
                status: 'Approved', approved_at: now, 
                nama_superintendent: 'A. Rizki Mubarok K',
                signature_superintendent: TTD_IMAGE_RIZKI,
                keterangan: currentTab === 'rutin' ? "Auto Approved (Aman)" : undefined,
                keterangan_superintendent: currentTab === 'trial' ? "Auto Approved (Aman)" : undefined
            }).eq('id', row.id);
        }
        document.getElementById('autoProcessStatus').style.display = 'none';
        
        // REFRESH DATA MENTAH SAJA (TANPA LOOP)
        const { data } = await _supabase.from(tableName).select(currentTab === 'rutin' ? '*, pelaksana(*)' : '*').order('created_at', { ascending: false });
        rawData = data || [];
        filterDataByDate();
    }

    async function loadData() {
        const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';
        const { data, error } = await _supabase.from(tableName).select(currentTab === 'rutin' ? '*, pelaksana(*)' : '*').order('created_at', { ascending: false });
        if(error) return console.error(error);
        
        // PISAHKAN DATA AMAN UNTUK AUTO APPROVE
        const safePending = data.filter(row => {
            const isNG = isRowNG(row);
            const status = (row.status || '').toLowerCase();
            return !isNG && status !== 'approved' && status !== 'rejected';
        });

        if (safePending.length > 0) {
            await autoApproveSafeItems(safePending);
        } else {
            rawData = data;
            filterDataByDate();
        }
    }

    function filterDataByDate() {
        const selectedDate = document.getElementById('searchDate').value;
        filteredData = rawData.filter(row => {
            const status = (row.status || '').toLowerCase();
            const isPending = status !== 'approved' && status !== 'rejected';
            if (selectedDate) {
                const d = currentTab === 'rutin' ? row.pelaksana?.tanggal_checklist : row.trial_date;
                return d === selectedDate;
            } 
            return isPending; // Hanya tampilkan yang Pending jika tgl kosong
        });
        renderTable(filteredData);
    }

    function renderTable(dataList) {
        currentRenderedData = dataList;
        const tableBody = document.getElementById('mainTable');
        document.getElementById('tableHeader').innerHTML = currentTab === 'rutin' ? `<th>Pelaksana</th><th>Super</th><th>Equip</th><th>Tanggal</th><th>Week</th><th>Ket</th><th>Status</th><th>Aksi</th>` : `<th>PIC Trial</th><th>Super</th><th>Mesin</th><th>Project</th><th>Tanggal</th><th>Ket. Super</th><th>Status</th><th>Aksi</th>`;
        
        if (!dataList.length) { tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 20px;">Tidak ada data tertunda.</td></tr>`; return; }

        tableBody.innerHTML = dataList.map((row, index) => {
            const s = (row.status || 'Pending').toUpperCase();
            const badge = s === 'APPROVED' ? 'status-approved' : (s === 'REJECTED' ? 'status-rejected' : 'status-pending');
            return `<tr class="${isRowNG(row) ? 'row-ng' : ''}">
                <td><strong>${currentTab === 'rutin' ? (row.pelaksana?.nama_pelaksana || '-') : (row.pic_trial || '-')}</strong></td>
                <td>${row.nama_superintendent || '-'}</td>
                <td>${currentTab === 'rutin' ? (row.pelaksana?.nama_tools || '-') : (row.machine_name || '-')}</td>
                <td>${currentTab === 'rutin' ? (row.pelaksana?.tanggal_checklist || '-') : (row.trial_date || '-')}</td>
                <td>${currentTab === 'rutin' ? (row.pelaksana?.week || '-') : (row.project_name || '-')}</td>
                <td>${currentTab === 'rutin' ? (row.keterangan || '-') : (row.keterangan_superintendent || '-')}</td>
                <td><span class="badge ${badge}">${s}</span></td>
                <td style="text-align:center;">
                    <button class="btn btn-primary" onclick="openModalByIndex(${index})">REVIEW</button>
                    <button class="btn btn-danger" onclick="deleteItemByIndex(${index})">HAPUS</button>
                </td>
            </tr>`;
        }).join('');
    }

    function openModalByIndex(index) {
        const row = currentRenderedData[index];
        activeId = row.id;
        document.getElementById('modalTitle').innerText = "Review " + (currentTab === 'rutin' ? "Rutin" : "Trial Mold");
        document.getElementById('namaSuperintendent').value = "A. Rizki Mubarok K";
        
        const isFin = ['approved', 'rejected'].includes((row.status || '').toLowerCase());
        document.getElementById('pendingSection').style.display = isFin ? 'none' : 'block';
        document.getElementById('historySection').style.display = isFin ? 'flex' : 'none';
        
        if(isFin) {
            document.getElementById('historyLabel').innerText = row.status.toUpperCase();
            document.getElementById('historyNamaSuper').innerText = row.nama_superintendent;
            document.getElementById('historySigImg').src = row.signature_superintendent || '';
            document.getElementById('historySigImg').style.display = row.signature_superintendent ? 'block' : 'none';
        }
        document.getElementById('modal').style.display = 'block';
        clearSig();
    }

    async function processStatus(st) {
        const nama = document.getElementById('namaSuperintendent').value;
        if(!nama) return alert("Isi nama superintendent!");
        const update = { status: st, approved_at: new Date().toISOString(), nama_superintendent: nama, signature_superintendent: canvas.toDataURL() };
        if (currentTab === 'rutin') update.keterangan = document.getElementById('keteranganSuper').value;
        else update.keterangan_superintendent = document.getElementById('keteranganSuper').value;
        await _supabase.from(currentTab === 'rutin' ? 'checklist' : 'checklist_trial').update(update).eq('id', activeId);
        closeModal(); loadData();
    }

    async function deleteItemByIndex(index) {
        if (!confirm("Hapus data ini?")) return;
        await _supabase.from(currentTab === 'rutin' ? 'checklist' : 'checklist_trial').delete().eq('id', currentRenderedData[index].id);
        loadData();
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function clearSig() { ctx.clearRect(0,0,canvas.width,canvas.height); }
    function refreshData() { loadData(); }
    function resetFilter() { document.getElementById('searchDate').value = ''; filterDataByDate(); }

    let drawing = false;
    const getP = (e) => { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX||e.touches[0].clientX)-r.left)*(canvas.width/r.width), y: ((e.clientY||e.touches[0].clientY)-r.top)*(canvas.height/r.height) }; };
    canvas.onmousedown = (e) => { drawing=true; ctx.beginPath(); ctx.moveTo(getP(e).x, getP(e).y); };
    canvas.onmousemove = (e) => { if(!drawing) return; ctx.lineTo(getP(e).x, getP(e).y); ctx.stroke(); };
    window.onmouseup = () => drawing=false;
    canvas.ontouchstart = (e) => { drawing=true; ctx.beginPath(); ctx.moveTo(getP(e).x, getP(e).y); e.preventDefault(); };
    canvas.ontouchmove = (e) => { if(!drawing) return; ctx.lineTo(getP(e).x, getP(e).y); ctx.stroke(); e.preventDefault(); };

    window.onload = loadData;
</script>
</body>
</html>
