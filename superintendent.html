<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Superintendent - Approval System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f0f2f5; color: #333; }
        header { background: #003366; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5 rgba(0,0,0,0.1); }
        .container { padding: 20px; max-width: 1300px; margin: 0 auto; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: #e0e0e0; color: #666; transition: 0.3s; font-size: 14px; }
        .tab-btn.active { background: #003366; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .search-section { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .input-search { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 13px; color: #666; text-transform: uppercase; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-top: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        .row-ng { background-color: #fff5f5; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); overflow-y: auto; }
        .modal-content { background: white; margin: 2% auto; padding: 25px; border-radius: 12px; width: 95%; max-width: 1200px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #003366; }
        .section-header { background: #f1f4f8; padding: 10px 15px; margin: 20px 0 0 0; font-weight: bold; color: #003366; border-left: 5px solid #003366; }
        .sig-area { border: 2px dashed #003366; margin: 15px 0; background: #fafafa; border-radius: 8px; }
        canvas { width: 100%; height: 150px; cursor: crosshair; display: block; touch-action: none; }
        #autoProcessStatus { margin-left: 15px; font-size: 13px; font-weight: bold; color: #003366; display: none; }
        #historySection { display: none; text-align: center; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        #historySigImg { max-width: 300px; border: 1px solid #ddd; padding: 5px; background: white; display: block; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 1.2rem; font-weight: bold;">SUPERINTENDENT - APPROVAL SYSTEM</div>
    <div>
        <span id="autoProcessStatus">⌛ Memproses data aman...</span>
        <a href="dashboard.html" class="btn" style="background:#6c757d; color:white; text-decoration:none;">← Dashboard</a>
        <button class="btn btn-primary" onclick="refreshData()">Refresh Data</button>
    </div>
</header>

<div class="container">
    <div class="tab-menu">
        <button id="tabRutin" class="tab-btn active" onclick="switchTab('rutin')">📋 Checklist Rutin</button>
        <button id="tabTrial" class="tab-btn" onclick="switchTab('trial')">🧪 Checklist Trial Mold</button>
    </div>

    <div class="search-section">
        <strong id="filterLabel">Cari Tanggal:</strong>
        <input type="date" id="searchDate" class="input-search" onchange="filterDataByDate()">
        <button class="btn" style="background:#6c757d; color:white;" onclick="resetFilter()">Reset</button>
        <button class="btn" style="background:#198754; color:white;" onclick="downloadExcel()">📥 Excel</button>
    </div>

    <div class="card">
        <table>
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="mainTable"><tr><td colspan="8" style="text-align:center; padding: 50px;">Memuat data...</td></tr></tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size:28px;" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:#003366;">Review Checklist</h2>
        <div id="infoBox" class="info-grid"></div>
        <div id="superNoteArea"></div>
        <div id="modalBody"></div>

        <div id="approvalPanel" style="margin-top:30px; border-top: 2px solid #eee; padding-top:20px;">
            <div id="pendingSection" style="display:none; text-align:center;">
                <div style="text-align: left;">
                    <label><strong>Nama Superintendent:</strong></label>
                    <input type="text" id="namaSuperintendent" style="width:100%; padding:10px; margin:10px 0;" list="list-super" value="A. Rizki Mubarok K">
                    <datalist id="list-super"><option value="A. Rizki Mubarok K"></option></datalist>
                    <textarea id="keteranganSuper" style="width:100%; padding:10px;" placeholder="Catatan..."></textarea>
                </div>
                <p><strong>Tanda Tangan:</strong></p>
                <div class="sig-area"><canvas id="sig-canvas"></canvas></div>
                <button class="btn" style="background:#6c757d; color:white;" onclick="clearSig()">Hapus TTD</button>
                <div style="display: flex; justify-content: space-around; margin-top:15px;">
                    <button class="btn btn-success" style="width: 45%;" onclick="processStatus('Approved')">APPROVE</button>
                    <button class="btn btn-danger" style="width: 45%;" onclick="processStatus('Rejected')">REJECT</button>
                </div>
            </div>

            <div id="historySection">
                <h3 id="historyLabel"></h3>
                <p><strong>Superintendent:</strong> <span id="historyNamaSuper"></span></p> 
                <div id="historySigArea"><img id="historySigImg" alt="Tanda Tangan"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://yutxomhfqodjzqqibewd.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // FOTO TANDA TANGAN ASLI BOS (BASE64)
    const TTD_IMAGE_DATA = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAABkCAYAAAAAd623AAAACXBIWXMAAAsTAAALEwEAmpwYAAADsElEQVR4nO3cwW0CQRRF0Z8Z7IAl2AF7YAdsQAtYgh0kgI8E6IDpIAtYgh20AxY7YAl2kAB78G9K06DAn0B0fV9660iWrfLMc6YvY845AACv8mUBAODfCCsAIAgrACAUKwAgFCsAIAn/WJ6YpkkvLy9v77uua7quu7u7e3t/fX2988XhcDj88f7z+fzzuXq9Xv28Xq8Xh8Ph7efD4fD2v6urq4vP9f37+fz7/v39/fn5+fHz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz7/v39/fn5+fHz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+fz9fX1z66v7+vX69XPrq/v69fr18+ur+9fXl7eP9f37+f37+fzuW885/rS9X39fD6fP9f37/v3/fsD6E9Yf9r7+9t+Xp9vAQBAWEEAoVgBAKFYAUAyvwAgv8+430fW/v7+Xh9Af7v9AgCCsAIAgrACAUKxAgBCsQIA+Asvj2pCHmY66gAAAABJRU5ErkJggg==";

    let rawData = [], filteredData = [], activeId = null, currentTab = 'rutin', isProcessing = false; 
    const canvas = document.getElementById('sig-canvas'), ctx = canvas.getContext('2d');
    canvas.width = 600; canvas.height = 150; ctx.lineWidth = 3; ctx.lineCap = 'round';

    function isRowNG(row) {
        if (currentTab === 'rutin') {
            const items = ["wiring", "komponen", "kerapihan", "sensor", "timing_belt", "pully", "servo_motor", "linear_bearing", "rotary_actuator", "selenoid_valve", "vacuum_ejector", "silinder_pneumatic", "napple", "vacuum_pad", "flange", "vacuum_pad_takeout", "stacking_wiring", "stacking_sensor", "stacking_linier", "stacking_mechanical_part", "stacking_cylinder", "stacking_pneumatic", "conveyor_belt", "conveyor_motor", "conveyor_rantai", "conveyor_frame", "conveyor_inverter", "dosing_alarm", "dosing_setting", "dummy_vacuum", "dummy_condition", "dummy_flange", "dummy_instalasi", "dummy_tubbing"];
            return items.some(i => row[i] === 'NG');
        }
        const checks = [row.check_machine, row.check_mold, row.check_aux, row.check_material, row.check_qc, row.check_safety];
        return checks.some(c => c && Object.values(c).some(v => v.status === 'NG'));
    }

    async function autoApproveSafeItems(safeRows) {
        if (safeRows.length === 0 || isProcessing) return;
        isProcessing = true;
        document.getElementById('autoProcessStatus').style.display = 'inline-block';
        const now = new Date().toISOString();
        const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';

        for (const row of safeRows) {
            await _supabase.from(tableName).update({ 
                status: 'Approved', approved_at: now, 
                nama_superintendent: 'A. Rizki Mubarok K', 
                signature_superintendent: TTD_IMAGE_DATA,
                keterangan: "Approved Automatically (System Checked)"
            }).eq('id', row.id);
        }
        document.getElementById('autoProcessStatus').style.display = 'none';
        isProcessing = false;
        fetchDataOnly(); // Ambil data tanpa picu loop
    }

    async function loadData() {
        const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';
        const { data, error } = await _supabase.from(tableName).select(currentTab === 'rutin' ? '*, pelaksana(*)' : '*').order('created_at', { ascending: false });
        if(error) return;

        const safePending = data.filter(r => !isRowNG(r) && (r.status || '').toLowerCase() === 'pending');
        if (safePending.length > 0) {
            await autoApproveSafeItems(safePending);
        } else {
            rawData = data;
            filterDataByDate();
        }
    }

    async function fetchDataOnly() {
        const tableName = currentTab === 'rutin' ? 'checklist' : 'checklist_trial';
        const { data } = await _supabase.from(tableName).select(currentTab === 'rutin' ? '*, pelaksana(*)' : '*').order('created_at', { ascending: false });
        rawData = data || [];
        filterDataByDate();
    }

    function filterDataByDate() {
        const selectedDate = document.getElementById('searchDate').value;
        filteredData = rawData.filter(row => {
            const status = (row.status || '').toLowerCase();
            if (selectedDate) {
                const d = currentTab === 'rutin' ? row.pelaksana?.tanggal_checklist : row.trial_date;
                return d === selectedDate;
            } 
            return status === 'pending' || isRowNG(row);
        });
        renderTable(filteredData);
    }

    function renderTable(dataList) {
        const tableBody = document.getElementById('mainTable');
        document.getElementById('tableHeader').innerHTML = currentTab === 'rutin' ? `<th>Pelaksana</th><th>Super</th><th>Equip</th><th>Tanggal</th><th>Status</th><th>Aksi</th>` : `<th>PIC Trial</th><th>Super</th><th>Mesin</th><th>Tanggal</th><th>Status</th><th>Aksi</th>`;
        if (!dataList.length) { tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:50px;">Tidak ada data.</td></tr>`; return; }
        
        tableBody.innerHTML = dataList.map((row, index) => {
            const pic = currentTab === 'rutin' ? (row.pelaksana?.nama_pelaksana || '-') : (row.pic_trial || '-');
            const s = (row.status || 'Pending').toUpperCase();
            return `<tr class="${isRowNG(row) ? 'row-ng' : ''}">
                <td><strong>${pic}</strong></td>
                <td>${row.nama_superintendent || '-'}</td>
                <td>${currentTab==='rutin'?(row.pelaksana?.nama_tools||'-'):(row.machine_name||'-')}</td>
                <td>${currentTab==='rutin'?(row.pelaksana?.tanggal_checklist||'-'):(row.trial_date||'-')}</td>
                <td><span class="badge ${s==='APPROVED'?'status-approved':s==='REJECTED'?'status-rejected':'status-pending'}">${s}</span></td>
                <td><button class="btn btn-primary" onclick="openModalByIndex(${index})">REVIEW</button></td>
            </tr>`;
        }).join('');
    }

    window.openModalByIndex = (index) => {
        const row = filteredData[index];
        activeId = row.id;
        document.getElementById('modalTitle').innerText = "Review " + (currentTab === 'rutin' ? "Rutin" : "Trial");
        const isFin = ['approved', 'rejected'].includes((row.status || '').toLowerCase());
        document.getElementById('pendingSection').style.display = isFin ? 'none' : 'block';
        document.getElementById('historySection').style.display = isFin ? 'flex' : 'none';
        if(isFin) {
            document.getElementById('historyLabel').innerText = row.status.toUpperCase();
            document.getElementById('historyNamaSuper').innerText = row.nama_superintendent;
            document.getElementById('historySigImg').src = row.signature_superintendent || '';
            document.getElementById('historySigImg').style.display = row.signature_superintendent ? 'block' : 'none';
        }
        document.getElementById('modal').style.display = 'block';
        clearSig();
    };

    window.processStatus = async (st) => {
        const update = { status: st, approved_at: new Date().toISOString(), nama_superintendent: document.getElementById('namaSuperintendent').value, signature_superintendent: canvas.toDataURL() };
        if(currentTab === 'rutin') update.keterangan = document.getElementById('keteranganSuper').value;
        else update.keterangan_superintendent = document.getElementById('keteranganSuper').value;
        await _supabase.from(currentTab === 'rutin' ? 'checklist' : 'checklist_trial').update(update).eq('id', activeId);
        closeModal(); loadData();
    };

    window.switchTab = (t) => { currentTab = t; loadData(); };
    window.refreshData = () => loadData();
    window.resetFilter = () => { document.getElementById('searchDate').value = ''; filterDataByDate(); };
    window.closeModal = () => document.getElementById('modal').style.display = 'none';
    window.clearSig = () => ctx.clearRect(0,0,canvas.width,canvas.height);

    // Drawing Canvas
    let drawing = false;
    const getP = (e) => { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX||e.touches[0].clientX)-r.left)*(canvas.width/r.width), y: ((e.clientY||e.touches[0].clientY)-r.top)*(canvas.height/r.height) }; };
    canvas.onmousedown = (e) => { drawing=true; ctx.beginPath(); ctx.moveTo(getP(e).x, getP(e).y); };
    canvas.onmousemove = (e) => { if(!drawing) return; ctx.lineTo(getP(e).x, getP(e).y); ctx.stroke(); };
    window.onmouseup = () => drawing=false;
    canvas.ontouchstart = (e) => { drawing=true; ctx.beginPath(); ctx.moveTo(getP(e).x, getP(e).y); e.preventDefault(); };
    canvas.ontouchmove = (e) => { if(!drawing) return; ctx.lineTo(getP(e).x, getP(e).y); ctx.stroke(); e.preventDefault(); };

    window.onload = loadData;
</script>
</body>
</html>
