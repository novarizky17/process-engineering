<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Panel - Riyan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .gradient-blue { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .btn-done { transition: all 0.3s ease; }
        .btn-done:hover { transform: scale(1.05); background-color: #059669; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="gradient-blue w-full pt-12 pb-24 px-8 mb-[-80px] shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-end">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 bg-white/20 rounded-3xl flex items-center justify-center text-3xl font-black text-white backdrop-blur-md border border-white/30 uppercase">R</div>
                <div>
                    <h1 class="text-3xl font-extrabold text-white tracking-tight uppercase">Panel Kerja Riyan</h1>
                    <p class="text-blue-100 text-sm mt-1 font-medium tracking-wide">Update Progres & Penyelesaian Project</p>
                </div>
            </div>
            <a href="employee_report.html" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase transition-all backdrop-blur-md border border-white/20">
                Kembali
            </a>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 relative z-10">
            <div class="bg-white p-8 rounded-3xl shadow-xl border-l-8 border-amber-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tugas Aktif</p>
                <h3 id="stat-active" class="text-4xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-xl border-l-8 border-emerald-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Selesai Bulan Ini</p>
                <h3 id="stat-finished" class="text-4xl font-black text-emerald-600">0</h3>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-50">
                <h2 class="text-lg font-bold text-slate-800 uppercase tracking-tight">Project Yang Ditugaskan</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold tracking-[0.2em]">
                            <th class="px-8 py-5">Project Name</th>
                            <th class="px-6 py-5 text-center">Start Date</th>
                            <th class="px-6 py-5 text-center">Due Date</th>
                            <th class="px-6 py-5 text-center">Status</th>
                            <th class="px-8 py-5 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="riyan-work-body" class="divide-y divide-slate-50 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        // Ambil data khusus untuk RIYAN dari management_tracker
        async function fetchRiyanTasks() {
            const { data, error } = await _sb
                .from('management_tracker')
                .select('*')
                .eq('assigned_to', 'RIYAN') // Filter untuk personil Riyan
                .order('created_at', { ascending: false });

            if (error) return console.error(error);

            // Hitung Statistik
            document.getElementById('stat-active').innerText = data.filter(r => r.status !== 'Done').length;
            document.getElementById('stat-finished').innerText = data.filter(r => r.status === 'Done').length;

            const tbody = document.getElementById('riyan-work-body');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-slate-400">Belum ada tugas yang diberikan oleh Superintendent.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(row => {
                const isDone = row.status === 'Done';
                
                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-8 py-6">
                            <span class="block font-extrabold text-slate-800 uppercase tracking-tight">${row.project_name}</span>
                            <span class="text-[10px] text-slate-400 font-medium">${row.task_desc || 'No specific description'}</span>
                        </td>
                        <td class="px-6 py-6 text-center font-mono text-[11px] text-slate-500">${row.start_date || '-'}</td>
                        <td class="px-6 py-6 text-center font-mono text-[11px] text-slate-900 font-bold">${row.due_date}</td>
                        <td class="px-6 py-6 text-center">
                            <span class="px-3 py-1 rounded-full font-extrabold text-[9px] uppercase tracking-wider border ${isDone ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-amber-50 text-amber-600 border-amber-100'}">
                                ${row.status}
                            </span>
                        </td>
                        <td class="px-8 py-6 text-center">
                            ${isDone ? 
                                `<span class="text-emerald-500 font-bold text-xs">Selesai pada ${row.actual_finish}</span>` : 
                                `<button onclick="completeProject('${row.id}')" class="btn-done bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold text-[10px] uppercase shadow-md shadow-emerald-100">Selesaikan Project</button>`
                            }
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Fungsi saat Riyan mengklik selesai
        async function completeProject(id) {
            const confirmDone = confirm("Konfirmasi bahwa project ini telah selesai?");
            if (!confirmDone) return;

            const tglSekarang = new Date().toISOString().split('T')[0]; // Format YYYY-MM-DD

            // Update status dan tanggal selesai aktual di tabel management_tracker
            const { error } = await _sb
                .from('management_tracker')
                .update({ 
                    status: 'Done', 
                    actual_finish: tglSekarang 
                })
                .eq('id', id);

            if (error) alert("Gagal mengupdate: " + error.message);
            else {
                alert("Berhasil! Laporan penyelesaian telah terkirim ke Superintendent.");
                fetchRiyanTasks();
            }
        }

        window.onload = fetchRiyanTasks;
    </script>
</body>
</html>
