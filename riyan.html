<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kerja - Riyan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .gradient-blue { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="gradient-blue w-full pt-12 pb-24 px-8 mb-[-80px] shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-end">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 bg-white/20 rounded-3xl flex items-center justify-center text-3xl font-black text-white backdrop-blur-md border border-white/30">R</div>
                <div>
                    <h1 class="text-3xl font-extrabold text-white tracking-tight uppercase">Riyan</h1>
                    <p class="text-blue-100 text-sm mt-1 font-medium tracking-wide uppercase">Personal Performance Tracker</p>
                </div>
            </div>
            <a href="employee_report.html" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase transition-all backdrop-blur-md border border-white/20">
                Kembali
            </a>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 relative z-10">
            <div class="bg-white p-6 rounded-3xl shadow-xl border-l-8 border-blue-600">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Tugas</p>
                <h3 id="stat-total" class="text-3xl font-black text-slate-800">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl border-l-8 border-emerald-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Selesai (Done)</p>
                <h3 id="stat-done" class="text-3xl font-black text-emerald-600">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl border-l-8 border-amber-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sedang Berjalan</p>
                <h3 id="stat-pending" class="text-3xl font-black text-amber-600">0</h3>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800 uppercase tracking-tight">Riwayat Laporan Maintenance</h2>
                <button onclick="fetchRiyanData()" class="text-blue-600 font-bold text-xs uppercase hover:underline">Refresh Data</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold tracking-[0.2em]">
                            <th class="px-8 py-4">Project / Mesin</th>
                            <th class="px-6 py-4">Tugas</th>
                            <th class="px-6 py-4 text-center">Tanggal</th>
                            <th class="px-6 py-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="riyan-body" class="divide-y divide-slate-50 text-sm">
                        <tr>
                            <td colspan="4" class="p-10 text-center text-slate-400 italic font-medium">Memuat data personil...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi Supabase
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        async function fetchRiyanData() {
            // Filter data khusus untuk Engineer bernama "RIYAN"
            const { data, error } = await _sb
                .from('laporan_maintenance')
                .select('*')
                .ilike('engineer_name', 'RIYAN') // Filter case-insensitive
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            // Update Statistik
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-done').innerText = data.filter(r => r.status === 'Approved' || r.status === 'Done').length;
            document.getElementById('stat-pending').innerText = data.filter(r => r.status === 'Pending' || r.status === 'In Progress').length;

            const tbody = document.getElementById('riyan-body');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400">Tidak ada riwayat laporan untuk personil ini.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(row => {
                let statusClass = "bg-slate-100 text-slate-600";
                if(row.status === 'Approved' || row.status === 'Done') statusClass = "bg-emerald-50 text-emerald-600 border border-emerald-100";
                if(row.status === 'Pending') statusClass = "bg-amber-50 text-amber-600 border border-amber-100";

                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-8 py-5 font-extrabold text-slate-800 uppercase tracking-tight">${row.nama_mesin}</td>
                        <td class="px-6 py-5 text-xs font-semibold text-slate-500 uppercase">${row.job_type || '-'}</td>
                        <td class="px-6 py-5 text-center font-mono text-[10px] text-slate-500">
                            ${new Date(row.created_at).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'})}
                        </td>
                        <td class="px-6 py-5 text-center">
                            <span class="px-3 py-1 rounded-full font-extrabold text-[9px] uppercase tracking-wider ${statusClass}">
                                ${row.status}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.onload = fetchRiyanData;
    </script>
</body>
</html>
