<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Form Checklist - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .clock-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-btn {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover {
            transform: translateX(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative">

    <a href="center.html" class="fixed top-8 left-8 flex items-center gap-2 bg-white/20 hover:bg-white text-white hover:text-slate-800 px-5 py-2.5 rounded-2xl font-bold text-xs uppercase backdrop-blur-md border border-white/30 transition-all z-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Menu Utama
    </a>

    <div class="glass-container max-w-xl w-full rounded-[3rem] p-10 md:p-14 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-400/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-purple-400/10 rounded-full blur-3xl"></div>

        <div class="text-center mb-12 relative">
            <div id="clock" class="clock-font text-5xl md:text-6xl font-extrabold text-slate-800 tracking-tighter mb-2">00:00:00</div>
            <div id="date" class="text-slate-500 font-semibold text-sm uppercase tracking-[0.2em] opacity-70">Memuat Tanggal...</div>
            <div class="w-16 h-1 bg-slate-200 mx-auto mt-8 rounded-full"></div>
        </div>

        <h1 class="text-center text-3xl font-extrabold text-slate-800 uppercase tracking-tighter mb-10">
            Form Checklist
        </h1>
        
        <div class="space-y-4">
            <a href="pelaksana.html" class="nav-btn flex items-center justify-between bg-emerald-500 hover:bg-emerald-600 p-6 rounded-3xl text-white shadow-lg shadow-emerald-200 group">
                <div class="flex items-center gap-5">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <div>
                        <div class="text-lg font-bold uppercase tracking-tight">Pelaksana</div>
                        <div class="text-xs text-emerald-100 opacity-80 font-medium italic">Input data checklist lapangan</div>
                    </div>
                </div>
                <svg class="w-6 h-6 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            </a>

            <a href="superintendent.html" class="nav-btn flex items-center justify-between bg-blue-600 hover:bg-blue-700 p-6 rounded-3xl text-white shadow-lg shadow-blue-200 group">
                <div class="flex items-center gap-5">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    </div>
                    <div>
                        <div class="text-lg font-bold uppercase tracking-tight">Superintendent</div>
                        <div class="text-xs text-blue-100 opacity-80 font-medium italic">Validasi & kontrol kualitas</div>
                    </div>
                </div>
                <svg class="w-6 h-6 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            </a>

            <a href="history.html" class="nav-btn flex items-center justify-between bg-slate-800 hover:bg-slate-900 p-6 rounded-3xl text-white shadow-lg shadow-slate-300 group">
                <div class="flex items-center gap-5">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                        <div class="text-lg font-bold uppercase tracking-tight">History</div>
                        <div class="text-xs text-slate-300 opacity-80 font-medium italic">Arsip data riwayat checklist</div>
                    </div>
                </div>
                <svg class="w-6 h-6 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            </a>
        </div>

        <div class="mt-12 text-center">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em]">&copy; 2026 PT. AKG - Tooling Support</p>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Update Jam
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}:${s}`;

            // Update Tanggal
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('id-ID', options);
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
