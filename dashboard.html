<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Form Checklist - Clean Professional</title>

    <style>

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9;
        }

        .glass-container {
            background: rgba(255, 255, 255, 1);
            border: 1px solid #e2e8f0;
        }

        .clock-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

    <a href="center.html" class="fixed top-8 left-8 flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-2xl font-bold text-xs uppercase transition-all z-50 shadow-lg">

            <div id="clock" class="clock-font text-5xl md:text-6xl font-extrabold text-slate-800 tracking-tighter mb-2">00:00:00</div>
            <div id="date" class="text-slate-400 font-bold text-sm uppercase tracking-[0.2em]">Memuat Tanggal...</div>
            <div class="w-16 h-1 bg-blue-600 mx-auto mt-8 rounded-full"></div>
        </div>

        <h1 class="text-center text-2xl font-black text-slate-800 uppercase tracking-tighter mb-10">
            Form Checklist System
        </h1>
        
        <div class="space-y-4">
            <a href="pelaksana.html" class="nav-btn flex items-center justify-between bg-white border-2 border-slate-100 p-6 rounded-3xl group hover:border-emerald-500">

                    <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 group-hover:bg-emerald-500 group-hover:text-white transition-colors">

                        <div class="text-lg font-extrabold text-slate-800 uppercase tracking-tight">Checklist Rutin</div>

            <a href="superintendent.html" class="nav-btn flex items-center justify-between bg-white border-2 border-slate-100 p-6 rounded-3xl group hover:border-blue-600">

                    <div>
                        <div class="text-lg font-extrabold text-slate-800 uppercase tracking-tight">Superintendent</div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Validation Control</div>
                    </div>
                </div>
                <svg class="w-5 h-5 text-slate-300 group-hover:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

                </div>
                <svg class="w-5 h-5 text-slate-300 group-hover:text-violet-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

            <a href="history.html" class="nav-btn flex items-center justify-between bg-white border-2 border-slate-100 p-6 rounded-3xl group hover:border-slate-800">

                    <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-600 group-hover:bg-slate-800 group-hover:text-white transition-colors">

        <div class="mt-12 text-center">
            <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">&copy; 2026 PT. AKG - Tooling Support</p>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Update Jam
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}:${s}`;

            // Update Tanggal
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('id-ID', options);
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
