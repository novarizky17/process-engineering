<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Overhaul - Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }

        .clock-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .btn-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-card:hover {
            transform: translateY(-8px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative">

    <a href="center.html" class="fixed top-8 left-8 flex items-center gap-2 bg-slate-900 hover:bg-black text-white px-5 py-2.5 rounded-2xl font-bold text-sm transition-all shadow-lg z-50 group">
        <svg class="w-5 h-5 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Menu Utama
    </a>

    <div class="max-w-4xl w-full bg-white rounded-[2.5rem] p-10 md:p-16 card-shadow border border-slate-100 relative overflow-hidden">
        
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-slate-50 rounded-full"></div>
        
        <div class="text-center mb-12 relative">
            <div id="clock" class="clock-font text-5xl md:text-6xl font-extrabold text-slate-800 tracking-tighter mb-3">00:00:00</div>
            <div id="date" class="text-slate-400 font-bold text-sm uppercase tracking-[0.3em]">Memuat Tanggal...</div>
            <div class="w-12 h-1.5 bg-blue-600 mx-auto mt-8 rounded-full"></div>
        </div>

        <h1 class="text-center text-3xl font-black text-slate-900 uppercase tracking-tight mb-12">
            Sistem Laporan Overhaul
        </h1>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 relative">
            
            <a href="overhaul.html" class="btn-card bg-emerald-500 hover:bg-emerald-600 p-8 rounded-3xl text-white flex flex-col gap-4 shadow-lg shadow-emerald-200">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div>
                    <h2 class="text-xl font-extrabold uppercase tracking-tight">Pelaksana</h2>
                    <p class="text-emerald-100 text-xs font-medium mt-1">Input data hasil overhaul lapangan</p>
                </div>
            </a>

            <a href="spt_overhaul.html" class="btn-card bg-blue-600 hover:bg-blue-700 p-8 rounded-3xl text-white flex flex-col gap-4 shadow-lg shadow-blue-200">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <div>
                    <h2 class="text-xl font-extrabold uppercase tracking-tight">Superintendent</h2>
                    <p class="text-blue-100 text-xs font-medium mt-1">Review & Approval data overhaul</p>
                </div>
            </a>

            <a href="mn_overhaul.html" class="btn-card bg-rose-500 hover:bg-rose-600 p-8 rounded-3xl text-white flex flex-col gap-4 shadow-lg shadow-rose-200">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <div>
                    <h2 class="text-xl font-extrabold uppercase tracking-tight">Manager</h2>
                    <p class="text-rose-100 text-xs font-medium mt-1">Otorisasi final & laporan manajemen</p>
                </div>
            </a>

            <a href="hs_overhaul.html" class="btn-card bg-slate-800 hover:bg-slate-900 p-8 rounded-3xl text-white flex flex-col gap-4 shadow-lg shadow-slate-300">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <h2 class="text-xl font-extrabold uppercase tracking-tight">History</h2>
                    <p class="text-slate-300 text-xs font-medium mt-1">Arsip riwayat data overhaul</p>
                </div>
            </a>

        </div>

        <div class="mt-16 text-center">
            <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">&copy; 2026 PT. AMARILYS KARISMA GEMILANG</p>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Update Jam Digital
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            // Update Tanggal (Format Indonesia)
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            document.getElementById('date').textContent = now.toLocaleDateString('id-ID', options);
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
