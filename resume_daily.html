<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Daily Report - Grouped Project View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .gradient-orange { background: linear-gradient(135deg, #ea580c 0%, #fb923c 100%); }
        
        /* Utility Classes */
        .toggle-container { background-color: #f1f5f9; border-radius: 16px; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
        .btn-toggle { padding: 8px 16px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: all 0.3s ease; color: #64748b; border: none; cursor: pointer; }
        .btn-active { background-color: #ea580c; color: white; box-shadow: 0 4px 6px -1px rgba(234, 88, 12, 0.4); }
        .person-card { transition: all 0.3s ease; cursor: pointer; border-radius: 1rem; padding: 1rem; text-align: center; border: 1px solid transparent; }
        .person-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); filter: brightness(0.95); }
        
        /* Card Colors */
        .card-ryan { background-color: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
        .card-isyqi { background-color: #f5f3ff; border-color: #ddd6fe; color: #5b21b6; }
        .card-jumawan { background-color: #fffbeb; border-color: #fde68a; color: #92400e; }
        .card-eko { background-color: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
        .card-tata { background-color: #fff1f2; border-color: #fecdd3; color: #9f1239; }
        .card-barok { background-color: #f8fafc; border-color: #e2e8f0; color: #1e293b; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 2% auto; border-radius: 24px; width: 95%; max-width: 900px; overflow: hidden; animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; max-height: 90vh; }
        @keyframes slideIn { from {transform: scale(0.95) translateY(10px); opacity: 0;} to {transform: scale(1) translateY(0); opacity: 1;} }
        
        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Detail Task Card Style (Inside Modal) */
        .task-card {
            background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); position: relative; overflow: hidden;
            transition: all 0.2s;
        }
        .task-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transform: translateY(-2px); }
        .left-border { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
    </style>
</head>
<body class="min-h-screen pb-12 bg-slate-50">

    <header class="gradient-orange w-full pt-12 pb-24 px-8 mb-[-80px] shadow-2xl">
        <div class="max-w-[98%] mx-auto flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight uppercase">Resume Daily Report</h1>
                <p class="text-orange-100 text-sm mt-1 font-medium tracking-wide">Monitoring Progres & Analisis Data Terintegrasi</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase border border-emerald-500 transition-all shadow-lg flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    Download Excel All Task
                </button>
                <a href="management_tracker.html" class="bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase border border-white/20 transition-all">Kembali</a>
            </div>
        </div>
    </header>

    <main class="max-w-[98%] mx-auto px-4 mt-20">
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 relative z-10">
            <div class="lg:col-span-2 bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100">
                <div class="flex flex-col gap-4 mb-6">
                    <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest">Visualisasi Diagram</h3>
                    <div class="toggle-container">
                        <button id="btn-person" onclick="switchChart('person')" class="btn-toggle btn-active">Per Personil</button>
                        <button id="btn-Pending" onclick="switchChart('Pending')" class="btn-toggle">Pending</button>
                        <button id="btn-In Progress" onclick="switchChart('In Progress')" class="btn-toggle">In Progress</button>
                        <button id="btn-Hold" onclick="switchChart('Hold')" class="btn-toggle">Hold</button>
                        <button id="btn-Done" onclick="switchChart('Done')" class="btn-toggle">Done</button>
                    </div>
                </div>
                <div class="h-[350px] w-full"><canvas id="projectChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100 flex flex-col">
                <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest mb-6 text-center">Summary Task</h3>
                <div id="personnel-stats" class="grid grid-cols-2 gap-3 flex-grow"></div>
                <div class="mt-6 pt-4 border-t border-slate-100 text-center">
                    <div class="bg-slate-900 text-white p-4 rounded-2xl inline-block w-full">
                        <p class="text-[10px] font-black uppercase text-slate-400">Grand Total Tasks</p>
                        <h4 id="grand-total-tasks" class="text-2xl font-black mt-1">0</h4>
                    </div>
                </div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-4 top-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                <input type="text" id="search-report" oninput="applyFilters()" placeholder="Cari Nama Project..." class="w-full bg-slate-50 border border-slate-200 pl-12 pr-4 py-3 rounded-2xl text-sm outline-none font-bold focus:border-orange-400 transition-colors">
            </div>
            <div class="flex items-center justify-end px-4 text-xs text-slate-500 italic font-medium">
                * Project yang sama digabungkan. Klik tombol "Review" untuk melihat detail setiap personil.
            </div>
        </section>

        <section class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden text-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-black border-b border-slate-100">
                            <th class="px-6 py-5 w-1/3">Nama Project</th>
                            <th class="px-4 py-5 text-center w-1/6">Total Task</th>
                            <th class="px-4 py-5 text-center w-1/4">Avg Progress</th>
                            <th class="px-6 py-5 text-center w-1/6">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="resume-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="detailModal" class="modal">
        <div class="modal-content shadow-2xl bg-slate-50">
            <div class="bg-slate-900 p-6 text-white flex justify-between items-center border-b border-slate-800 flex-shrink-0">
                <div>
                    <h2 class="text-xl font-black uppercase flex items-center gap-3">
                        <span class="bg-orange-500 w-2 h-6 rounded-full inline-block"></span>
                        Detail Project Group
                    </h2>
                    <p id="det-project-name" class="text-blue-400 text-xs font-bold uppercase tracking-wider mt-1 ml-5"></p>
                </div>
                <button onclick="closeModal()" class="text-white/50 hover:text-white text-3xl transition-colors">&times;</button>
            </div>
            
            <div class="p-8 overflow-y-auto custom-scroll flex-grow bg-slate-50">
                 <div id="grouped-tasks-container" class="flex flex-col gap-6">
                     </div>
            </div>
            
            <div class="p-6 bg-white border-t border-slate-100 flex justify-center flex-shrink-0">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-900 text-white w-full max-w-md py-4 rounded-xl font-black uppercase text-xs shadow-lg transition-all">Tutup Laporan</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);
        
        let rawData = [];       // Data mentah (semua baris)
        let allSubtasks = [];   // Data subtask
        let groupedData = {};   // Data yang dikelompokkan
        let projectChart = null;

        function formatDateTimeClean(str) {
            if (!str) return '-';
            try {
                const date = new Date(str);
                if (isNaN(date.getTime())) return '-';
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const y = date.getFullYear();
                return `${d}/${m}/${y}`;
            } catch (e) { return str; }
        }

        async function fetchAllData() {
            // 1. Ambil Parent Tasks
            const { data: mainData, error: mainError } = await _sb.from('management_tracker').select('*').order('created_at', { ascending: false });
            if (mainError) return console.error(mainError);
            rawData = mainData;

            // 2. Ambil Subtasks
            const { data: subData, error: subError } = await _sb.from('employee_subtasks').select('*').order('created_at', { ascending: true });
            if (!subError) allSubtasks = subData;

            // 3. Proses Data
            processGroupedData();
            updatePersonnelGrid();
            switchChart('person'); 
            renderGroupedTable();
        }

        // --- INTI PERUBAHAN: PENGELOMPOKAN DATA ---
        function processGroupedData() {
            groupedData = {};
            rawData.forEach(item => {
                const name = (item.project_name || "Tanpa Nama").toUpperCase();
                if (!groupedData[name]) {
                    groupedData[name] = {
                        tasks: [],
                        totalProgress: 0,
                        count: 0
                    };
                }
                groupedData[name].tasks.push(item);
                groupedData[name].totalProgress += parseFloat(item.progress_percent || 0);
                groupedData[name].count += 1;
            });
        }

        function getProgressColor(percent) {
            const p = parseFloat(percent);
            if (p >= 100) return "bg-emerald-500"; 
            if (p >= 50) return "bg-blue-600";    
            return "bg-rose-500";                
        }

        function applyFilters() {
            const search = document.getElementById('search-report').value.toLowerCase();
            renderGroupedTable(search);
        }

        // --- RENDER TABEL (HANYA 1 BARIS PER PROJECT) ---
        function renderGroupedTable(searchTerm = "") {
            const tbody = document.getElementById('resume-body');
            const projectNames = Object.keys(groupedData).filter(name => name.toLowerCase().includes(searchTerm));
            
            if (projectNames.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-slate-400 italic">Tidak ada project ditemukan</td></tr>';
                return;
            }

            tbody.innerHTML = projectNames.map(name => {
                const data = groupedData[name];
                const avgProgress = (data.totalProgress / data.count).toFixed(1);
                
                return `
                <tr class="hover:bg-slate-50 transition-all text-xs font-bold border-b border-slate-100 group">
                    <td class="px-6 py-5 uppercase text-slate-800">
                        <div class="font-black text-sm text-slate-900">${name}</div>
                        <div class="text-[10px] text-slate-400 normal-case mt-1 font-medium group-hover:text-orange-500 transition-colors">
                            Klik tombol Review untuk detail
                        </div>
                    </td>
                    <td class="px-4 py-5 text-center text-slate-500 font-black">
                        <span class="bg-slate-100 px-3 py-1 rounded-full text-slate-600 border border-slate-200">${data.count} Tasks</span>
                    </td>
                    <td class="px-4 py-5 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <span class="text-blue-600 font-black w-8 text-right">${avgProgress}%</span>
                            <div class="w-24 h-2 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                                <div class="h-full ${getProgressColor(avgProgress)}" style="width: ${avgProgress}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-5 text-center">
                        <button onclick="openGroupDetail('${name.replace(/'/g, "\\'")}')" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase shadow-md hover:shadow-lg transition-all active:scale-95 flex items-center gap-2 mx-auto">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                             Review
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        // --- FUNGSI MEMUNCULKAN SEMUA PROJECT DALAM 1 MODAL ---
        function openGroupDetail(projName) {
            document.getElementById('det-project-name').innerText = projName;
            const tasks = groupedData[projName].tasks;
            const container = document.getElementById('grouped-tasks-container');
            
            container.innerHTML = tasks.map(t => {
                // Ambil subtask untuk parent task ini
                const subtasks = allSubtasks.filter(s => s.parent_task_id == t.id);
                
                // Warna Border Kiri Kartu
                let borderColor = 'bg-slate-300';
                if(t.priority === 'High') borderColor = 'bg-rose-500';
                else if(t.priority === 'Mid') borderColor = 'bg-blue-500';
                else if(t.priority === 'Low') borderColor = 'bg-emerald-500';

                // Tampilan Subtask
                let subtasksHtml = '';
                if (subtasks.length > 0) {
                    subtasksHtml = `
                    <div class="mt-4 pt-3 border-t border-slate-100 bg-slate-50/50 rounded-lg p-3">
                        <p class="text-[9px] font-black text-slate-400 uppercase mb-2 tracking-wider flex items-center gap-1">
                            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full"></span> Rincian Sub-Task
                        </p>
                        <div class="space-y-2">
                        ${subtasks.map(s => `
                            <div class="flex items-start gap-3 text-xs text-slate-600 bg-white p-2.5 rounded border border-slate-200 shadow-sm">
                                <div class="mt-1.5 w-2 h-2 rounded-full flex-shrink-0 ${s.status === 'Done' ? 'bg-emerald-500' : 'bg-orange-400'}"></div>
                                <div class="flex-grow">
                                    <span class="font-bold ${s.status === 'Done' ? 'line-through text-slate-400' : 'text-slate-700'}">${s.subtask_desc}</span>
                                    ${s.worker_notes ? `<div class="text-[10px] text-slate-400 italic mt-0.5">"${s.worker_notes}"</div>` : ''}
                                    <div class="text-[9px] text-slate-300 mt-1">${formatDateTimeClean(s.start_date)}</div>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    <span class="text-[8px] font-black uppercase px-2 py-0.5 rounded ${s.status === 'Done' ? 'bg-emerald-100 text-emerald-600' : 'bg-orange-100 text-orange-600'}">${s.status}</span>
                                    <div class="text-[9px] font-bold text-slate-400 mt-1">${s.progress_percent}%</div>
                                </div>
                            </div>
                        `).join('')}
                        </div>
                    </div>`;
                } else {
                    subtasksHtml = `<div class="mt-4 pt-2 border-t border-dashed border-slate-200 text-[10px] text-slate-400 italic pl-2">Tidak ada subtask rincian.</div>`;
                }

                // Render Kartu Detail
                return `
                <div class="task-card group">
                    <div class="left-border ${borderColor}"></div>
                    
                    <div class="flex justify-between items-start mb-3 pl-2">
                        <div class="flex flex-col">
                            <span class="bg-blue-50 text-blue-700 text-[9px] font-black px-3 py-1 rounded-md uppercase tracking-wide border border-blue-100 shadow-sm w-fit mb-2 flex items-center gap-1">
                                👤 ${t.assigned_to}
                            </span>
                            <h3 class="text-sm font-bold text-slate-800 uppercase leading-snug">${t.task_desc || 'Tidak ada deskripsi'}</h3>
                        </div>
                        <div class="text-right flex-shrink-0 ml-4">
                             <span class="text-[9px] font-black px-2 py-1 rounded ${t.status === 'Done' ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-600 border-slate-200'} uppercase border">${t.status}</span>
                             <div class="text-sm font-black text-slate-800 mt-1">${t.progress_percent}%</div>
                        </div>
                    </div>

                    <div class="flex justify-between text-[10px] font-medium text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-100 mx-2">
                        <div><span class="text-slate-400 text-[9px] uppercase block mb-0.5">Start Date</span> <span class="font-bold text-slate-700">${formatDateTimeClean(t.start_date)}</span></div>
                        <div class="text-right"><span class="text-slate-400 text-[9px] uppercase block mb-0.5">Target Finish</span> <span class="font-bold text-slate-700">${formatDateTimeClean(t.due_date)}</span></div>
                    </div>

                    ${t.worker_comment && t.worker_comment !== '-' ? `<div class="mt-3 mx-2 text-[11px] text-indigo-600 italic bg-indigo-50 p-2.5 rounded border border-indigo-100 flex gap-2"><span class="not-italic">💬</span> "${t.worker_comment}"</div>` : ''}
                    ${t.hold_reason ? `<div class="mt-2 mx-2 text-[11px] text-rose-600 font-bold bg-rose-50 p-2.5 rounded border border-rose-100 flex gap-2"><span class="not-italic">⚠️</span> HOLD: ${t.hold_reason}</div>` : ''}

                    ${subtasksHtml}
                </div>`;
            }).join('');

            document.getElementById('detailModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
        
        // --- EXPORT EXCEL (TETAP SEMUA DATA / UNGROUPED) ---
        function exportToExcel() {
            if (rawData.length === 0) return alert("Tidak ada data untuk di-export!");
            
            const exportData = rawData.map((r, index) => ({
                'NO': index + 1,
                'Project Name': (r.project_name || "").toUpperCase(),
                'Task Description': r.task_desc || "-",
                'Assigned To': r.assigned_to || "-",
                'Priority': r.priority || "Mid",
                'Status': r.status || "Pending",
                'Start Date': r.start_date || "-",
                'Due Date': r.due_date || "-",
                'Actual Finish': r.actual_finish || "-",
                'Progress (%)': r.progress_percent || 0,
                'Worker Comment': r.worker_comment || "-",
                'Hold Reason': r.hold_reason || "-"
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const colWidths = Object.keys(exportData[0]).map(key => ({ wch: 20 }));
            ws['!cols'] = colWidths;
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "AllTasksDetail");
            XLSX.writeFile(wb, "Resume_Daily_Report_All_Tasks.xlsx");
        }

        // --- DASHBOARD CHART ---
        function switchChart(type) {
            document.querySelectorAll('.btn-toggle').forEach(btn => btn.classList.remove('btn-active'));
            const activeBtn = document.getElementById('btn-' + type);
            if (activeBtn) activeBtn.classList.add('btn-active');
            
            const ctx = document.getElementById('projectChart').getContext('2d');
            if (projectChart) projectChart.destroy();
            const personnel = ["RYAN", "ISYQI", "JUMAWAN", "EKO", "TATA", "BAROK"];
            const colors = ['#3b82f6', '#6366f1', '#f59e0b', '#10b981', '#f43f5e', '#475569'];
            let dataArr = personnel.map(n => {
                if(type === 'person') return rawData.filter(r => r.assigned_to === n).length;
                return rawData.filter(r => r.assigned_to === n && r.status === type).length;
            });
            projectChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: personnel, datasets: [{ data: dataArr, backgroundColor: colors, borderRadius: 8 }] },
                plugins: [ChartDataLabels],
                options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 30 } }, plugins: { legend: {display: false}, datalabels: { anchor: 'end', align: 'top', color: '#1e293b', font: {weight: 'bold', size: 12}, formatter: (v) => v > 0 ? v : '' } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, callback: (v) => (v % 1 === 0 ? v : null) } } } }
            });
        }

        function updatePersonnelGrid() {
            const personnel = ["RYAN", "ISYQI", "JUMAWAN", "EKO", "TATA", "BAROK"];
            let total = 0;
            const container = document.getElementById('personnel-stats');
            container.innerHTML = personnel.map(name => {
                const c = rawData.filter(r => r.assigned_to === name).length; total += c;
                return `<div class="person-card card-${name.toLowerCase()}"> <p class="text-[9px] font-black opacity-70">${name}</p> <h4 class="text-xl font-black">${c}</h4> </div>`;
            }).join('');
            document.getElementById('grand-total-tasks').innerText = total;
        }

        window.onclick = function(e) { if(e.target.className === 'modal') { closeModal(); } };
        window.onload = fetchAllData;
    </script>
