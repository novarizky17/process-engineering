<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Daily Report - Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .gradient-orange { background: linear-gradient(135deg, #ea580c 0%, #fb923c 100%); }
        .person-card { transition: all 0.3s ease; cursor: pointer; }
        .person-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Modal Style */
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 5% auto; padding: 24px; border-radius: 20px; width: 90%; max-width: 500px; animation: slideIn 0.3s; }
        @keyframes slideIn { from {transform: translateY(-20px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="gradient-orange w-full pt-12 pb-24 px-8 mb-[-80px] shadow-2xl">
        <div class="max-w-[98%] mx-auto flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight uppercase">Resume Daily Report</h1>
                <p class="text-orange-100 text-sm mt-1 font-medium tracking-wide">Monitoring Performa & Detail Laporan Personil</p>
            </div>
            <a href="management_tracker.html" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase border border-white/20 transition-all">Kembali</a>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto px-4">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 relative z-10">
            <div class="lg:col-span-2 bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest">Visualisasi Beban Kerja</h3>
                </div>
                <div class="h-[250px]">
                    <canvas id="projectChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100">
                <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest mb-4 text-center">Total Task Per Personil</h3>
                <div id="personnel-stats" class="grid grid-cols-2 gap-3"></div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <select id="filter-user" onchange="applyFilters()" class="bg-slate-50 border border-slate-200 px-4 py-3 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="">-- Pilih Personil (Semua) --</option>
                    <option value="RYAN">RYAN</option><option value="ISQI">ISQI</option>
                    <option value="JUMAWAN">JUMAWAN</option><option value="EKO">EKO</option>
                    <option value="TATA">TATA</option><option value="BAROK">BAROK</option>
                </select>
                <input type="text" id="search-report" oninput="applyFilters()" placeholder="Cari Nama Project..." class="bg-slate-50 border border-slate-200 px-4 py-3 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-orange-500">
            </div>
        </div>

        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-black tracking-widest border-b border-slate-100">
                            <th class="px-6 py-5">Project</th>
                            <th class="px-4 py-5 text-center">PIC</th>
                            <th class="px-4 py-5 text-center">Start Time</th>
                            <th class="px-4 py-5 text-center">Finish Time</th>
                            <th class="px-4 py-5 text-center">Status</th>
                            <th class="px-6 py-5 text-center">Detail</th>
                        </tr>
                    </thead>
                    <tbody id="resume-body" class="divide-y divide-slate-50 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content shadow-2xl">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-xl font-black text-slate-800 uppercase">Detail Laporan</h2>
                <button onclick="closeModal()" class="text-slate-400 text-2xl">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Aktivitas Pekerjaan</label>
                    <div id="view-activity" class="bg-blue-50 text-blue-900 p-4 rounded-xl text-sm italic border border-blue-100 min-h-[80px]"></div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Keterangan Kendala</label>
                    <div id="view-hold" class="bg-rose-50 text-rose-900 p-4 rounded-xl text-sm font-bold border border-rose-100 min-h-[60px]"></div>
                </div>
            </div>
            <button onclick="closeModal()" class="w-full mt-6 bg-slate-800 text-white py-3 rounded-xl font-bold uppercase text-xs">Tutup</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);
        
        let rawData = [];
        let projectChart = null;

        function formatTime(str) {
            if(!str) return '<span class="text-slate-300">--:--</span>';
            const d = new Date(str);
            return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short'}) + " " + d.getHours().toString().padStart(2,'0') + "." + d.getMinutes().toString().padStart(2,'0');
        }

        async function fetchAllData() {
            const { data, error } = await _sb.from('management_tracker').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            rawData = data;
            updatePersonnelGrid();
            renderChart();
            applyFilters();
        }

        function updatePersonnelGrid() {
            const personnel = ["RYAN", "ISQI", "JUMAWAN", "EKO", "TATA", "BAROK"];
            const container = document.getElementById('personnel-stats');
            container.innerHTML = personnel.map(name => {
                const count = rawData.filter(r => r.assigned_to === name).length;
                return `<div onclick="selectPerson('${name}')" class="person-card bg-slate-50 p-4 rounded-2xl border border-slate-100 text-center uppercase">
                    <p class="text-[9px] font-black text-slate-400">${name}</p>
                    <h4 class="text-xl font-black text-slate-800">${count}</h4>
                </div>`;
            }).join('');
        }

        function renderChart() {
            const personnel = ["RYAN", "ISQI", "JUMAWAN", "EKO", "TATA", "BAROK"];
            const counts = personnel.map(name => rawData.filter(r => r.assigned_to === name).length);
            const ctx = document.getElementById('projectChart').getContext('2d');
            if (projectChart) projectChart.destroy();
            projectChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: personnel,
                    datasets: [{
                        data: counts,
                        backgroundColor: ['#3b82f6', '#6366f1', '#f59e0b', '#10b981', '#f43f5e', '#475569'],
                        borderRadius: 8
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function applyFilters() {
            const user = document.getElementById('filter-user').value;
            const search = document.getElementById('search-report').value.toLowerCase();
            const filtered = rawData.filter(item => {
                const matchUser = user === "" || item.assigned_to === user;
                const matchSearch = item.project_name.toLowerCase().includes(search);
                return matchUser && matchSearch;
            });
            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('resume-body');
            tbody.innerHTML = data.map(row => {
                let sClass = row.status === 'Done' ? "bg-emerald-50 text-emerald-600" : (row.status === 'Hold' ? "bg-rose-50 text-rose-600" : "bg-blue-50 text-blue-600");
                return `<tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-6 font-bold uppercase">${row.project_name}</td>
                    <td class="px-4 py-6 text-center font-black text-slate-500">${row.assigned_to}</td>
                    <td class="px-4 py-6 text-center font-mono text-[10px]">${formatTime(row.work_start_time)}</td>
                    <td class="px-4 py-6 text-center font-mono text-[10px]">${formatTime(row.work_end_time)}</td>
                    <td class="px-4 py-6 text-center"><span class="px-3 py-1 rounded-full text-[9px] font-black border ${sClass}">${row.status}</span></td>
                    <td class="px-6 py-6 text-center">
                        <button onclick='openDetail("${row.worker_comment || 'Tidak ada laporan'}", "${row.hold_reason || '-'}")' class="bg-orange-500 text-white px-4 py-1.5 rounded-lg text-[10px] font-bold uppercase hover:bg-orange-600">Review</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function openDetail(act, hold) {
            document.getElementById('view-activity').innerText = act;
            document.getElementById('view-hold').innerText = hold;
            document.getElementById('detailModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
        function selectPerson(name) { document.getElementById('filter-user').value = name; applyFilters(); }

        window.onload = fetchAllData;
    </script>
</body>
</html>
