<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Bebas Edit - Center Print</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        /* --- PENGATURAN KHUSUS PRINT (AGAR TENGAH & TIDAK TERPOTONG) --- */
        @page {
            size: A4 portrait;
            margin: 15mm; /* Memberikan margin fisik pada kertas */
        }

        @media print {
            body {
                background: white !important;
                margin: 0;
                padding: 0;
                display: block;
            }
            .container {
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 auto !important; /* Memastikan posisi di tengah */
                padding: 0 !important;
                border: none !important;
            }
            .no-print { display: none !important; }
            
            /* Mengatur tabel agar memenuhi lebar kertas secara proporsional */
            table {
                width: 100% !important;
                border-spacing: 0 8px !important;
            }
            
            .name-tag {
                border: 1px solid #e2e8f0 !important;
                background-color: #f8fafc !important;
                width: 95% !important;
                print-color-adjust: exact; /* Memastikan warna muncul saat print */
                -webkit-print-color-adjust: exact;
            }
        }

        /* --- TAMPILAN LAYAR (BROWSER) --- */
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; padding: 40px 20px; color: #2d3748; }
        
        .container { 
            max-width: 700px; /* Disesuaikan agar proporsional di layar */
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); 
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; color: #1a365d; text-transform: uppercase; font-size: 1.8em; font-weight: 800; letter-spacing: 1px; }
        .header p { color: #718096; font-size: 0.9em; margin-top: 5px; font-weight: 500; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 12px; margin-top: 10px; table-layout: fixed; }
        th { color: #a0aec0; text-transform: uppercase; font-size: 0.75em; padding: 10px; text-align: left; font-weight: 800; }
        td { padding: 5px 10px; vertical-align: middle; }

        .name-tag {
            font-weight: 700;
            display: block;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.95em;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            min-height: 45px;
        }
        
        /* Variasi Warna Berdasarkan ID */
        .tag-m1 { background-color: #ebf8ff; color: #2b6cb0; border-color: #bee3f8; }
        .tag-m2 { background-color: #f0fff4; color: #2f855a; border-color: #c6f6d5; }
        .tag-m3 { background-color: #fffaf0; color: #c05621; border-color: #feebc8; }
        .tag-m4 { background-color: #faf5ff; color: #6b46c1; border-color: #e9d8fd; }
        .tag-m5 { background-color: #f7fafc; color: #4a5568; border-color: #e2e8f0; }

        .name-tag:focus { background: #fff !important; border-color: #3f51b5 !important; color: #1a365d !important; }

        .btn-group { display: flex; justify-content: center; gap: 12px; margin-top: 30px; }
        .btn { text-decoration: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; font-size: 0.9em; transition: 0.3s; }
        .btn-back { background: #edf2f7; color: #4a5568; }
        .btn-print { background: #1a365d; color: white; }

        .status-online { 
            font-size: 0.7em; font-weight: 800; text-transform: uppercase;
            background: #c6f6d5; color: #22543d; padding: 6px 14px; 
            border-radius: 50px; display: inline-block; margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Maintenance Schedule</h1>
        <p>Tooling Support Monitoring System</p>
    </div>

    <div class="no-print" style="text-align: center;">
        <span id="save-status" class="status-online">Cloud Connected</span>
    </div>

    <table>
        <thead>
            <tr>
                <th width="35%">Periode Waktu</th>
                <th width="65%">Personil Pelaksana</th>
            </tr>
        </thead>
        <tbody id="jadwal-body">
            </tbody>
    </table>

    <div class="btn-group no-print">
        <a href="center.html" class="btn btn-back">← Kembali</a>
        <button onclick="window.print()" class="btn btn-print">Print to PDF</button>
    </div>
</div>

<script>
    const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    async function loadJadwal() {
        const { data, error } = await _sb.from('jadwal_mingguan').select('*').order('id', { ascending: true });
        if (error) return;

        document.getElementById('jadwal-body').innerHTML = data.map(item => `
            <tr>
                <td><strong style="color:#1a365d; font-size: 0.95em;">${item.minggu}</strong></td>
                <td>
                    <div class="name-tag tag-${item.id}" 
                         contenteditable="true" 
                         onblur="updateDatabase('${item.id}', this.innerText)"
                         onkeydown="if(event.key==='Enter'){event.preventDefault(); this.blur();}">
                        ${item.nama_personil || ''}
                    </div>
                </td>
            </tr>
        `).join('');
    }

    async function updateDatabase(id, val) {
        const label = document.getElementById('save-status');
        label.innerText = "Syncing...";
        const { error } = await _sb.from('jadwal_mingguan').update({ nama_personil: val }).eq('id', id);
        label.innerText = error ? "Save Failed" : "Cloud Synced";
        label.style.background = error ? "#fed7d7" : "#c6f6d5";
    }

    window.onload = loadJadwal;
</script>

</body>
</html>
