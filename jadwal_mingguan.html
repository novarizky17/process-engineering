<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Mingguan - Pengecekan Tooling</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        /* PENGATURAN KHUSUS PRINT */
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        @media print {
            body {
                background: white !important;
                padding: 0;
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }
            .no-print { display: none !important; }
            .container {
                box-shadow: none !important;
                border: 1pt solid #ccc !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 20px !important;
                transform: scale(0.98); /* Mencegah terpotong sedikit di pinggir */
            }
            .header h1::after { display: none !important; }
            td, .name-tag { border: 0.5pt solid #cbd5e1 !important; }
        }

        /* TAMPILAN LAYAR */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 40px 20px;
            color: #2d3748;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            margin: 0;
            color: #1a365d;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8em;
            font-weight: 700;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: 0; left: 25%; width: 50%; height: 4px;
            background: #3f51b5; border-radius: 2px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-bottom: 20px;
        }

        th {
            color: #4a5568;
            text-transform: uppercase;
            font-size: 0.85em;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #edf2f7;
        }

        td {
            padding: 12px 16px;
            background-color: #ffffff;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }

        /* Warna Personil Tetap Bagus */
        .name-tag {
            font-weight: 600;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.9em;
            min-width: 130px;
            text-align: center;
        }

        .tag-isyqi { background-color: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
        .tag-ryan { background-color: #f0fff4; color: #2f855a; border: 1px solid #c6f6d5; }
        .tag-jumawan { background-color: #fffaf0; color: #c05621; border: 1px solid #feebc8; }
        .tag-barok { background-color: #faf5ff; color: #6b46c1; border: 1px solid #e9d8fd; }
        .tag-team { background-color: #f7fafc; color: #4a5568; border: 1px solid #e2e8f0; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-back { background: #edf2f7; color: #4a5568; }
        .btn-print { background: #3f51b5; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Maintenance Schedule</h1>
        <p>Tooling Support Monitoring System</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Periode Waktu</th>
                <th style="text-align: right;">Personil Pelaksana</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><strong style="color:#2d3748">MINGGU I</strong></td>
                <td style="text-align: right;"><span class="name-tag tag-isyqi">ISYQI</span></td>
            </tr>
            <tr>
                <td><strong style="color:#2d3748">MINGGU II</strong></td>
                <td style="text-align: right;"><span class="name-tag tag-ryan">RYAN</span></td>
            </tr>
            <tr>
                <td><strong style="color:#2d3748">MINGGU III</strong></td>
                <td style="text-align: right;"><span class="name-tag tag-jumawan">JUMAWAN</span></td>
            </tr>
            <tr>
                <td><strong style="color:#2d3748">MINGGU IV</strong></td>
                <td style="text-align: right;"><span class="name-tag tag-barok">BAROK</span></td>
            </tr>
            <tr>
                <td><strong style="color:#2d3748">MINGGU V*</strong></td>
                <td style="text-align: right;"><span class="name-tag tag-team">TEAM SUPPORT</span></td>
            </tr>
        </tbody>
    </table>

    <p style="font-size: 0.8em; color: #a0aec0; font-style: italic; text-align: center; margin-top: 20px;">
        *Minggu V disesuaikan dengan kalender berjalan.
    </p>

    <div class="btn-group no-print">
        <a href="center.html" class="btn btn-back">← Kembali</a>
        <button onclick="window.print()" class="btn btn-print">Print Jadwal</button>
    </div>
</div>

</body>
</html>
