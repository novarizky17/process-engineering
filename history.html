<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISTORY CHECKLIST (MONTHLY) - TOOLING SUPPORT</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* PENGATURAN CETAK SATU HALAMAN */
        @page { 
            size: A4 landscape; 
            margin: 5mm; 
        }
        @media print {
            body { padding: 0; margin: 0; background: white; -webkit-print-color-adjust: exact; }
            .no-print { display: none !important; }
            
            /* Skala otomatis konten agar muat 1 halaman */
            .document-page { 
                box-shadow: none; 
                border: 1px solid black; 
                width: 100% !important; 
                max-width: none; 
                margin: 0; 
                padding: 5px;
                transform: scale(0.82); 
                transform-origin: top center;
            }
            /* Optimalisasi Font dan Ruang agar Padat */
            .table-official th, .table-official td { font-size: 6.8pt !important; padding: 1px !important; line-height: 1.1; }
            .section-header { height: 18px !important; font-size: 7.5pt !important; }
            .row-title-footer, .sig-td { height: 45px !important; }
            .sig-td img { max-height: 40px !important; }
            .sig-frame { height: 50px !important; width: 120px !important; }
            .sig-frame img { max-height: 45px !important; }
            .header-box { margin-bottom: 5px; }
            .logo-area img { width: 80px !important; }
            .title-area { font-size: 12pt !important; }
        }

        body { font-family: Arial, sans-serif; background-color: #f1f5f9; padding: 20px; color: #000; }
        .document-page { background: white; width: 1180px; margin: 0 auto; padding: 15px; border: 1.5px solid #000; box-sizing: border-box; }
        
        /* HEADER */
        .header-box { border: 2px solid black; margin-bottom: 8px; display: table; width: 100%; border-collapse: collapse; }
        .header-cell { display: table-cell; border-right: 2px solid black; vertical-align: middle; }
        .header-cell:last-child { border-right: none; }
        .logo-area { width: 130px; padding: 5px; text-align: center; }
        .logo-area img { width: 100px; height: auto; display: block; margin: 0 auto; }
        .title-area { text-align: center; font-size: 14pt; font-weight: bold; padding: 5px; text-transform: uppercase; color: #000; }
        
        .meta-area { width: 280px; font-size: 8pt; padding: 5px; text-transform: uppercase; font-weight: bold; }
        .meta-table { width: 100%; border-collapse: collapse; }
        .meta-table td { padding: 1px 5px; border: none !important; height: 18px; }

        .meta-info { display: flex; justify-content: space-between; margin: 5px 0; font-weight: bold; font-size: 9pt; text-transform: uppercase; }
        .info-label { width: 100px; display: inline-block; }
        .info-value { border-bottom: 1.5px solid black; min-width: 180px; display: inline-block; padding: 0 5px; }
        
        /* TABLE STYLING */
        .table-official { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1.8px solid black; text-transform: uppercase; }
        .table-official th, .table-official td { border: 1.2px solid black; padding: 3px; font-size: 7.2pt; text-align: center; vertical-align: middle; }
        .table-official th { background-color: #f0f0f0; font-weight: bold; }

        .section-header { background-color: #dcdcdc !important; text-align: left !important; padding-left: 8px !important; font-weight: bold; height: 22px; }
        
        /* FOOTER PARAF */
        .row-title-footer { background-color: #f2f2f2; font-weight: bold; height: 50px; }
        .sig-td { height: 50px; background-color: #fff; vertical-align: middle; text-align: center; }
        .sig-td img { max-height: 45px; width: auto; filter: grayscale(1) contrast(1.5); margin: 0 auto; }

        .footer-flex { display: flex; justify-content: space-between; margin-top: 8px; text-transform: uppercase; align-items: flex-start; }
        .diketahui-box { width: 200px; text-align: center; margin-left: auto; }
        .sig-frame { border: 1.5px solid black; width: 130px; height: 60px; margin: 2px auto; display: flex; align-items: center; justify-content: center; }
        .sig-frame img { max-height: 55px; width: auto; filter: grayscale(1) contrast(1.5); }
        .name-line { border-top: 1.5px solid black; width: 180px; margin: 0 auto; font-weight: bold; font-size: 8.5pt; }

        .no-print { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; padding: 12px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="no-print">
        <input type="text" id="input-merk" placeholder="NAMA TOOLS" class="border p-2 rounded uppercase text-sm w-48 font-bold">
        <select id="filter-bulan" class="border p-2 rounded text-sm font-bold">
            <option value="">PILIH BULAN</option>
            <option value="01">JANUARI</option><option value="02">FEBRUARI</option><option value="03">MARET</option>
            <option value="04">APRIL</option><option value="05">MEI</option><option value="06">JUNI</option>
            <option value="07">JULI</option><option value="08">AGUSTUS</option><option value="09">SEPTEMBER</option>
            <option value="10">OKTOBER</option><option value="11">NOVEMBER</option><option value="12">DESEMBER</option>
        </select>
        <button onclick="renderReport(true)" class="bg-blue-800 text-white px-6 py-2 rounded font-black uppercase text-xs">Cari Data</button>
        <button onclick="window.print()" class="bg-black text-white px-6 py-2 rounded font-black uppercase text-xs">Simpan ke PDF</button>
        <button onclick="window.location.href='management_tracker.html'" class="bg-gray-600 text-white px-6 py-2 rounded font-black uppercase text-xs">Kembali</button>
    </div>

    <div class="document-page">
        <div class="header-box">
            <div class="header-cell logo-area"><img src="https://amarilyskg.co.id/bootstrap/img/logo.png"></div>
            <div class="header-cell title-area">CHECKLIST MONITORING TOOLING SUPPORT</div>
            <div class="header-cell meta-area">
                <table class="meta-table">
                    <tr><td style="width: 80px;">NO DOK</td><td>: AKG-TS-01</td></tr>
                    <tr><td>TERBIT</td><td>: 07/01/2026</td></tr>
                    <tr><td>HAL</td><td>: 1/1</td></tr>
                </table>
            </div>
        </div>

        <div class="meta-info">
            <div><span class="info-label">EQUIPMENT</span> : <span class="info-value" id="label-merk">-</span></div>
            <div><span class="info-label">BULAN</span> : <span class="info-value" id="label-bulan">-</span></div>
            <div><span class="info-label">TAHUN</span> : <span class="info-value" id="label-tahun">2026</span></div>
        </div>

        <table class="table-official">
            <thead>
                <tr>
                    <th style="width: 25px;" rowspan="2">NO</th>
                    <th style="width: 170px;" rowspan="2">JENIS PENGECEKAN</th>
                    <th colspan="2">WEEK 1</th><th colspan="2">WEEK 2</th><th colspan="2">WEEK 3</th><th colspan="2">WEEK 4</th><th colspan="2">WEEK 5</th>
                </tr>
                <tr>
                    <th style="width: 35px;">OK/NG</th><th style="width: 65px;">KET</th>
                    <th style="width: 35px;">OK/NG</th><th style="width: 65px;">KET</th>
                    <th style="width: 35px;">OK/NG</th><th style="width: 65px;">KET</th>
                    <th style="width: 35px;">OK/NG</th><th style="width: 65px;">KET</th>
                    <th style="width: 35px;">OK/NG</th><th style="width: 65px;">KET</th>
                </tr>
            </thead>
            <tbody id="table-content"></tbody>
            <tfoot>
                <tr>
                    <td colspan="2" class="row-title-footer">PARAF PELAKSANA</td>
                    <td colspan="2" class="sig-td" id="sig-w1"></td><td colspan="2" class="sig-td" id="sig-w2"></td>
                    <td colspan="2" class="sig-td" id="sig-w3"></td><td colspan="2" class="sig-td" id="sig-w4"></td>
                    <td colspan="2" class="sig-td" id="sig-w5"></td>
                </tr>
            </tfoot>
        </table>

        <div class="footer-flex">
            <div class="diketahui-box">
                <p style="font-weight: bold; font-size: 8pt; margin-bottom: 2px;">DIKETAHUI</p>
                <div class="sig-frame" id="super-sig"></div>
                <div id="super-name" class="name-line">( ........................ )</div>
                <p style="font-size: 7.5pt; font-weight: bold; margin-top: 2px;">SUPERINTENDENT</p>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        const checklistStructure = [
            { header: "1. STAND LABEL", type: 'head' },
            { name: "WIRING", field: "wiring" }, { name: "KOMPONEN", field: "komponen" }, { name: "KERAPIHAN", field: "kerapihan" },
            { name: "SENSOR", field: "sensor" }, { name: "TIMING BELT", field: "timing_belt" }, { name: "PULLY", field: "pully" },
            { name: "SERVO MOTOR", field: "servo_motor" }, { name: "LINEAR BEARING", field: "linear_bearing" }, { name: "ROTARY ACTUATOR", field: "rotary_actuator" },
            { name: "SELENOID VALVE", field: "selenoid_valve" }, { name: "VACUUM EJECTOR", field: "vacuum_ejector" }, { name: "SILINDER PNEUMATIC", field: "silinder_pneumatic" },
            { name: "NAPPLE", field: "napple" }, { name: "VACUUM PAD", field: "vacuum_pad" }, { name: "FLANGE", field: "flange" }, { name: "VACUUM PAD TAKEOUT", field: "vacuum_pad_takeout" },
            { header: "2. STACKING", type: 'head' },
            { name: "WIRING", field: "stacking_wiring" }, { name: "SENSOR", field: "stacking_sensor" }, { name: "LINIER", field: "stacking_linier" },
            { name: "MECHANICAL PART", field: "stacking_mechanical_part" }, { name: "CYLINDER", field: "stacking_cylinder" }, { name: "PNEUMATIC", field: "stacking_pneumatic" },
            { header: "3. CONVEYOR", type: 'head' },
            { name: "BELT", field: "conveyor_belt" }, { name: "MOTOR", field: "conveyor_motor" }, { name: "RANTAI", field: "conveyor_rantai" },
            { name: "FRAME", field: "conveyor_frame" }, { name: "INVERTER", field: "conveyor_inverter" },
            { header: "4. DOSING", type: 'head' },
            { name: "ALARM", field: "dosing_alarm" }, { name: "SETTING", field: "dosing_setting" },
            { header: "5. DUMMY", type: 'head' },
            { name: "VACUUM", field: "dummy_vacuum" }, { name: "KONDISI", field: "dummy_condition" }, { name: "FLANGE", field: "dummy_flange" },
            { name: "INSTALASI", field: "dummy_instalasi" }, { name: "TUBBING", field: "dummy_tubbing" }
        ];

        async function renderReport(isSearching) {
            const bln = document.getElementById('filter-bulan').value;
            const tools = document.getElementById('input-merk').value.trim();
            if (!bln || !tools) return alert("Mohon isi Nama Alat dan Pilih Bulan!");

            document.getElementById('label-merk').innerText = tools.toUpperCase();
            document.getElementById('label-bulan').innerText = document.getElementById('filter-bulan').options[document.getElementById('filter-bulan').selectedIndex].text;

            const { data, error } = await _sb.from('checklist').select('*, pelaksana(*)').eq('status', 'Approved');
            if (error) return;

            const filtered = data.filter(item => {
                const dateFilter = `2026-${bln}`;
                return item.pelaksana?.nama_tools?.toLowerCase().includes(tools.toLowerCase()) && item.pelaksana?.tanggal_checklist?.startsWith(dateFilter);
            });

            const dataMap = {};
            filtered.forEach(item => { if(item.pelaksana?.week <= 5) dataMap[item.pelaksana.week] = item; });

            const tbody = document.getElementById('table-content');
            tbody.innerHTML = "";
            let alphabetCounter = 1;

            checklistStructure.forEach(item => {
                if (item.type === 'head') {
                    alphabetCounter = 1;
                    tbody.innerHTML += `<tr><td colspan="2" class="section-header">${item.header}</td><td colspan="10"></td></tr>`;
                } else {
                    let char = String.fromCharCode(64 + alphabetCounter++).toUpperCase();
                    let rHtml = `<tr><td class="font-bold">${char}</td><td style="text-align:left; padding-left:3px;">${item.name}</td>`;
                    for(let w=1; w<=5; w++) {
                        let status = dataMap[w] ? dataMap[w][item.field] : "";
                        let ket = (status === 'NG' && dataMap[w]) ? (dataMap[w][item.field + "_keterangan"] || "") : "";
                        rHtml += `<td class="font-bold ${status === 'NG' ? 'text-red-600' : ''}">${status || ""}</td>`;
                        rHtml += `<td style="font-size:6pt; color:red; line-height:1; font-weight:bold;">${ket}</td>`;
                    }
                    tbody.innerHTML += rHtml + `</tr>`;
                }
            });

            for(let w=1; w<=5; w++) {
                const cell = document.getElementById(`sig-w${w}`);
                cell.innerHTML = (dataMap[w] && dataMap[w].signature_pelaksana) ? `<img src="${dataMap[w].signature_pelaksana}">` : "";
            }

            const superSig = document.getElementById('super-sig');
            const hasFinalWeeks = (dataMap[4] || dataMap[5]);
            if (hasFinalWeeks) {
                const latest = dataMap[5] || dataMap[4];
                superSig.innerHTML = latest.signature ? `<img src="${latest.signature}">` : "";
                document.getElementById('super-name').innerText = `( ${latest.nama_superintendent || 'SUPERINTENDENT'} )`;
            } else {
                superSig.innerHTML = "";
                document.getElementById('super-name').innerText = "( ........................ )";
            }
        }
        window.onload = () => renderReport(false);
    </script>
</body>
</html>
