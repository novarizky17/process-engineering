<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISTORY CHECKLIST (MONTHLY) - TOOLING SUPPORT</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        @page { size: A4 landscape; margin: 8mm; }
        @media print {
            body { padding: 0; margin: 0; background: white; }
            .no-print { display: none !important; }
            .document-page { box-shadow: none; border: none; width: 100%; max-width: none; margin: 0; padding: 5px; }
            tr { page-break-inside: avoid; }
        }
        body { font-family: Arial, sans-serif; background-color: #f1f5f9; padding: 20px; color: #000; }
        .document-page { background: white; width: 1250px; margin: 0 auto; padding: 15px; border: 1.5px solid #000; box-sizing: border-box; }
        
        /* HEADER STYLE */
        .header-box { border: 2px solid black; margin-bottom: 10px; display: table; width: 100%; border-collapse: collapse; }
        .header-cell { display: table-cell; border-right: 2px solid black; vertical-align: middle; }
        .header-cell:last-child { border-right: none; }
        .logo-area { width: 150px; padding: 5px; text-align: center; }
        .logo-area img { width: 130px; height: auto; display: block; margin: 0 auto; }
        .title-area { text-align: center; font-size: 16pt; font-weight: bold; padding: 10px; text-transform: uppercase; color: #000; }
        
        .meta-area { width: 320px; font-size: 9pt; padding: 5px; text-transform: uppercase; color: #000; font-weight: bold; }
        .meta-table { width: 100%; border-collapse: collapse; }
        .meta-table td { padding: 2px 5px; vertical-align: middle; border: none !important; white-space: nowrap; height: 25px; }

        .meta-info { display: flex; justify-content: space-between; margin: 8px 0; font-weight: bold; font-size: 10pt; align-items: flex-end; text-transform: uppercase; color: #000; }
        .info-label { width: 110px; display: inline-block; }
        .info-value { border-bottom: 1.5px solid black; min-width: 200px; display: inline-block; padding: 0 5px; margin-left: 5px; }
        
        /* TABLE STYLING */
        .table-official { width: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid black; text-transform: uppercase; color: #000; }
        .table-official th, .table-official td { border: 1.5px solid black; padding: 2px; font-size: 7.5pt; text-align: center; vertical-align: middle; color: #000; }
        .table-official th { background-color: #e5e5e5; font-weight: bold; }

        .section-header { background-color: #dcdcdc !important; text-align: left !important; padding-left: 8px !important; font-weight: bold; height: 25px; }
        
        /* FOOTER PARAF STYLE */
        .row-title-footer { background-color: #f2f2f2; font-weight: bold; text-align: center !important; font-size: 8pt; height: 60px; }
        .sig-td { height: 60px; background-color: #fff; padding: 0 !important; vertical-align: middle !important; text-align: center !important; overflow: hidden; }
        .sig-td img { max-height: 55px; width: auto; filter: grayscale(1) contrast(2) brightness(0.5); margin: 0 auto; }

        .no-print { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; padding: 15px; background: #fff; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .footer-flex { display: flex; justify-content: space-between; margin-top: 15px; text-transform: uppercase; }
        .diketahui-box { width: 30%; text-align: center; margin-left: auto; }
        .sig-frame { border: 1.5px solid black; width: 160px; height: 80px; margin: 5px auto; display: flex; align-items: center; justify-content: center; background: #fff; }
        .sig-frame img { max-height: 75px; width: auto; filter: grayscale(1) contrast(3) brightness(0.4); }
        .name-line { border-top: 1.5px solid black; width: 220px; margin: 0 auto; padding-top: 3px; font-weight: bold; color: #000; text-align: center; }
    </style>
</head>
<body>

    <div class="no-print">
        <input type="text" id="input-merk" placeholder="NAMA TOOLS / EQUIPMENT" class="border p-2 rounded uppercase font-bold w-64">
        <input type="text" id="input-tonage" placeholder="CAPACITY" class="border p-2 rounded uppercase font-bold w-32">
        <select id="filter-bulan" class="border p-2 rounded font-bold">
            <option value="">PILIH BULAN</option>
            <option value="01">JANUARI</option><option value="02">FEBRUARI</option><option value="03">MARET</option>
            <option value="04">APRIL</option><option value="05">MEI</option><option value="06">JUNI</option>
            <option value="07">JULI</option><option value="08">AGUSTUS</option><option value="09">SEPTEMBER</option>
            <option value="10">OKTOBER</option><option value="11">NOVEMBER</option><option value="12">DESEMBER</option>
        </select>
        <select id="filter-tahun" class="border p-2 rounded font-bold">
            <script>
                const curY = new Date().getFullYear();
                for(let y=curY-1; y<=curY+5; y++) { 
                    let sel = y === 2026 ? "selected" : "";
                    document.write(`<option value="${y}" ${sel}>${y}</option>`); 
                }
            </script>
        </select>
        <button onclick="renderReport(true)" class="bg-blue-800 hover:bg-blue-900 text-white px-6 py-2 rounded font-black transition-all shadow-md uppercase text-xs">Tampilkan Laporan</button>
        <button onclick="downloadExcel()" class="bg-green-700 hover:bg-green-800 text-white px-6 py-2 rounded font-black transition-all shadow-md uppercase text-xs">Excel</button>
        <button onclick="window.print()" class="bg-black hover:bg-gray-800 text-white px-6 py-2 rounded font-black transition-all shadow-md uppercase text-xs">Cetak PDF</button>
        <button onclick="window.location.href='management_tracker.html'" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded font-black transition-all shadow-md uppercase text-xs">Kembali</button>
    </div>

    <div class="document-page">
        <div class="header-box">
            <div class="header-cell logo-area"><img src="https://amarilyskg.co.id/bootstrap/img/logo.png" alt="LOGO AKG"></div>
            <div class="header-cell title-area">CHECKLIST MONITORING TOOLING SUPPORT</div>
            <div class="header-cell meta-area">
                <table class="meta-table">
                    <tr><td style="width: 120px;">NO DOKUMEN</td><td>: </td></tr>
                    <tr><td>TANGGAL TERBIT</td><td>: </td></tr>
                    <tr><td>HALAMAN</td><td>: 1/1</td></tr>
                </table>
            </div>
        </div>

        <div class="meta-info">
            <div class="meta-info-left">
                <div class="info-row"><span class="info-label">EQUIPMENT</span> : <span class="info-value" id="label-merk">-</span></div>
                <div class="info-row"><span class="info-label">CAPACITY</span> : <span class="info-value" id="label-tonage">-</span></div>
            </div>
            <div class="meta-info-right">
                <div class="info-row"><span class="info-label">BULAN</span> : <span class="info-value" id="label-bulan">-</span></div>
                <div class="info-row"><span class="info-label">TAHUN</span> : <span class="info-value" id="label-tahun">-</span></div>
            </div>
        </div>

        <table class="table-official" id="table-to-export">
            <thead>
                <tr>
                    <th style="width: 35px;" rowspan="2">NO</th>
                    <th style="width: 200px;" rowspan="2">JENIS PENGECEKAN</th>
                    <th colspan="2">WEEK 1</th>
                    <th colspan="2">WEEK 2</th>
                    <th colspan="2">WEEK 3</th>
                    <th colspan="2">WEEK 4</th>
                    <th colspan="2">WEEK 5</th>
                </tr>
                <tr>
                    <th style="width: 50px;">OK/NG</th><th style="width: 90px;">KET</th>
                    <th style="width: 50px;">OK/NG</th><th style="width: 90px;">KET</th>
                    <th style="width: 50px;">OK/NG</th><th style="width: 90px;">KET</th>
                    <th style="width: 50px;">OK/NG</th><th style="width: 90px;">KET</th>
                    <th style="width: 50px;">OK/NG</th><th style="width: 90px;">KET</th>
                </tr>
            </thead>
            <tbody id="table-content"></tbody>
            <tfoot>
                <tr>
                    <td colspan="2" class="row-title-footer uppercase">Paraf Pelaksana</td>
                    <td colspan="2" class="sig-td" id="sig-w1"></td>
                    <td colspan="2" class="sig-td" id="sig-w2"></td>
                    <td colspan="2" class="sig-td" id="sig-w3"></td>
                    <td colspan="2" class="sig-td" id="sig-w4"></td>
                    <td colspan="2" class="sig-td" id="sig-w5"></td>
                </tr>
            </tfoot>
        </table>

        <div class="footer-flex">
            <div class="diketahui-box">
                <p style="font-weight: bold; margin-bottom: 5px;">DIKETAHUI</p>
                <div class="sig-frame" id="super-sig"></div>
                <div id="super-name" class="name-line">( ........................ )</div>
                <p style="font-size: 8pt; margin-top: 2px; font-weight: bold;">SUPERINTENDENT</p>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        // Struktur Checklist Terintegrasi
        const checklistStructure = [
            { header: "1. STAND LABEL", type: 'head' },
            { name: "WIRING", field: "wiring" }, { name: "KOMPONEN", field: "komponen" }, { name: "KERAPIHAN", field: "kerapihan" },
            { name: "SENSOR", field: "sensor" }, { name: "TIMING BELT", field: "timing_belt" }, { name: "PULLY", field: "pully" },
            { name: "SERVO MOTOR", field: "servo_motor" }, { name: "LINEAR BEARING", field: "linear_bearing" }, { name: "ROTARY ACTUATOR", field: "rotary_actuator" },
            { name: "SELENOID VALVE", field: "selenoid_valve" }, { name: "VACUUM EJECTOR", field: "vacuum_ejector" }, { name: "SILINDER PNEUMATIC", field: "silinder_pneumatic" },
            { name: "NAPPLE", field: "napple" }, { name: "VACUUM PAD", field: "vacuum_pad" }, { name: "FLANGE", field: "flange" }, { name: "VACUUM PAD TAKEOUT", field: "vacuum_pad_takeout" },
            { header: "2. STACKING", type: 'head' },
            { name: "WIRING", field: "stacking_wiring" }, { name: "SENSOR", field: "stacking_sensor" }, { name: "LINIER", field: "stacking_linier" },
            { name: "MECHANICAL PART", field: "stacking_mechanical_part" }, { name: "CYLINDER", field: "stacking_cylinder" }, { name: "PNEUMATIC", field: "stacking_pneumatic" },
            { header: "3. CONVEYOR", type: 'head' },
            { name: "BELT", field: "conveyor_belt" }, { name: "MOTOR", field: "conveyor_motor" }, { name: "RANTAI", field: "conveyor_rantai" },
            { name: "FRAME", field: "conveyor_frame" }, { name: "INVERTER", field: "conveyor_inverter" },
            { header: "4. DOSING", type: 'head' },
            { name: "ALARM", field: "dosing_alarm" }, { name: "SETTING", field: "dosing_setting" },
            { header: "5. DUMMY", type: 'head' },
            { name: "VACUUM", field: "dummy_vacuum" }, { name: "KONDISI", field: "dummy_condition" }, { name: "FLANGE", field: "dummy_flange" },
            { name: "INSTALASI", field: "dummy_instalasi" }, { name: "TUBBING", field: "dummy_tubbing" }
        ];

        function numToChar(num) { return String.fromCharCode(96 + num).toUpperCase(); }

        async function renderReport(isSearching) {
            const thn = document.getElementById('filter-tahun').value;
            const bln = document.getElementById('filter-bulan').value;
            const tools = document.getElementById('input-merk').value.trim();
            const capacity = document.getElementById('input-tonage').value.trim();

            if (!isSearching || !bln || !tools) {
                alert("Masukkan Nama Alat dan Pilih Bulan!");
                return;
            }

            // Update label visual
            document.getElementById('label-tahun').innerText = thn;
            document.getElementById('label-bulan').innerText = document.getElementById('filter-bulan').options[document.getElementById('filter-bulan').selectedIndex].text;
            document.getElementById('label-merk').innerText = tools.toUpperCase();
            document.getElementById('label-tonage').innerText = capacity.toUpperCase() || "-";

            // Ambil data hanya yang sudah di-Approve
            const { data, error } = await _sb.from('checklist').select('*, pelaksana(*)').eq('status', 'Approved');
            if (error) return console.error(error);

            const filteredData = data.filter(item => {
                const dateFilter = `${thn}-${bln}`;
                const mMatch = item.pelaksana?.nama_tools?.toLowerCase().includes(tools.toLowerCase());
                const tMatch = capacity ? item.pelaksana?.capacity?.toLowerCase().includes(capacity.toLowerCase()) : true;
                const dMatch = item.pelaksana?.tanggal_checklist?.startsWith(dateFilter);
                return mMatch && tMatch && dMatch;
            });

            // Mapping data per minggu (1-5)
            const dataMap = {};
            filteredData.forEach(item => {
                const w = item.pelaksana?.week;
                if(w >= 1 && w <= 5) dataMap[w] = item;
            });

            renderRows(dataMap);
            renderParaf(dataMap);
            renderSuper(dataMap);
        }

        function renderRows(dataMap) {
            const tbody = document.getElementById('table-content');
            tbody.innerHTML = "";
            let alphabetCounter = 1;

            checklistStructure.forEach(item => {
                if (item.type === 'head') {
                    alphabetCounter = 1;
                    tbody.innerHTML += `<tr><td colspan="2" class="section-header">${item.header}</td><td colspan="10"></td></tr>`;
                } else {
                    let char = numToChar(alphabetCounter++);
                    let rHtml = `<tr><td class="font-bold text-center">${char}</td><td style="text-align:left; padding-left:8px; font-weight:bold;">${item.name}</td>`;
                    for(let w=1; w<=5; w++) {
                        let statusText = "", ket = "", ngClass = "";
                        if(dataMap[w]) {
                            const status = dataMap[w][item.field];
                            statusText = status || "";
                            ngClass = status === 'NG' ? "text-red-600 font-bold" : "font-bold";
                            ket = (status === 'NG') ? (dataMap[w][item.field + "_keterangan"] || "") : "";
                        }
                        rHtml += `<td class="text-center font-bold ${ngClass}">${statusText}</td>`;
                        rHtml += `<td style="text-align:left; padding-left:3px; font-size:7.5pt; color:red; font-weight:bold;">${ket}</td>`;
                    }
                    tbody.innerHTML += rHtml + `</tr>`;
                }
            });
        }

        function renderParaf(dataMap) {
            for(let w=1; w<=5; w++) {
                const cell = document.getElementById(`sig-w${w}`);
                cell.innerHTML = (dataMap[w] && dataMap[w].signature_pelaksana) ? `<img src="${dataMap[w].signature_pelaksana}">` : "";
            }
        }

        function renderSuper(dataMap) {
            const sigFrame = document.getElementById('super-sig');
            const nameLabel = document.getElementById('super-name');
            // TTD Superintendent hanya muncul jika Week 4 atau 5 sudah terisi
            const hasFinalWeeks = (dataMap[4] || dataMap[5]);

            if (hasFinalWeeks) {
                const latestData = dataMap[5] || dataMap[4];
                if (latestData?.signature) {
                    sigFrame.innerHTML = `<img src="${latestData.signature}">`;
                    nameLabel.innerText = `( ${latestData.nama_superintendent || 'SUPERINTENDENT'} )`;
                }
            } else {
                sigFrame.innerHTML = "";
                nameLabel.innerText = "( ........................ )";
            }
        }

        function downloadExcel() {
            const tools = document.getElementById('label-merk').innerText;
            const bulan = document.getElementById('label-bulan').innerText;
            const tahun = document.getElementById('label-tahun').innerText;
            const table = document.getElementById("table-to-export");
            const worksheet = XLSX.utils.table_to_sheet(table);

            // Pengaturan Visual Excel
            worksheet['!cols'] = [{wch:5}, {wch:35}, {wch:10}, {wch:20}, {wch:10}, {wch:20}, {wch:10}, {wch:20}, {wch:10}, {wch:20}, {wch:10}, {wch:20}];
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            for(let i=0; i<=range.e.r; i++) { worksheet['!rows'] = worksheet['!rows'] || []; worksheet['!rows'][i] = {hpt:22}; }

            // Merge header week
            worksheet['!merges'] = [
                { s: {r:0, c:2}, e: {r:0, c:3} }, { s: {r:0, c:4}, e: {r:0, c:5} }, { s: {r:0, c:6}, e: {r:0, c:7} }, { s: {r:0, c:8}, e: {r:0, c:9} }, { s: {r:0, c:10}, e: {r:0, c:11} }
            ];

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Monthly_Report");
            XLSX.writeFile(workbook, `History_Monthly_${tools}_${bulan}_${tahun}.xlsx`);
        }

        window.onload = () => renderRows({});
    </script>
</body>
</html>
