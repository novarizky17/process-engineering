<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISTORY CHECKLIST (MONTHLY) - TOOLING SUPPORT</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* PENGATURAN PRINT AGAR TENGAH DAN GARIS TEGAS */
        @page { 
            size: A4 landscape; 
            margin: 5mm; 
        }

        @media print {
            body { 
                padding: 0; 
                margin: 0; 
                background: white !important; 
                -webkit-print-color-adjust: exact; 
                display: flex;
                justify-content: center;
            }
            .no-print { display: none !important; }
            .document-page { 
                box-shadow: none !important; 
                border: 1.5pt solid black !important; 
                width: 100% !important; 
                max-width: none !important; 
                margin: 0 auto !important; 
                padding: 10px !important;
                transform: scale(0.96);
                transform-origin: top center;
            }
            .table-official, .table-official th, .table-official td {
                border: 1pt solid black !important;
            }
            .header-box, .header-cell {
                border: 1.5pt solid black !important;
            }
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: #f8fafc; 
            padding: 20px; 
            color: #1e293b; 
        }
        
        .document-page { 
            background: white; 
            width: 1250px; 
            margin: 0 auto; 
            padding: 25px; 
            border: 1px solid #e2e8f0; 
            box-sizing: border-box; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 8px;
        }
        
        /* HEADER */
        .header-box { border: 2px solid black; margin-bottom: 15px; display: table; width: 100%; border-collapse: collapse; }
        .header-cell { display: table-cell; border-right: 2px solid black; vertical-align: middle; }
        .header-cell:last-child { border-right: none; }
        .logo-area { width: 160px; padding: 10px; text-align: center; }
        .logo-area img { width: 130px; height: auto; display: block; margin: 0 auto; }
        .title-area { text-align: center; font-size: 18pt; font-weight: 800; padding: 10px; text-transform: uppercase; color: #0f172a; letter-spacing: 0.5px; }
        
        .meta-area { width: 320px; font-size: 9pt; padding: 5px; text-transform: uppercase; color: #000; font-weight: bold; }
        .meta-table { width: 100%; border-collapse: collapse; }
        .meta-table td { padding: 3px 5px; vertical-align: middle; border: none !important; white-space: nowrap; }

        .meta-info { display: flex; justify-content: space-between; margin: 15px 0; font-weight: 700; font-size: 10pt; align-items: flex-end; text-transform: uppercase; }
        .info-label { width: 110px; display: inline-block; color: #64748b; }
        .info-value { border-bottom: 2px solid #0f172a; min-width: 220px; display: inline-block; padding: 0 5px; margin-left: 5px; color: #0f172a; }
        
        /* TABLE STYLING */
        .table-official { width: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid black; text-transform: uppercase; }
        .table-official th, .table-official td { border: 1.5px solid black; padding: 6px 4px; font-size: 8pt; text-align: center; vertical-align: middle; }
        .table-official th { background-color: #f1f5f9; font-weight: 800; color: #0f172a; }

        .status-text { font-weight: 800; font-size: 9.5pt; }
        .ng-color { color: #dc2626; }
        .ng-text-desc { font-size: 7.5pt; line-height: 1.2; word-wrap: break-word; color: #dc2626; font-weight: 700; }

        .col-no { width: 35px; }
        .col-item { width: 200px; text-align: left !important; padding-left: 10px !important; font-weight: 700; color: #334155; }
        .col-status { width: 55px; }
        .col-ket { width: 95px; }
        
        .section-header { background-color: #e2e8f0 !important; text-align: left !important; padding: 8px 12px !important; font-weight: 800; font-size: 9pt; color: #1e293b; }
        
        /* FOOTER PARAF */
        .row-title-footer { background-color: #f8fafc; font-weight: 800; text-align: center !important; font-size: 8.5pt; height: 80px; color: #475569; }
        .sig-td { height: 90px; background-color: #fff; padding: 0 !important; vertical-align: middle !important; text-align: center !important; overflow: hidden; }
        .sig-td img { max-height: 80px; width: auto; mix-blend-mode: multiply; margin: 0 auto; }

        .no-print-container { 
            max-width: 1250px; 
            margin: 0 auto 20px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            border: 1px solid #e2e8f0;
        }
        
        .no-print-container input, .no-print-container select { 
            padding: 10px 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .no-print-container input:focus { border-color: #3b82f6; ring: 2px; outline: none; }

        .btn-search { background: #1e293b; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 700; transition: all 0.2s; }
        .btn-search:hover { background: #0f172a; transform: translateY(-1px); }
        
        .btn-print { background: #059669; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 700; transition: all 0.2s; }
        .btn-print:hover { background: #047857; transform: translateY(-1px); }

        .footer-flex { display: flex; justify-content: flex-end; margin-top: 25px; padding-right: 20px; }
        .diketahui-box { width: 280px; text-align: center; }
        .sig-frame { border: 2px solid #000; width: 180px; height: 100px; margin: 8px auto; display: flex; align-items: center; justify-content: center; background: #fff; }
        .sig-frame img { max-height: 90px; width: auto; mix-blend-mode: multiply; }
        .name-line { border-top: 2px solid black; width: 240px; margin: 0 auto; padding-top: 5px; font-weight: 800; color: #000; text-align: center; font-size: 10pt; }
    </style>
</head>
<body>

    <div class="no-print no-print-container">
        <input type="text" id="input-merk" placeholder="NAMA TOOLS / EQUIPMENT" class="uppercase">
        <input type="text" id="input-tonage" placeholder="CAPACITY" class="w-32 uppercase">
        <select id="filter-bulan">
            <option value="">PILIH BULAN</option>
            <option value="01">JANUARI</option><option value="02">FEBRUARI</option><option value="03">MARET</option>
            <option value="04">APRIL</option><option value="05">MEI</option><option value="06">JUNI</option>
            <option value="07">JULI</option><option value="08">AGUSTUS</option><option value="09">SEPTEMBER</option>
            <option value="10">OKTOBER</option><option value="11">NOVEMBER</option><option value="12">DESEMBER</option>
        </select>
        <select id="filter-tahun">
            <script>
                for(let y=2024; y<=2030; y++) { 
                    let sel = y === 2026 ? "selected" : "";
                    document.write(`<option value="${y}" ${sel}>${y}</option>`); 
                }
            </script>
        </select>
        <button onclick="renderReport(true)" class="btn-search shadow-sm">CARI DATA</button>
        <button onclick="window.print()" class="btn-print shadow-sm">PRINT PDF</button>
        <button onclick="window.location.href='management_tracker.html'" class="bg-slate-500 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-600 transition-all shadow-sm">KEMBALI</button>
    </div>

    <div class="document-page">
        <div class="header-box">
            <div class="header-cell logo-area"><img src="https://amarilyskg.co.id/bootstrap/img/logo.png" alt="LOGO AKG"></div>
            <div class="header-cell title-area">CHECKLIST MONITORING TOOLING SUPPORT</div>
            <div class="header-cell meta-area">
                <table class="meta-table">
                    <tr><td style="width: 110px;">NO DOKUMEN</td><td>: </td></tr>
                    <tr><td>TANGGAL TERBIT</td><td>: </td></tr>
                    <tr><td>HALAMAN</td><td>: </td></tr>
                </table>
            </div>
        </div>

        <div class="meta-info">
            <div class="meta-info-left space-y-2">
                <div class="info-row"><span class="info-label">EQUIPMENT</span> : <span class="info-value" id="label-merk">-</span></div>
                <div class="info-row"><span class="info-label">CAPACITY</span> : <span class="info-value" id="label-tonage">-</span></div>
            </div>
            <div class="meta-info-right space-y-2">
                <div class="info-row"><span class="info-label">BULAN</span> : <span class="info-value" id="label-bulan">-</span></div>
                <div class="info-row"><span class="info-label">TAHUN</span> : <span class="info-value" id="label-tahun">-</span></div>
            </div>
        </div>

        <table class="table-official">
            <thead>
                <tr>
                    <th class="col-no" rowspan="2">NO</th>
                    <th class="col-item" rowspan="2">JENIS PENGECEKAN</th>
                    <th colspan="2">WEEK 1</th>
                    <th colspan="2">WEEK 2</th>
                    <th colspan="2">WEEK 3</th>
                    <th colspan="2">WEEK 4</th>
                    <th colspan="2">WEEK 5</th>
                </tr>
                <tr>
                    <th class="col-status">OK/NG</th><th class="col-ket">KET</th>
                    <th class="col-status">OK/NG</th><th class="col-ket">KET</th>
                    <th class="col-status">OK/NG</th><th class="col-ket">KET</th>
                    <th class="col-status">OK/NG</th><th class="col-ket">KET</th>
                    <th class="col-status">OK/NG</th><th class="col-ket">KET</th>
                </tr>
            </thead>
            <tbody id="table-content"></tbody>
            <tfoot>
                <tr id="row-paraf-pelaksana">
                    <td colspan="2" class="row-title-footer">PARAF PELAKSANA</td>
                    <td colspan="2" class="sig-td" id="sig-w1"></td>
                    <td colspan="2" class="sig-td" id="sig-w2"></td>
                    <td colspan="2" class="sig-td" id="sig-w3"></td>
                    <td colspan="2" class="sig-td" id="sig-w4"></td>
                    <td colspan="2" class="sig-td" id="sig-w5"></td>
                </tr>
            </tfoot>
        </table>

        <div class="footer-flex">
            <div class="diketahui-box">
                <p style="font-weight: 800; margin-bottom: 5px; color: #1e293b;">DIKETAHUI</p>
                <div class="sig-frame" id="super-sig"></div>
                <div id="super-name" class="name-line">( ........................ )</div>
                <p style="font-size: 8pt; margin-top: 4px; font-weight: 700; color: #64748b;">PROCESS ENGINEERING</p>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);

        const checklistStructure = [
            { header: "1. STAND LABEL", type: 'head' },
            { name: "WIRING", field: "wiring" },
            { name: "KOMPONEN", field: "komponen" },
            { name: "KERAPIHAN", field: "kerapihan" },
            { name: "SENSOR", field: "sensor" },
            { name: "TIMING BELT", field: "timing_belt" },
            { name: "PULLY", field: "pully" },
            { name: "SERVO MOTOR", field: "servo_motor" },
            { name: "LINEAR BEARING", field: "linear_bearing" },
            { name: "ROTARY ACTUATOR", field: "rotary_actuator" },
            { name: "SELENOID VALVE", field: "selenoid_valve" },
            { name: "VACUUM EJECTOR", field: "vacuum_ejector" },
            { name: "SILINDER PNEUMATIC", field: "silinder_pneumatic" },
            { name: "NAPPLE", field: "napple" },
            { name: "VACUUM PAD", field: "vacuum_pad" },
            { name: "FLANGE", field: "flange" },
            { name: "VACUUM PAD TAKEOUT", field: "vacuum_pad_takeout" },
            { header: "2. STACKING", type: 'head' },
            { name: "WIRING", field: "stacking_wiring" },
            { name: "SENSOR", field: "stacking_sensor" },
            { name: "LINIER", field: "stacking_linier" },
            { name: "MECHANICAL PART", field: "stacking_mechanical_part" },
            { name: "CYLINDER", field: "stacking_cylinder" },
            { name: "PNEUMATIC", field: "stacking_pneumatic" },
            { header: "3. CONVEYOR", type: 'head' },
            { name: "BELT", field: "conveyor_belt" },
            { name: "MOTOR", field: "conveyor_motor" },
            { name: "RANTAI", field: "conveyor_rantai" },
            { name: "FRAME", field: "conveyor_frame" },
            { name: "INVERTER", field: "conveyor_inverter" },
            { header: "4. DOSING", type: 'head' },
            { name: "ALARM", field: "dosing_alarm" },
            { name: "SETTING", field: "dosing_setting" },
            { header: "5. DUMMY", type: 'head' },
            { name: "VACUUM", field: "dummy_vacuum" },
            { name: "KONDISI", field: "dummy_condition" },
            { name: "FLANGE", field: "dummy_flange" },
            { name: "INSTALASI", field: "dummy_instalasi" },
            { name: "TUBBING", field: "dummy_tubbing" }
        ];

        function numToChar(num) { return String.fromCharCode(96 + num).toUpperCase(); }

        async function renderReport(isSearching) {
            const thn = document.getElementById('filter-tahun').value;
            const bln = document.getElementById('filter-bulan').value;
            const tools = document.getElementById('input-merk').value.trim();
            const capacity = document.getElementById('input-tonage').value.trim();

            if (!isSearching || !bln || !tools) {
                alert("Mohon isi Nama Tools dan pilih Bulan!");
                return;
            }

            document.getElementById('label-tahun').innerText = thn;
            document.getElementById('label-bulan').innerText = document.getElementById('filter-bulan').options[document.getElementById('filter-bulan').selectedIndex].text;
            document.getElementById('label-merk').innerText = tools.toUpperCase();
            document.getElementById('label-tonage').innerText = capacity || "-";

            const dateFilter = `${thn}-${bln}`;
            const { data, error } = await _sb.from('checklist').select('*, pelaksana(*)').eq('status', 'Approved');
            if (error) return console.error(error);

            const filteredData = data.filter(item => {
                if (!item.pelaksana || !item.pelaksana.tanggal_checklist) return false;
                const mMatch = item.pelaksana.nama_tools?.toLowerCase().includes(tools.toLowerCase());
                const tMatch = capacity ? item.pelaksana.capacity?.toLowerCase().includes(capacity.toLowerCase()) : true;
                const dMatch = item.pelaksana.tanggal_checklist.startsWith(dateFilter);
                return mMatch && tMatch && dMatch;
            });

            const dataMap = {};
            filteredData.forEach(item => {
                const w = item.pelaksana ? item.pelaksana.week : null;
                if(w >= 1 && w <= 5) dataMap[w] = item;
            });

            renderRows(dataMap);
            renderParaf(dataMap);
            renderSuper(dataMap);
        }

        function renderRows(dataMap) {
            const tbody = document.getElementById('table-content');
            tbody.innerHTML = "";
            let alphabetCounter = 1;
            checklistStructure.forEach(item => {
                if (item.type === 'head') {
                    alphabetCounter = 1;
                    tbody.innerHTML += `<tr><td colspan="2" class="section-header">${item.header}</td><td colspan="10"></td></tr>`;
                } else {
                    let char = numToChar(alphabetCounter++);
                    let rHtml = `<tr><td class="font-extrabold text-slate-500">${char}</td><td class="col-item">${item.name}</td>`;
                    for(let w=1; w<=5; w++) {
                        let statusText = "", ket = "", ngClass = "";
                        if(dataMap[w]) {
                            const status = dataMap[w][item.field];
                            statusText = status || "";
                            ngClass = status === 'NG' ? "ng-color" : "text-emerald-600";
                            ket = (status === 'NG') ? (dataMap[w][item.field + "_keterangan"] || "") : "";
                        }
                        rHtml += `<td class="col-status font-extrabold ${ngClass}">${statusText}</td>`;
                        rHtml += `<td class="col-ket" style="text-align:left; padding-left:3px;"><span class="ng-text-desc">${ket}</span></td>`;
                    }
                    tbody.innerHTML += rHtml + `</tr>`;
                }
            });
        }

        function renderParaf(dataMap) {
            for(let w=1; w<=5; w++) {
                const cell = document.getElementById(`sig-w${w}`);
                cell.innerHTML = (dataMap[w] && dataMap[w].signature_pelaksana) ? `<img src="${dataMap[w].signature_pelaksana}">` : "";
            }
        }

        function renderSuper(dataMap) {
            const sigFrame = document.getElementById('super-sig');
            const nameLabel = document.getElementById('super-name');
            const hasFinalWeeks = (dataMap[4] || dataMap[5]);
            if (hasFinalWeeks) {
                const latestData = dataMap[5] || dataMap[4];
                if (latestData && latestData.signature) {
                    sigFrame.innerHTML = `<img src="${latestData.signature}">`;
                    nameLabel.innerText = `( ${latestData.nama_superintendent || 'SUPERINTENDENT'} )`;
                }
            } else {
                sigFrame.innerHTML = "";
                nameLabel.innerText = "( ........................ )";
            }
        }

        window.onload = () => renderRows({});
    </script>
</body>
</html>
