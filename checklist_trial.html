<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Trial - Plastic Injection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }

        /* Style Radio Button Custom */
        .radio-option input:checked + div {
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        /* Warna saat Checked */
        .radio-ok input:checked + div { background-color: #10b981; } /* Emerald */
        .radio-ng input:checked + div { background-color: #f43f5e; } /* Rose */
        .radio-na input:checked + div { background-color: #94a3b8; } /* Slate */

        .section-card { transition: all 0.2s ease-in-out; }
        .section-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="pb-24">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm bg-opacity-90 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-bold text-xs uppercase transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali
                </a>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-800 tracking-tight">Formulir Kesiapan Trial</h1>
                    <p class="text-xs text-violet-600 font-bold uppercase tracking-wider">OK / NG / NA System</p>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 mt-8">
        
        <div class="bg-white rounded-3xl p-6 shadow-lg border border-slate-100 mb-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-violet-500 to-fuchsia-500"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2 mb-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tanggal Trial</label>
                    <input type="date" id="trialDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-violet-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Mesin Injection</label>
                    <select class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 outline-none cursor-pointer">
                        <option value="">Pilih Mesin...</option>
                        <option>Inj-01 (150T)</option>
                        <option>Inj-02 (200T)</option>
                        <option>Inj-03 (350T)</option>
                        <option>Inj-04 (500T)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Kode / Nama Mold</label>
                    <input type="text" placeholder="Input Kode Mold..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-violet-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-t border-slate-100 pt-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Material Resin</label>
                    <input type="text" placeholder="Contoh: ABS, PP, PA6..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-violet-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">PIC Trial (Penanggung Jawab)</label>
                    <input type="text" placeholder="Nama Engineer / Leader..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-violet-500">
                </div>
            </div>
        </div>

        <form id="trialForm">
            
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6 section-card">
                <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                    <h3 class="text-lg font-extrabold text-slate-800">1. Verifikasi Mesin Injeksi</h3>
                    <span class="bg-violet-100 text-violet-700 text-[10px] font-bold px-3 py-1 rounded-full">MACHINE</span>
                </div>
                <div id="section-1-content" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6 section-card">
                <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                    <h3 class="text-lg font-extrabold text-slate-800">2. Persiapan Mold (Cetakan)</h3>
                    <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-3 py-1 rounded-full">MOLD</span>
                </div>
                <div id="section-2-content" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6 section-card">
                <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                    <h3 class="text-lg font-extrabold text-slate-800">3. Peralatan Pendukung</h3>
                    <span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-3 py-1 rounded-full">AUX</span>
                </div>
                <div id="section-3-content" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6 section-card">
                <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                    <h3 class="text-lg font-extrabold text-slate-800">4. Material & Kimia</h3>
                    <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-3 py-1 rounded-full">RESIN</span>
                </div>
                <div id="section-4-content" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6 section-card">
                <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                    <h3 class="text-lg font-extrabold text-slate-800">5. Alat Ukur & Dokumen</h3>
                    <span class="bg-sky-100 text-sky-700 text-[10px] font-bold px-3 py-1 rounded-full">QC TOOLS</span>
                </div>
                <div id="section-5-content" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-8 section-card">
                <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                    <h3 class="text-lg font-extrabold text-slate-800">6. Safety (K3)</h3>
                    <span class="bg-rose-100 text-rose-700 text-[10px] font-bold px-3 py-1 rounded-full">SAFETY</span>
                </div>
                <div id="section-6-content" class="space-y-3"></div>
            </div>

            <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-4 shadow-lg flex gap-4 justify-center z-40">
                <button type="button" onclick="window.scrollTo(0,0)" class="bg-slate-100 text-slate-600 px-6 py-3 rounded-xl font-bold text-xs uppercase">Atas</button>
                <button type="button" onclick="submitTrialForm()" class="bg-violet-600 hover:bg-violet-700 text-white px-8 py-3 rounded-xl font-extrabold text-sm uppercase shadow-lg shadow-violet-200 active:scale-95 transition-all w-full md:w-auto md:min-w-[200px]">
                    Simpan Verifikasi
                </button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('trialDate').valueAsDate = new Date();

        // Data Checklist
        const checklistData = {
            "section-1-content": [
                { id: "m1", title: "Kapasitas Tonase", desc: "Tonase sesuai clamping force mold." },
                { id: "m2", title: "Kapasitas Injeksi", desc: "Shot size 20% - 80% kapasitas barrel." },
                { id: "m3", title: "Kondisi Nozzle", desc: "Radius nozzle & centering locating ring." },
                { id: "m4", title: "Fungsi Ejektor", desc: "Koneksi ejektor & stroke cukup." },
                { id: "m5", title: "Kalibrasi", desc: "Sensor suhu & tekanan normal." }
            ],
            "section-2-content": [
                { id: "md1", title: "Kebersihan Mold", desc: "Core/Cavity bersih dari karat/kotoran." },
                { id: "md2", title: "Clamping Plate", desc: "Ukuran sesuai, baut terikat kuat." },
                { id: "md3", title: "Moving Parts", desc: "Leader pin & slider sudah digrease." },
                { id: "md4", title: "Cooling System", desc: "Tidak ada bocor/sumbatan jalur air." },
                { id: "md5", title: "Hot Runner", desc: "Koneksi kabel & thermocouple (jika ada)." }
            ],
            "section-3-content": [
                { id: "ax1", title: "MTC / Mold Temp", desc: "Level media cukup, selang aman." },
                { id: "ax2", title: "Chiller", desc: "Suhu air stabil sesuai standar." },
                { id: "ax3", title: "Dryer Material", desc: "Suhu & waktu drying tercapai." },
                { id: "ax4", title: "Robot", desc: "Gripper/cup terpasang, angin cukup." },
                { id: "ax5", title: "Granulator", desc: "Siap untuk recycle runner." }
            ],
            "section-4-content": [
                { id: "mat1", title: "Resin Material", desc: "Stok cukup untuk trial & purging." },
                { id: "mat2", title: "Masterbatch", desc: "Rasio mixing pewarna sudah benar." },
                { id: "mat3", title: "Purging Compound", desc: "Tersedia untuk bersih barrel." },
                { id: "mat4", title: "Mold Release", desc: "Spray silikon tersedia." }
            ],
            "section-5-content": [
                { id: "qc1", title: "Alat Ukur Dimensi", desc: "Caliper/Micrometer/Pin Gauge." },
                { id: "qc2", title: "Termometer Laser", desc: "Cek aktual suhu mold." },
                { id: "qc3", title: "Form Trial Report", desc: "Lembar pencatatan parameter." },
                { id: "qc4", title: "Drawing Produk", desc: "2D Drawing / Sampel Limit." }
            ],
            "section-6-content": [
                { id: "sf1", title: "APD Lengkap", desc: "Sarung tangan, kacamata, sepatu." },
                { id: "sf2", title: "Safety Gate", desc: "Sensor pintu & interlock berfungsi." },
                { id: "sf3", title: "Emergency Stop", desc: "Tombol darurat berfungsi." }
            ]
        };

        // Render Function (TOMBOL DI KANAN SEJAJAR TEKS)
        function renderItems() {
            for (const [sectionId, items] of Object.entries(checklistData)) {
                const container = document.getElementById(sectionId);
                items.forEach(item => {
                    const html = `
                    <div class="border border-slate-100 rounded-xl p-3 bg-slate-50/50 hover:bg-white transition-all">
                        
                        <div class="flex flex-row items-center justify-between gap-4">
                            
                            <div class="flex-1">
                                <h4 class="text-sm font-bold text-slate-800">${item.title}</h4>
                                <p class="text-[10px] text-slate-500 mt-0.5 leading-tight">${item.desc}</p>
                            </div>
                            
                            <div class="flex gap-1 shrink-0">
                                <label class="radio-option radio-ok cursor-pointer">
                                    <input type="radio" name="status_${item.id}" value="OK" class="peer sr-only" onchange="toggleNote('${item.id}', this.value)">
                                    <div class="w-10 h-8 flex items-center justify-center rounded-lg text-[10px] font-bold text-slate-400 border border-slate-200 bg-white peer-checked:bg-emerald-500 hover:bg-slate-100 transition-all">OK</div>
                                </label>
                                <label class="radio-option radio-ng cursor-pointer">
                                    <input type="radio" name="status_${item.id}" value="NG" class="peer sr-only" onchange="toggleNote('${item.id}', this.value)">
                                    <div class="w-10 h-8 flex items-center justify-center rounded-lg text-[10px] font-bold text-slate-400 border border-slate-200 bg-white peer-checked:bg-rose-500 hover:bg-slate-100 transition-all">NG</div>
                                </label>
                                <label class="radio-option radio-na cursor-pointer">
                                    <input type="radio" name="status_${item.id}" value="NA" class="peer sr-only" onchange="toggleNote('${item.id}', this.value)">
                                    <div class="w-10 h-8 flex items-center justify-center rounded-lg text-[10px] font-bold text-slate-400 border border-slate-200 bg-white peer-checked:bg-slate-400 hover:bg-slate-100 transition-all">NA</div>
                                </label>
                            </div>

                        </div>

                        <div id="note_box_${item.id}" class="hidden mt-3 pt-2 border-t border-slate-100 animate-fade-in">
                            <input type="text" id="note_${item.id}" class="w-full border border-rose-200 bg-rose-50 rounded-lg px-3 py-2 text-xs text-rose-800 placeholder-rose-300 focus:outline-none focus:ring-1 focus:ring-rose-500" placeholder="Jelaskan masalahnya (Wajib)...">
                        </div>
                    </div>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                });
            }
        }

        // Logic Toggle Keterangan
        function toggleNote(id, status) {
            const noteBox = document.getElementById(`note_box_${id}`);
            const noteInput = document.getElementById(`note_${id}`);
            
            if (status === 'NG') {
                noteBox.classList.remove('hidden');
                noteInput.focus();
            } else {
                noteBox.classList.add('hidden');
                noteInput.value = ''; 
            }
        }

        // Validation & Submit
        function submitTrialForm() {
            let totalItems = 0;
            let filledItems = 0;
            let ngIssue = false;

            for (const items of Object.values(checklistData)) {
                items.forEach(item => {
                    totalItems++;
                    const radios = document.getElementsByName(`status_${item.id}`);
                    let selectedValue = null;
                    
                    for (const radio of radios) {
                        if (radio.checked) selectedValue = radio.value;
                    }

                    if (selectedValue) {
                        filledItems++;
                        if (selectedValue === 'NG') {
                            const noteVal = document.getElementById(`note_${item.id}`).value.trim();
                            if (!noteVal) {
                                ngIssue = true;
                                document.getElementById(`note_${item.id}`).classList.add('ring-2', 'ring-rose-600');
                            }
                        }
                    }
                });
            }

            if (ngIssue) {
                Swal.fire({ icon: 'error', title: 'Data Belum Lengkap', text: 'Item NG wajib ada keterangan!', confirmButtonColor: '#f43f5e' });
                return;
            }

            if (filledItems < totalItems) {
                Swal.fire({ icon: 'warning', title: 'Belum Selesai', text: `Baru terisi ${filledItems} dari ${totalItems} item.`, confirmButtonColor: '#f59e0b' });
                return;
            }

            Swal.fire({
                title: 'Konfirmasi',
                text: 'Simpan verifikasi ini?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#7c3aed',
                confirmButtonText: 'Ya, Simpan!'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire('Berhasil!', 'Data checklist tersimpan.', 'success');
                }
            });
        }

        renderItems();
    </script>
</body>
</html>
