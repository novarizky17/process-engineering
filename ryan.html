<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Panel - Ryan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .gradient-blue { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        
        /* MODAL GAYA POP-UP BAWAH (ANDROID STYLE) */
        .modal-overlay { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
        .modal-content { 
            background: white; position: absolute; bottom: 0; width: 100%; max-height: 90vh; 
            border-radius: 24px 24px 0 0; padding: 24px; animation: slideUp 0.3s; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
        }
        @media(min-width: 768px) {
            .modal-content { bottom: auto; top: 5%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; border-radius: 20px; height: auto; animation: none; }
        }

        @keyframes slideUp { from {transform: translateY(100%);} to {transform: translateY(0);} }

        .progress-bg { width: 100%; background-color: #e2e8f0; border-radius: 9999px; height: 8px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.4s ease-in-out; }
        
        .edit-input { border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; width: 100%; font-size: 14px; outline: none; background: #fff; }
        .edit-input:focus { border-color: #3b82f6; ring: 2px; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <div class="gradient-blue w-full pt-8 pb-20 px-6 mb-[-60px] shadow-lg">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-xl font-black text-white border border-white/30">R</div>
                <div>
                    <h1 class="text-xl font-bold text-white uppercase">Panel Ryan</h1>
                    <p class="text-blue-100 text-xs">Task Monitoring</p>
                </div>
            </div>
            <a href="employee_report.html" class="bg-white/10 text-white px-4 py-2 rounded-lg text-xs font-bold border border-white/20">Kembali</a>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 relative z-10">
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-[10px] font-bold text-gray-400 uppercase">In Progress</p>
                <h3 id="stat-active" class="text-2xl font-black text-gray-800">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-500">
                <p class="text-[10px] font-bold text-gray-400 uppercase">Selesai</p>
                <h3 id="stat-finished" class="text-2xl font-black text-gray-800">0</h3>
            </div>
        </div>

        <div class="mb-4">
            <input type="text" id="search-input" oninput="filterTable()" placeholder="Cari Tugas..." class="w-full bg-white border-0 shadow-md rounded-xl p-4 text-sm font-bold text-gray-700 outline-none">
        </div>

        <div id="task-list-container" class="space-y-4 pb-10"></div>
    </div>

    <div id="updateModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start border-b pb-4">
                <div>
                    <span id="modal-job-type" class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase mb-1 inline-block">Type</span>
                    <h2 id="modal-project-title" class="text-lg font-black text-slate-800 uppercase leading-tight">Nama Project</h2>
                    <p id="modal-machine-name" class="text-xs text-blue-600 font-bold mt-1">Nama Mesin</p>
                </div>
                <button onclick="document.getElementById('updateModal').style.display='none'" class="text-3xl text-gray-400">&times;</button>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Instruksi Boss:</span>
                <p id="modal-task-desc" class="text-sm font-bold text-slate-700 whitespace-pre-wrap">...</p>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Rincian / Sub-Task Anda:</label>
                <div id="modal-subtask-list" class="space-y-2 mb-2"></div>
                
                <div class="flex gap-2">
                    <input type="text" id="new-subtask-input" class="bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm flex-grow outline-none" placeholder="Tambah rincian...">
                    <button onclick="addNewSubtask()" class="bg-blue-600 text-white w-10 rounded-lg font-bold text-lg shadow-sm">+</button>
                </div>
            </div>

            <hr class="border-dashed">

            <input type="hidden" id="current-task-id">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Status</label>
                    <select id="in-status" class="edit-input font-bold" onchange="checkStatusDone()">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Hold">Hold</option>
                        <option value="Done">Selesai</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Progress (%)</label>
                    <input type="number" id="in-progress" min="0" max="100" class="edit-input font-bold text-blue-600 text-center">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Mulai Kerja</label>
                    <input type="datetime-local" id="in-start-time" class="edit-input text-xs">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Selesai Kerja</label>
                    <input type="datetime-local" id="in-end-time" class="edit-input text-xs">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Kendala / Alasan Hold</label>
                <textarea id="in-hold-reason" rows="2" class="edit-input text-red-600 font-medium" placeholder="Isi jika ada kendala..."></textarea>
            </div>

            <button onclick="saveChanges()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-sm uppercase shadow-lg active:scale-95 transition-all mt-2">
                Simpan Update
            </button>
        </div>
    </div>

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);
        
        let allTasks = [];
        let subTasksMap = {}; 

        // === FUNGSI UTAMA ===
        async function fetchRyanTasks() {
            // 1. Ambil Data Tugas
            const { data: mainData, error: mainError } = await _sb
                .from('management_tracker')
                .select('*')
                .eq('assigned_to', 'RYAN')
                .order('created_at', { ascending: false });
            
            if (mainError) return console.error(mainError);
            
            // 2. Ambil Sub-Task
            const taskIds = mainData.map(t => t.id);
            if(taskIds.length > 0){
                const { data: subData } = await _sb
                    .from('employee_subtasks')
                    .select('*')
                    .in('parent_task_id', taskIds)
                    .order('created_at', { ascending: true });

                subTasksMap = {};
                if(subData) {
                    subData.forEach(sub => {
                        if(!subTasksMap[sub.parent_task_id]) subTasksMap[sub.parent_task_id] = [];
                        subTasksMap[sub.parent_task_id].push(sub);
                    });
                }
            }

            allTasks = mainData;
            renderCardList(allTasks);
            updateStats(allTasks);
        }

        // === RENDER KARTU (MOBILE FRIENDLY) ===
        function renderCardList(dataList) {
            const container = document.getElementById('task-list-container');
            container.innerHTML = dataList.map(row => {
                const isDone = row.status === 'Done';
                const progress = row.progress_percent || 0;
                
                // Style Status
                let statusColor = "bg-slate-100 text-slate-500";
                if(row.status === 'In Progress') statusColor = "bg-blue-100 text-blue-700";
                if(row.status === 'Hold') statusColor = "bg-rose-100 text-rose-700";
                if(isDone) statusColor = "bg-emerald-100 text-emerald-700";

                const jobBadge = row.job_type && row.job_type !== '-' ? `<span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase border border-purple-100 mr-2">${row.job_type}</span>` : '';
                const machineBadge = row.machine_name && row.machine_name !== '-' ? `<span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase border border-blue-100">${row.machine_name}</span>` : '';

                // Subtask Preview
                const mySubtasks = subTasksMap[row.id] || [];
                const subtaskCount = mySubtasks.length;
                const subtaskText = subtaskCount > 0 ? `${subtaskCount} Sub-task` : 'No Sub-task';

                return `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 relative overflow-hidden active:scale-[0.98] transition-transform duration-200" onclick="openUpdateModal(${row.id})">
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 ${row.priority === 'High' ? 'bg-red-500' : (row.priority === 'Mid' ? 'bg-blue-500' : 'bg-slate-300')}"></div>
                    
                    <div class="flex justify-between items-start mb-2 pl-2">
                        <div>
                            <div class="flex items-center mb-1">
                                ${jobBadge}
                                ${machineBadge}
                            </div>
                            <h3 class="font-bold text-slate-800 text-sm uppercase leading-snug">${row.project_name}</h3>
                        </div>
                        <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${statusColor}">${row.status}</span>
                    </div>

                    <p class="pl-2 text-xs text-slate-500 font-medium line-clamp-2 mb-3">${row.task_desc || 'Tidak ada deskripsi'}</p>

                    <div class="pl-2 mb-3">
                        <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                            <span>${subtaskText}</span>
                            <span>${progress}%</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill ${isDone ? 'bg-emerald-500' : 'bg-blue-500'}" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <div class="pl-2 flex justify-between items-center border-t border-dashed border-slate-100 pt-2">
                        <span class="text-[10px] text-slate-400 font-bold">Due: ${row.due_date || '-'}</span>
                        <div class="text-blue-600 text-xs font-bold flex items-center gap-1">
                            Update <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // === LOGIKA POP-UP MODAL ===
        function openUpdateModal(id) {
            const task = allTasks.find(t => t.id == id);
            if(!task) return;

            // Isi Data ke Modal
            document.getElementById('current-task-id').value = task.id;
            document.getElementById('modal-project-title').innerText = task.project_name;
            document.getElementById('modal-machine-name').innerText = task.machine_name || '-';
            document.getElementById('modal-job-type').innerText = task.job_type || 'General';
            document.getElementById('modal-task-desc').innerText = task.task_desc || '-';
            
            document.getElementById('in-status').value = task.status;
            document.getElementById('in-progress').value = task.progress_percent || 0;
            document.getElementById('in-hold-reason').value = task.hold_reason || '';
            
            if(task.work_start_time) document.getElementById('in-start-time').value = task.work_start_time.substring(0,16);
            else document.getElementById('in-start-time').value = "";

            if(task.work_end_time) document.getElementById('in-end-time').value = task.work_end_time.substring(0,16);
            else document.getElementById('in-end-time').value = "";

            // Render Subtask di dalam Modal
            renderModalSubtasks(task.id);

            // Tampilkan Modal
            document.getElementById('updateModal').style.display = 'block';
        }

        function closeModal(e) {
            if(e.target.id === 'updateModal') e.target.style.display = 'none';
        }

        function renderModalSubtasks(taskId) {
            const list = document.getElementById('modal-subtask-list');
            const subs = subTasksMap[taskId] || [];
            
            if(subs.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400 italic">Belum ada rincian.</p>';
                return;
            }

            list.innerHTML = subs.map(sub => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
                    <span class="text-xs text-slate-700 font-medium">● ${sub.subtask_desc}</span>
                    <button onclick="deleteSubTask(${sub.id}, ${taskId})" class="text-red-400 hover:text-red-600 font-bold text-xs">&times;</button>
                </div>
            `).join('');
        }

        // === FITUR SUBTASK (TAMBAH/HAPUS) ===
        async function addNewSubtask() {
            const taskId = document.getElementById('current-task-id').value;
            const input = document.getElementById('new-subtask-input');
            const text = input.value.trim();
            
            if(!text) return;

            const { error } = await _sb.from('employee_subtasks').insert([{
                parent_task_id: taskId,
                subtask_desc: text
            }]);

            if(!error) {
                input.value = "";
                await fetchRyanTasks(); // Refresh Data Global
                renderModalSubtasks(taskId); // Refresh List di Modal
            } else {
                alert("Gagal: " + error.message);
            }
        }

        async function deleteSubTask(subId, parentId) {
            if(!confirm("Hapus?")) return;
            const { error } = await _sb.from('employee_subtasks').delete().eq('id', subId);
            if(!error) {
                await fetchRyanTasks();
                renderModalSubtasks(parentId);
            }
        }

        // === SIMPAN UPDATE UTAMA ===
        async function saveChanges() {
            const id = document.getElementById('current-task-id').value;
            const status = document.getElementById('in-status').value;
            const progress = document.getElementById('in-progress').value;
            const holdReason = document.getElementById('in-hold-reason').value;
            const startT = document.getElementById('in-start-time').value;
            const endT = document.getElementById('in-end-time').value;

            // Validasi
            if (status === 'Hold' && !holdReason.trim()) return alert("Wajib isi alasan Hold!");
            if (status === 'Done') {
                if(!startT || !endT) return alert("Isi Jam Mulai & Selesai dulu!");
                if(parseInt(progress) < 100) {
                    if(!confirm("Status Done tapi progress belum 100%. Set jadi 100%?")) return;
                }
            }

            const payload = {
                status: status,
                progress_percent: status === 'Done' ? 100 : parseInt(progress),
                hold_reason: holdReason,
                work_start_time: startT ? startT.replace('T', ' ') : null,
                work_end_time: endT ? endT.replace('T', ' ') : null
            };

            if (status === 'Done') payload.actual_finish = new Date().toISOString().split('T')[0];

            const { error } = await _sb.from('management_tracker').update(payload).eq('id', id);
            
            if(!error) {
                document.getElementById('updateModal').style.display = 'none';
                fetchRyanTasks();
            } else {
                alert("Gagal simpan: " + error.message);
            }
        }

        function checkStatusDone() {
            const status = document.getElementById('in-status').value;
            if(status === 'Done') document.getElementById('in-progress').value = 100;
        }

        function filterTable() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = allTasks.filter(t => 
                t.project_name.toLowerCase().includes(q) || 
                (t.task_desc && t.task_desc.toLowerCase().includes(q))
            );
            renderCardList(filtered);
        }

        function updateStats(data) {
            document.getElementById('stat-active').innerText = data.filter(r => r.status === 'In Progress').length;
            document.getElementById('stat-finished').innerText = data.filter(r => r.status === 'Done').length;
        }

        window.onload = fetchRyanTasks;
    </script>
</body>
</html>
