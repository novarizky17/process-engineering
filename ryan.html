<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Panel - Ryan (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9; 
            color: #334155;
            font-size: 13px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Minimalist Input in Table */
        .table-input {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 4px 8px;
            width: 100%;
            transition: all 0.2s;
            font-weight: 600;
            color: #334155;
        }
        .table-input:hover { background: #f8fafc; border-color: #e2e8f0; }
        .table-input:focus { background: white; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1); outline: none; }

        /* Status Select Styling */
        .status-badge-select {
            appearance: none;
            padding: 4px 24px 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            text-align: center;
            background-size: 0.8em;
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            transition: transform 0.1s;
        }
        .status-badge-select:hover { transform: scale(1.05); }

        /* Hierarchy Line for Subtasks */
        .tree-line { position: relative; }
        .tree-line::before {
            content: ''; position: absolute; top: -50%; left: 20px;
            width: 2px; height: 100%; background-color: #cbd5e1; z-index: 0;
        }
        .tree-line::after {
            content: ''; position: absolute; top: 50%; left: 20px;
            width: 15px; height: 2px; background-color: #cbd5e1; z-index: 0;
        }
        .tree-content { position: relative; z-index: 1; }

        /* Floating Action Button */
        .fab {
            position: fixed; bottom: 30px; right: 30px;
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 40; /* Z-Index lebih rendah dari modal */
        }
        .fab:hover { transform: translateY(-4px) rotate(90deg); box-shadow: 0 20px 30px -5px rgba(79, 70, 229, 0.6); }

        /* === PERBAIKAN CSS MODAL === */
        .modal-overlay {
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.75); /* Gelap transparan */
            backdrop-filter: blur(5px);
            z-index: 9999; /* Paling atas */
            display: none; /* Default hide */
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 500px; /* Batasi lebar agar tidak melar */
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            max-height: 90vh; /* Agar scrollable jika layar kecil */
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-content-scroll {
            overflow-y: auto;
            padding: 24px;
        }

        @keyframes modalIn { 
            from { opacity: 0; transform: scale(0.95) translateY(20px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }

        .modal-label { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px; display: block; }
        .modal-input { 
            width: 100%; border: 1px solid #cbd5e1; 
            background: #f8fafc;
            border-radius: 10px; padding: 10px 12px; 
            font-size: 13px; font-weight: 600; color: #1e293b; outline: none; 
            transition: all 0.2s;
        }
        .modal-input:focus { border-color: #6366f1; background: white; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="antialiased">

    <script>
        const SB_URL = "https://yutxomhfqodjzqqibewd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1dHhvbWhmcW9kanpxcWliZXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNjMxODcsImV4cCI6MjA4MTkzOTE4N30.FWmgcuo517KhN0ujLNEZnYZlZ-vbo-jXz3HJjiEJ1tA";
        const _sb = supabase.createClient(SB_URL, SB_KEY);
        let allTasks = [], subTasksMap = {}; 

        function cleanTimestamp(dateStr) { return dateStr ? dateStr.replace('T', ' ').substring(0, 16) : ''; }
        function formatTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return `${date.getDate()}/${date.getMonth()+1} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        }

        async function fetchRyanTasks() {
            const { data: mainData, error } = await _sb.from('management_tracker').select('*').ilike('assigned_to', 'ryan').order('created_at', { ascending: false });
            if (error) return console.error(error);
            
            allTasks = mainData || [];
            fillProjectDropdown(allTasks);

            const taskIds = allTasks.map(t => t.id);
            if(taskIds.length > 0) {
                const { data: subData } = await _sb.from('employee_subtasks').select('*').in('parent_task_id', taskIds).order('created_at', { ascending: true });
                subTasksMap = {};
                if(subData) subData.forEach(sub => {
                    if(!subTasksMap[sub.parent_task_id]) subTasksMap[sub.parent_task_id] = [];
                    subTasksMap[sub.parent_task_id].push(sub);
                });
            } else subTasksMap = {};

            renderTasks(allTasks);
            updateStats(allTasks);
        }

        function fillProjectDropdown(tasks) {
            const select = document.getElementById('modal-parent-id');
            const currentVal = select.value; 
            select.innerHTML = '<option value="">-- Pilih Project --</option>';
            tasks.forEach(task => {
                if(task.status !== 'Done') select.innerHTML += `<option value="${task.id}">${task.project_name} (${task.machine_name})</option>`;
            });
            if(currentVal) select.value = currentVal;
        }

        function renderTasks(dataList) {
            const tbody = document.getElementById('ryan-work-body');
            tbody.innerHTML = dataList.map(row => {
                const isDone = row.status === 'Done';
                const progress = row.progress_percent || 0; 
                const mySubtasks = subTasksMap[row.id] || [];
                
                // === PARENT ROW ===
                let mainRow = `
                    <tr class="bg-white border-b border-slate-100 group hover:bg-slate-50 transition-colors">
                        <td class="px-4 py-5 align-top border-l-4 border-indigo-500 pl-3">
                            <div class="font-bold text-slate-800 text-sm">${row.project_name}</div>
                            ${row.machine_name ? `<span class="inline-block mt-1 px-2 py-0.5 bg-slate-100 text-slate-500 text-[10px] rounded font-bold uppercase tracking-wider">${row.machine_name}</span>` : ''}
                        </td>
                        <td class="px-4 py-5 align-top">
                            <div class="mb-1 text-xs font-bold text-slate-400 uppercase">Instruksi Utama</div>
                            <div class="text-slate-700 font-medium leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100 border-l-2 border-l-blue-400">
                                "${row.task_desc || '-'}"
                            </div>
                        </td>
                        <td class="px-2 py-5 align-top text-center">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${row.priority=='High'?'bg-rose-100 text-rose-600':(row.priority=='Mid'?'bg-blue-100 text-blue-600':'bg-emerald-100 text-emerald-600')}">${row.priority}</span>
                        </td>
                        <td class="px-2 py-5 align-top">
                            <div class="flex items-center gap-2">
                                <input type="number" id="prog-${row.id}" value="${progress}" class="table-input text-center bg-slate-50 border-slate-200" onchange="saveMain('${row.id}')">
                                <span class="text-slate-400 font-bold">%</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-1.5 mt-2 overflow-hidden">
                                <div class="bg-indigo-500 h-1.5 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                            </div>
                        </td>
                        <td class="px-2 py-5 align-top text-center">
                            <div class="flex flex-col gap-1">
                                <input type="datetime-local" id="start-${row.id}" value="${cleanTimestamp(row.work_start_time)}" onchange="saveMain('${row.id}')" class="table-input text-[11px] text-center">
                                <span class="text-slate-300 text-[10px] font-bold">SD</span>
                                <input type="datetime-local" id="end-${row.id}" value="${cleanTimestamp(row.work_end_time)}" onchange="saveMain('${row.id}')" class="table-input text-[11px] text-center">
                            </div>
                        </td>
                        <td class="px-2 py-5 align-top text-center">
                            <select id="job-${row.id}" onchange="saveMain('${row.id}')" class="table-input text-center text-xs">
                                <option value="-" ${row.job_type=='-'?'selected':''}>-</option>
                                <option value="Improvement" ${row.job_type=='Improvement'?'selected':''}>Imp</option>
                                <option value="Overhaul" ${row.job_type=='Overhaul'?'selected':''}>Ovhl</option>
                                <option value="Perawatan" ${row.job_type=='Perawatan'?'selected':''}>Mtc</option>
                                <option value="New Project" ${row.job_type=='New Project'?'selected':''}>New</option>
                            </select>
                        </td>
                        <td class="px-2 py-5 align-top">
                            <textarea id="hold-${row.id}" class="table-input text-xs resize-none h-20 placeholder:text-slate-300" placeholder="Catatan Hold..." onchange="saveMain('${row.id}')">${row.hold_reason||''}</textarea>
                        </td>
                        <td class="px-2 py-5 align-top text-center">
                            <select id="stat-${row.id}" class="status-badge-select ${row.status=='Done'?'bg-emerald-100 text-emerald-700':(row.status=='Hold'?'bg-rose-100 text-rose-700':(row.status=='In Progress'?'bg-blue-100 text-blue-700':'bg-slate-100 text-slate-600'))}" onchange="saveMain('${row.id}')" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'currentColor\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M19 9l-7 7-7-7\'/></svg>')">
                                <option value="Pending" ${row.status=='Pending'?'selected':''}>Pending</option>
                                <option value="In Progress" ${row.status=='In Progress'?'selected':''}>Active</option>
                                <option value="Hold" ${row.status=='Hold'?'selected':''}>Hold</option>
                                <option value="Done" ${row.status=='Done'?'selected':''}>Done</option>
                            </select>
                        </td>
                        <td class="px-2 py-5 align-top text-center">
                             <button class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white transition-all shadow-sm" onclick="saveMain('${row.id}')" title="Simpan">
                                <i class="fa-solid fa-floppy-disk"></i>
                             </button>
                        </td>
                    </tr>
                `;

                // === SUBTASK ROWS (HORIZONTAL LAYOUT) ===
                let subRows = mySubtasks.map(sub => {
                    let pColor = sub.priority === 'High' ? 'text-rose-500' : (sub.priority === 'Mid' ? 'text-blue-500' : 'text-emerald-500');
                    let sColor = sub.status === 'Done' ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-500 border-slate-100';
                    
                    return `
                    <tr class="subtask-row">
                        <td class="px-4 py-2 align-middle border-r border-slate-100 relative">
                            <div class="tree-line h-full w-full">
                                <div class="tree-content text-right pr-2">
                                    <span class="text-[10px] font-bold text-slate-300 uppercase tracking-widest bg-f8fafc pl-1">Subtask</span>
                                </div>
                            </div>
                        </td>

                        <td class="px-4 py-3 border-r border-slate-100" colspan="8">
                            <div class="flex items-center justify-between group">
                                <div class="flex items-center gap-4 flex-grow">
                                    <div class="font-bold text-slate-700 min-w-[200px] text-sm">
                                        <i class="fa-solid fa-caret-right text-slate-300 mr-2"></i> ${sub.subtask_desc}
                                    </div>

                                    <div class="flex items-center gap-3 overflow-x-auto pb-1 no-scrollbar">
                                        <div class="flex items-center gap-1 bg-white border border-slate-200 px-2 py-1 rounded text-xs font-semibold whitespace-nowrap shadow-sm">
                                            <i class="fa-solid fa-flag ${pColor} text-[10px]"></i> <span>${sub.priority}</span>
                                        </div>
                                        <div class="flex items-center gap-1 bg-white border border-slate-200 px-2 py-1 rounded text-xs font-semibold whitespace-nowrap shadow-sm">
                                            <i class="fa-solid fa-chart-pie text-slate-400 text-[10px]"></i> <span>${sub.progress_percent}%</span>
                                        </div>
                                        ${sub.job_type && sub.job_type !== '-' ? 
                                        `<div class="bg-indigo-50 text-indigo-600 border border-indigo-100 px-2 py-1 rounded text-xs font-bold whitespace-nowrap uppercase text-[10px]">${sub.job_type}</div>` : ''}
                                        
                                        <div class="${sColor} border px-2 py-1 rounded text-xs font-bold whitespace-nowrap flex items-center gap-1">
                                            <span class="w-1.5 h-1.5 rounded-full ${sub.status=='Done'?'bg-emerald-500':'bg-slate-400'}"></span>
                                            ${sub.status}
                                        </div>

                                        ${sub.start_date || sub.end_date ? `
                                        <div class="text-[10px] text-slate-400 font-mono bg-slate-50 px-2 py-1 rounded border border-slate-100 whitespace-nowrap">
                                            ${formatTime(sub.start_date)} - ${formatTime(sub.end_date)}
                                        </div>` : ''}

                                        ${sub.worker_notes ? `
                                        <div class="text-xs text-slate-500 italic max-w-[200px] truncate bg-yellow-50 px-2 py-1 rounded border border-yellow-100" title="${sub.worker_notes}">
                                            <i class="fa-regular fa-note-sticky text-yellow-400 mr-1"></i> ${sub.worker_notes}
                                        </div>` : ''}
                                    </div>
                                </div>

                                ${!isDone ? `
                                <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-4">
                                    <button onclick="editSubtask('${sub.id}', '${row.id}')" class="w-7 h-7 rounded bg-amber-50 text-amber-500 hover:bg-amber-500 hover:text-white transition-all flex items-center justify-center" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button onclick="deleteSubTask('${sub.id}')" class="w-7 h-7 rounded bg-rose-50 text-rose-500 hover:bg-rose-500 hover:text-white transition-all flex items-center justify-center" title="Hapus"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>` : ''}
                            </div>
                        </td>
                    </tr>
                    `;
                }).join('');

                return mainRow + subRows;
            }).join('');
        }

        async function saveMain(id) {
            const payload = {
                status: document.getElementById(`stat-${id}`).value,
                progress_percent: document.getElementById(`prog-${id}`).value,
                work_start_time: document.getElementById(`start-${id}`).value,
                work_end_time: document.getElementById(`end-${id}`).value,
                job_type: document.getElementById(`job-${id}`).value,
                hold_reason: document.getElementById(`hold-${id}`).value
            };
            const { error } = await _sb.from('management_tracker').update(payload).eq('id', id);
            if(!error) fetchRyanTasks();
        }

        // --- MODAL & LOGIC (SAME AS BEFORE) ---
        function openSubtaskModal() {
            document.getElementById('modal-title').innerText = "Tambah Rincian";
            document.getElementById('modal-subtask-id').value = ""; 
            document.getElementById('modal-parent-id').value = '';
            document.getElementById('modal-parent-id').disabled = false;
            document.getElementById('modal-desc').value = '';
            document.getElementById('subtaskModal').style.display = 'flex';
        }
        function editSubtask(subId, parentId) {
            const task = subTasksMap[parentId].find(t => t.id == subId);
            document.getElementById('modal-title').innerText = "Edit Rincian";
            document.getElementById('modal-subtask-id').value = subId;
            document.getElementById('modal-parent-id').value = parentId;
            document.getElementById('modal-parent-id').disabled = true;
            document.getElementById('modal-desc').value = task.subtask_desc;
            document.getElementById('modal-prio').value = task.priority;
            document.getElementById('modal-prog').value = task.progress_percent;
            document.getElementById('modal-start').value = cleanTimestamp(task.start_date);
            document.getElementById('modal-finish').value = cleanTimestamp(task.end_date);
            document.getElementById('modal-job').value = task.job_type;
            document.getElementById('modal-status').value = task.status;
            document.getElementById('modal-note').value = task.worker_notes;
            document.getElementById('subtaskModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('subtaskModal').style.display = 'none'; }
        
        async function saveSubtask() {
            const subId = document.getElementById('modal-subtask-id').value;
            const parentId = document.getElementById('modal-parent-id').value;
            const desc = document.getElementById('modal-desc').value;
            if(!parentId || !desc) return alert("Lengkapi data!");

            const payload = {
                parent_task_id: parentId,
                subtask_desc: desc,
                priority: document.getElementById('modal-prio').value,
                progress_percent: document.getElementById('modal-prog').value,
                start_date: document.getElementById('modal-start').value || null,
                end_date: document.getElementById('modal-finish').value || null,
                job_type: document.getElementById('modal-job').value,
                worker_notes: document.getElementById('modal-note').value,
                status: document.getElementById('modal-status').value
            };
            if(subId) await _sb.from('employee_subtasks').update(payload).eq('id', subId);
            else await _sb.from('employee_subtasks').insert([payload]);
            closeModal(); fetchRyanTasks();
        }

        async function deleteSubTask(id) {
            if(confirm("Hapus?")) { await _sb.from('employee_subtasks').delete().eq('id', id); fetchRyanTasks(); }
        }

        function filterTable() { 
            const query = document.getElementById('search-input').value.toLowerCase();
            const priorityFilter = document.getElementById('filter-priority').value;
            const filtered = allTasks.filter(task => {
                const matchesSearch = task.project_name.toLowerCase().includes(query) || (task.task_desc && task.task_desc.toLowerCase().includes(query));
                const matchesPriority = priorityFilter === "" || task.priority === priorityFilter;
                return matchesSearch && matchesPriority;
            });
            renderTasks(filtered);
        }

        function updateStats(data) {
             let p = 0, i = 0, h = 0, d = 0;
             data.forEach(d => { if(d.status=='Pending') p++; else if(d.status=='In Progress') i++; else if(d.status=='Hold') h++; else d++; });
             document.getElementById('stat-active').innerText = i;
             document.getElementById('stat-pending').innerText = p;
             document.getElementById('stat-hold').innerText = h;
             document.getElementById('stat-finished').innerText = d;
        }

        window.onload = fetchRyanTasks;
    </script>
</body>
</html>
